<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4df"/>
      <stop offset="65%" stop-color="#f7e8c9"/>
      <stop offset="100%" stop-color="#e5e8c2"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ec686"/>
      <stop offset="100%" stop-color="#7ca968"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87b86d"/>
      <stop offset="100%" stop-color="#659452"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e58669"/>
      <stop offset="100%" stop-color="#c96548"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="386" cy="126" r="54" fill="#fde395" opacity="0.55"/>
  <circle cx="386" cy="126" r="36" fill="#f7c85c"/>
  <!-- Soft clouds -->
  <g fill="#fffdf6" opacity="0.88">
    <ellipse cx="132" cy="122" rx="44" ry="20"/>
    <ellipse cx="164" cy="112" rx="30" ry="18"/>
    <ellipse cx="104" cy="126" rx="26" ry="14"/>
  </g>
  <!-- Hills -->
  <path d="M0 326 Q140 250 300 302 T512 286 L512 512 L0 512 Z" fill="url(#hillBack)"/>
  <path d="M0 368 Q180 318 350 366 T512 350 L512 512 L0 512 Z" fill="url(#hillFront)"/>
  <!-- Lotus Pond -->
  <ellipse cx="378" cy="422" rx="84" ry="34" fill="#7fc3cf" stroke="#5d9aa8" stroke-width="5"/>
  <ellipse cx="364" cy="416" rx="34" ry="10" fill="#a8dce4" opacity="0.7"/>
  <!-- Pink lotus blossom -->
  <g transform="translate(396,412)">
    <ellipse cx="0" cy="6" rx="22" ry="8" fill="#5e9a5a"/>
    <ellipse cx="-8" cy="-2" rx="9" ry="12" fill="#f7a8be" transform="rotate(-24)"/>
    <ellipse cx="8" cy="-2" rx="9" ry="12" fill="#f7a8be" transform="rotate(24)"/>
    <ellipse cx="0" cy="-5" rx="9" ry="14" fill="#ffc4d4"/>
    <circle cx="0" cy="-2" r="4" fill="#f9d25c"/>
  </g>
  <!-- Storybook Cottage -->
  <g transform="translate(88,162)">
    <!-- Chimney -->
    <rect x="176" y="18" width="28" height="62" rx="6" fill="#b87d65" stroke="#6e4c30" stroke-width="5"/>
    <!-- Smoke puffs -->
    <circle cx="196" cy="-2" r="11" fill="#fffdf8" opacity="0.82"/>
    <circle cx="212" cy="-24" r="15" fill="#fffdf8" opacity="0.65"/>
    <!-- Wall -->
    <rect x="34" y="100" width="188" height="122" rx="14" fill="#fff6e3" stroke="#6e4c30" stroke-width="7"/>
    <!-- Roof -->
    <path d="M8 112 L128 24 L248 112 Z" fill="url(#roof)" stroke="#6e4c30" stroke-width="7" stroke-linejoin="round"/>
    <!-- Door -->
    <path d="M104 222 L104 156 A24 24 0 0 1 152 156 L152 222 Z" fill="#a86d43" stroke="#6e4c30" stroke-width="6"/>
    <circle cx="140" cy="190" r="4.5" fill="#f8d474"/>
    <!-- Warm Glowing Windows -->
    <rect x="52" y="136" width="36" height="36" rx="8" fill="#fde38e" stroke="#6e4c30" stroke-width="5"/>
    <line x1="70" y1="136" x2="70" y2="172" stroke="#6e4c30" stroke-width="4"/>
    <line x1="52" y1="154" x2="88" y2="154" stroke="#6e4c30" stroke-width="4"/>
    <rect x="168" y="136" width="36" height="36" rx="8" fill="#fde38e" stroke="#6e4c30" stroke-width="5"/>
    <line x1="186" y1="136" x2="186" y2="172" stroke="#6e4c30" stroke-width="4"/>
    <line x1="168" y1="154" x2="204" y2="154" stroke="#6e4c30" stroke-width="4"/>
  </g>
  <!-- Little Daisy Flowers -->
  <g transform="translate(106,422)">
    <circle cx="-9" cy="0" r="8" fill="#fffdf6"/><circle cx="9" cy="0" r="8" fill="#fffdf6"/>
    <circle cx="0" cy="-9" r="8" fill="#fffdf6"/><circle cx="0" cy="9" r="8" fill="#fffdf6"/>
    <circle cx="0" cy="0" r="6" fill="#f5c249"/>
  </g>
  <g transform="translate(226,442) scale(0.85)">
    <circle cx="-9" cy="0" r="8" fill="#fffdf6"/><circle cx="9" cy="0" r="8" fill="#fffdf6"/>
    <circle cx="0" cy="-9" r="8" fill="#fffdf6"/><circle cx="0" cy="9" r="8" fill="#fffdf6"/>
    <circle cx="0" cy="0" r="6" fill="#f5c249"/>
  </g>
</svg>
