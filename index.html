<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口袋山谷 · Pocket Valley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f5efe2;
      --card: #fffaf0;
      --border: #d9c5a3;
      --foreground: #463222;
      --muted-foreground: #7e634a;
      --primary: #e07a5f;
      --primary-foreground: #ffffff;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 14px;
    }
    .storybook-frame {
      background: linear-gradient(180deg, #b88c62 0%, #966c47 100%);
      border: 3px solid #6e4c30;
      box-shadow: inset 0 2px 0 rgba(255, 245, 228, 0.45), 0 10px 28px rgba(42, 28, 16, 0.25);
    }
    .parchment {
      background: linear-gradient(180deg, #fffaf0 0%, #f7ecd6 100%);
      color: #4a3525;
      border: 1.5px solid #c5a176;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 3px 10px rgba(74, 53, 37, 0.14);
    }
    .slot-btn {
      background: linear-gradient(180deg, #fffdf7 0%, #f3e4c8 100%);
      border: 1.5px solid #b58d60;
      color: #4a3525;
      transition: transform 0.1s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .slot-btn:hover { transform: translateY(-1.5px); border-color: #d67a63; }
    .slot-btn.active {
      background: linear-gradient(180deg, #fffdf4 0%, #ffe6b8 100%);
      border-color: #e07a5f;
      box-shadow: 0 0 0 2px rgba(224, 122, 95, 0.45), 0 3px 8px rgba(74, 53, 37, 0.18);
      transform: translateY(-2px);
    }
    .btn-peach {
      background: linear-gradient(180deg, #e88d72 0%, #d46f53 100%);
      color: #fffdf9;
      border: 1.5px solid #9c4a34;
      text-shadow: 0 1px 1px rgba(80, 30, 15, 0.25);
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .btn-peach:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-peach:active:not(:disabled) { transform: translateY(0); }
    .btn-peach:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sage {
      background: linear-gradient(180deg, #74b078 0%, #58935c 100%);
      color: #fffdf9;
      border: 1.5px solid #3c6b3f;
      text-shadow: 0 1px 1px rgba(25, 55, 28, 0.25);
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .btn-sage:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-sage:disabled { opacity: 0.45; cursor: not-allowed; }
    .modal-backdrop {
      background: rgba(40, 30, 24, 0.52);
      backdrop-filter: blur(3px);
    }
    .num-tabular { font-variant-numeric: tabular-nums; }
    .fade-overlay { transition: opacity 0.4s ease; pointer-events: none; }
    .cozy-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .cozy-scroll::-webkit-scrollbar-track { background: rgba(181, 141, 96, 0.15); border-radius: 4px; }
    .cozy-scroll::-webkit-scrollbar-thumb { background: rgba(181, 141, 96, 0.5); border-radius: 4px; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-3 sm:p-4">
  <div class="max-w-[990px] mx-auto flex flex-col gap-2.5">

    <!-- Top Compact Header -->
    <div class="flex flex-wrap items-center justify-between gap-2 bg-[var(--card)] border border-[var(--border)] rounded-2xl px-3.5 py-2 shadow-sm">
      <div class="flex items-center gap-2.5">
        <span class="text-xl" aria-hidden="true">🌼</span>
        <div>
          <h1 id="uiGameTitle" class="text-sm font-bold leading-tight tracking-tight text-[var(--foreground)]">口袋山谷</h1>
          <p id="uiControlsLine" class="text-xs text-[var(--muted-foreground)] leading-tight">WASD 移动 · 点击或空格耕种 · E 互动/采摘/喂动物</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1.5 text-xs">
        <button id="btnAreaToggle" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 font-semibold flex items-center gap-1 cursor-pointer">
          <span id="uiAreaToggleIcon">🐮</span><span id="uiAreaToggleLabel">去牧场</span>
        </button>
        <button id="btnKitchen" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🍳</span><span id="uiKitchenBtn">厨房</span>
        </button>
        <button id="btnShopShortcut" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🧺</span><span id="uiShopBtn">花种铺</span>
        </button>
        <button id="btnRanchShopShortcut" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🥛</span><span id="uiRanchShopBtn">牧场铺</span>
        </button>
        <button id="btnSatchel" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>💐</span><span id="uiSatchelBtn">花篮</span>
          <span id="satchelBadge" class="px-1.5 py-0.5 rounded-full text-[11px] font-bold bg-[var(--primary)] text-[var(--primary-foreground)] num-tabular">0</span>
        </button>
        <button id="btnDress" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>👗</span><span id="uiDressLabel">换装</span>
        </button>
        <button id="btnLang" class="px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-semibold flex items-center gap-1 cursor-pointer">
          <span>🌐</span><span id="uiLangLabel">EN</span>
        </button>
        <button id="btnSleepQuick" class="px-2 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium cursor-pointer" title="Sleep / 休息">🌙</button>
        <button id="btnSound" class="px-2 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium cursor-pointer">🔊</button>
        <button id="btnHelp" class="px-2 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium cursor-pointer">❓</button>
        <button id="btnReset" class="px-2 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium text-[var(--muted-foreground)] cursor-pointer">↺</button>
      </div>
    </div>

    <!-- Main Storybook Game Frame -->
    <div class="storybook-frame rounded-2xl p-2.5 relative overflow-hidden">

      <!-- In-Game HUD Overlay Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-0.5">
        <div class="parchment rounded-xl px-3 py-1.5 flex items-center gap-2 text-xs font-semibold">
          <span id="hudAreaPill" class="px-1.5 py-0.5 rounded-lg bg-[#e9d5b2] text-[#5c3c22] text-[11px] font-bold">🏡 农庄</span>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudSeasonIcon">🌸</span>
            <span id="hudDate" class="num-tabular">春季 第1天</span>
          </div>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudClockIcon">☀️</span>
            <span id="hudTime" class="num-tabular font-bold">上午 6:00</span>
          </div>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudWeatherIcon">☀️</span>
            <span id="hudWeatherText">晴朗</span>
          </div>
          <span class="opacity-30 hidden md:inline">|</span>
          <div class="hidden md:flex items-center gap-1 text-[11px] opacity-80">
            <span id="uiForecastLabel">明日:</span>
            <span id="hudForecastIcon">☀️</span>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-1.5">
          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-2 text-xs font-bold num-tabular">
            <span class="flex items-center gap-1 text-amber-800"><span>🪙</span><span id="hudGold">150</span>g</span>
            <span id="hudShippedWrap" class="hidden items-center gap-0.5 text-emerald-700 text-[11px]"><span>📦</span>+<span id="hudPendingGold">0</span>g</span>
            <span class="opacity-25">|</span>
            <span class="flex items-center gap-0.5 text-[#7a542e]" title="Animal Feed / 牧草饲料"><span>🌾</span><span id="hudFeed">5</span></span>
          </div>

          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-1.5 text-xs font-semibold">
            <span>🍀</span>
            <div class="w-14 sm:w-16 h-2.5 bg-[#e5d5b7] rounded-full overflow-hidden border border-[#bfa078]">
              <div id="hudEnergyBar" class="h-full bg-emerald-500 transition-all duration-150" style="width:100%"></div>
            </div>
            <span id="hudEnergyText" class="num-tabular text-[11px] w-6 text-right">100</span>
          </div>

          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-1.5 text-xs font-semibold">
            <span>💧</span>
            <div class="w-12 sm:w-14 h-2.5 bg-[#e5d5b7] rounded-full overflow-hidden border border-[#bfa078]">
              <div id="hudWaterBar" class="h-full bg-sky-400 transition-all duration-150" style="width:100%"></div>
            </div>
            <span id="hudWaterText" class="num-tabular text-[11px]">20/20</span>
          </div>
        </div>
      </div>

      <!-- Canvas Container -->
      <div class="relative rounded-2xl overflow-hidden bg-[#7ab464] border-2 border-[#6e4c30]">
        <canvas id="gameCanvas" width="768" height="512"></canvas>

        <!-- Contextual Action Pill -->
        <div id="contextHint" class="hidden absolute bottom-2.5 left-2.5 parchment rounded-xl px-3 py-1.5 text-xs font-semibold shadow-md pointer-events-none flex items-center gap-1.5">
          <span id="contextHintIcon">✨</span>
          <span id="contextHintText"></span>
        </div>

        <!-- Top-Right Banner (Seasonal Bonus on Farm / Pasture Status on Pasture) -->
        <div id="topRightPill" class="absolute top-2.5 right-2.5 parchment rounded-xl px-3 py-1 text-[11px] font-semibold opacity-95 pointer-events-none"></div>

        <!-- Sleep / Area Fade Overlay -->
        <div id="fadeOverlay" class="fade-overlay absolute inset-0 bg-[#1e1d30] opacity-0 flex items-center justify-center">
          <div id="fadeMessage" class="text-amber-100 text-base sm:text-lg font-bold tracking-wide px-4 text-center"></div>
        </div>

        <!-- Modal Overlay Layer -->
        <div id="modalOverlay" class="hidden absolute inset-0 modal-backdrop flex items-center justify-center p-3 z-20">
          <div id="modalCard" class="parchment rounded-2xl w-full max-w-[580px] max-h-[93%] flex flex-col overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-2.5 border-b border-[#d6ba91] bg-[#f4e4c5]">
              <div class="flex items-center gap-2">
                <span id="modalIcon" class="text-lg">🌸</span>
                <h2 id="modalTitle" class="font-bold text-sm sm:text-base text-[#4a3525]"></h2>
              </div>
              <button id="modalCloseBtn" class="w-7 h-7 rounded-xl bg-[#e6d0a8] hover:bg-[#dac092] border border-[#b58d60] text-[#4a3525] font-bold text-xs flex items-center justify-center cursor-pointer">✕</button>
            </div>
            <div id="modalBody" class="p-3.5 overflow-y-auto cozy-scroll text-xs sm:text-sm space-y-3"></div>
            <div id="modalFooter" class="px-4 py-2.5 border-t border-[#d6ba91] bg-[#f4e4c5] flex items-center justify-between gap-2 text-xs"></div>
          </div>
        </div>
      </div>

      <!-- Two-Strip Compact Hotbar: Row 1 Tools & Gear + Row 2 All 10 Seeds -->
      <div class="mt-2 flex flex-col gap-1.5">
        <div class="flex flex-col sm:flex-row gap-1.5">
          <div id="hotbarTools" class="grid grid-cols-5 gap-1.5 sm:w-[37%]"></div>
          <div id="hotbarSeeds" class="grid grid-cols-5 sm:grid-cols-10 gap-1 sm:w-[63%]"></div>
        </div>
        <div class="flex items-center justify-between px-1 text-[11px] text-amber-50/95">
          <span id="selectedToolInfo"></span>
          <span id="uiHotbarHint" class="hidden sm:inline opacity-85"></span>
        </div>
      </div>
    </div>

    <!-- Subtle Footer Status / Stats -->

      <div class="flex flex-wrap items-center gap-3">
        <span><span id="uiStatHarvestLabel">🌾 收获</span>: <strong id="statHarvested" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatAnimalsLabel">🐮 牧场动物</span>: <strong id="statAnimals" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatDishesLabel">🍳 料理</span>: <strong id="statDishes" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatGoldLabel">🪙 累计金币</span>: <strong id="statLifetimeGold" class="text-[var(--foreground)] num-tabular">0g</strong></span>
      </div>
      <div id="saveStatus" class="text-xs opacity-80"></div>
    </div>
  </div>

  // COZY AUDIO ENGINE
  // =========================================================================
  const AudioFX = {
    ctx: null, muted: false,
    ensure() {
      if (this.muted) return null;
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return this.ctx;
    },
    tone(freq, dur = 0.08, type = 'sine', vol = 0.1, slideTo = null, delay = 0) {
      const ctx = this.ensure(); if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    },
    noise(dur = 0.08, vol = 0.07, filterFreq = 900) {
      const ctx = this.ensure(); if (!ctx) return;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = filterFreq;
      const gain = ctx.createGain(); const now = ctx.currentTime;
      gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start(now);
    },
    hoe() { this.noise(0.08, 0.09, 580); this.tone(160, 0.07, 'triangle', 0.1, 95); },
    water() { this.noise(0.14, 0.08, 1900); this.tone(460, 0.1, 'sine', 0.06, 720); },
    plant() { this.tone(392, 0.06, 'sine', 0.09, 523); },
    harvest() { this.tone(587, 0.08, 'triangle', 0.11, 740); this.tone(880, 0.13, 'sine', 0.11, 987, 0.06); },
    cook() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.09, null, i * 0.07)); },
    pet() { this.tone(680, 0.07, 'sine', 0.09, 920); this.tone(880, 0.09, 'sine', 0.08, 1080, 0.06); },
    coin() { this.tone(1046, 0.07, 'sine', 0.09); this.tone(1396, 0.14, 'sine', 0.1, null, 0.06); },
    chop() { this.noise(0.06, 0.1, 780); this.tone(210, 0.06, 'triangle', 0.08, 120); },
    error() { this.tone(200, 0.09, 'triangle', 0.06, 150); },
    ui() { this.tone(660, 0.04, 'sine', 0.05, 780); },
    morning() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.24, 'sine', 0.08, null, i * 0.09)); },
    place() { this.tone(300, 0.08, 'triangle', 0.09, 390); }
  };

  function hash2(x, y) {
    let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }

  function buildFarmMap() {
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE_TYPE.GRASS));
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) map[y][x] = TILE_TYPE.WALL;
      }
    }
    // Open East Gate to Sunny Pasture at x=23, y=5..7!
    map[5][23] = TILE_TYPE.PATH;
    map[6][23] = TILE_TYPE.PATH;
    map[7][23] = TILE_TYPE.GRASS;

    const extraTrees = [
      [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],[20,1],[21,1],[22,1],
      [1,2],[1,3],[1,4],[22,2],[22,3],[22,14],[1,14],[2,14]
    ];
    for (const [x, y] of extraTrees) map[y][x] = TILE_TYPE.WALL;

    // Cottage (2..5, 2..4), Mailbox (6,4), Shipping Bin (7,4), Pip's Shop (16..20, 2..4), Signpost (22,4)
    for (let y = 2; y <= 4; y++) for (let x = 2; x <= 5; x++) map[y][x] = TILE_TYPE.WALL;
    map[4][6] = TILE_TYPE.WALL;
    map[4][7] = TILE_TYPE.WALL;
    map[4][22] = TILE_TYPE.WALL; // signpost to pasture
    for (let y = 2; y <= 4; y++) for (let x = 16; x <= 20; x++) map[y][x] = TILE_TYPE.WALL;

    // Paths (extending to East Gate!)
    for (let x = 3; x <= 23; x++) map[5][x] = TILE_TYPE.PATH;
    map[6][11] = TILE_TYPE.PATH;
    map[6][12] = TILE_TYPE.PATH;
    map[6][18] = TILE_TYPE.PATH;
    map[6][22] = TILE_TYPE.PATH;

    // Farmable meadow (3..15, 7..13)
    for (let y = 7; y <= 13; y++) for (let x = 3; x <= 15; x++) map[y][x] = TILE_TYPE.FARMABLE;

    // Lotus Pond (18..21, 9..13) + Dock
    for (let y = 9; y <= 13; y++) {
      for (let x = 18; x <= 21; x++) {
        if ((x === 18 && y === 9) || (x === 21 && y === 13)) continue;
        map[y][x] = TILE_TYPE.WATER;
      }
    }
    map[11][17] = TILE_TYPE.DOCK;
    map[11][18] = TILE_TYPE.DOCK;
    return map;
  }

  function buildPastureMap() {
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE_TYPE.GRASS));
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) map[y][x] = TILE_TYPE.WALL;
      }
    }
    // Open West Gate back to Home Farm at x=0, y=5..7!
    map[5][0] = TILE_TYPE.PATH;
    map[6][0] = TILE_TYPE.PATH;
    map[7][0] = TILE_TYPE.GRASS;

    const trees = [
      [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],[20,1],[21,1],[22,1],
      [1,2],[1,3],[22,2],[22,3],[22,4],[22,14],[1,14],[2,14],[21,14]
    ];
    for (const [x, y] of trees) map[y][x] = TILE_TYPE.WALL;

    // Signpost back to farm (1,4)
    map[4][1] = TILE_TYPE.WALL;
    // Storybook Red Barn (3..7, 2..4)
    for (let y = 2; y <= 4; y++) for (let x = 3; x <= 7; x++) map[y][x] = TILE_TYPE.WALL;
    // Feed Trough (9..10, 4)
    map[4][9] = TILE_TYPE.WALL;
    map[4][10] = TILE_TYPE.WALL;
    // Millie's Ranch & Pantry Shop (15..20, 2..4)
    for (let y = 2; y <= 4; y++) for (let x = 15; x <= 20; x++) map[y][x] = TILE_TYPE.WALL;

    // Stone path from West Gate across Barn, Trough, Shop
    for (let x = 0; x <= 20; x++) map[5][x] = TILE_TYPE.PATH;
    map[6][1] = TILE_TYPE.PATH;
    map[6][9] = TILE_TYPE.PATH;
    map[6][10] = TILE_TYPE.PATH;
    map[6][17] = TILE_TYPE.PATH;

    // Clover Animal Pasture (3..16, 7..13)
    for (let y = 7; y <= 13; y++) for (let x = 3; x <= 16; x++) map[y][x] = TILE_TYPE.PASTURE;

    // Duck Stream Pond (18..21, 8..13)
    for (let y = 8; y <= 13; y++) {
      for (let x = 18; x <= 21; x++) {
        if ((x === 18 && y === 8) || (x === 21 && y === 13) || (x === 18 && y === 13)) continue;
        map[y][x] = TILE_TYPE.WATER;
      }
    }
    return map;
  }

  const MAPS = { farm: buildFarmMap(), pasture: buildPastureMap() };
  function curMap() { return MAPS[state.area] || MAPS.farm; }

  // =========================================================================
  // STATE MANAGEMENT
  // =========================================================================
  function createInitialState(keepLang = 'zh', keepDress = 0) {
    const farm = {};
    for (let y = 8; y <= 9; y++) {
      for (let x = 6; x <= 9; x++) {
        farm[`${x},${y}`] = { tilled: true, watered: false, crop: null, debris: null, placeable: null };
      }
    }
    farm['6,8'].crop = { id: 'turnip', daysGrown: 1 };
    farm['7,8'].crop = { id: 'wheat', daysGrown: 1 };

    const debrisList = [
      [3,7,'weed'], [4,7,'twig'], [14,7,'stone'], [15,7,'weed'],
      [3,12,'stone'], [4,13,'twig'], [13,13,'stone'], [15,12,'twig'],
      [14,13,'weed'], [3,10,'weed'], [15,9,'stone'], [12,7,'twig']
    ];
    for (const [x, y, type] of debrisList) {
      farm[`${x},${y}`] = { tilled: false, watered: false, crop: null, debris: type, placeable: null };
    }

    const seeds = {};
    for (const cid of CROP_ORDER) seeds[cid] = 0;
    seeds.turnip = 5;
    seeds.wheat = 3;

    // Start with 1 friendly starter Chicken in the pasture so the ranch already feels alive!
    const starterAnimals = [
      { id: 'a1', type: 'chicken', x: 7.5 * TILE, y: 9.5 * TILE, tx: 8.5 * TILE, ty: 10 * TILE, wait: 1.5, dir: 1, fed: false, petted: false, hearts: 1 }
    ];

    return {
      lang: keepLang,
      dressIdx: keepDress,
      area: 'farm',
      day: 1,
      seasonIdx: 0,
      timeMinutes: 6 * 60,
      weather: 'sunny',
      nextWeather: 'sunny',
      gold: 200,
      lifetimeGold: 0,
      totalHarvested: 0,
      totalCooked: 0,
      wood: 0,
      stone: 0,
      energy: 100,
      maxEnergy: 100,
      water: 20,
      hoeLevel: 1,
      canLevel: 1,
      luckyCharm: false,
      kitchenUnlocked: false,
      autoFeeder: false,
      feed: 5,
      selectedSlot: 0,
      seeds,
      placeables: { sprinkler: 0, lantern: 0 },
      satchel: {},      // crops & produce: `${id}_${quality}` -> count
      pantry: {},       // bought staples: `${itemId}` -> count (flour, sugar, butter, honey)
      dishes: {},       // cooked dishes: `${recipeId}` -> count
      shippingBin: {},  // `crop:${id}_${q}` or `prod:${id}_${q}` or `dish:${id}` -> count
      animals: starterAnimals,
      pastureDrops: [], // { id, itemId, quality, x, y }
      farm,
      unreadMail: true,
      player: { x: 4.5 * TILE, y: 6.2 * TILE, dir: 'down', walkFrame: 0, swingTimer: 0, swingTool: null }
    };
  }

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.day === 'number' && parsed.farm) {
          const base = createInitialState(parsed.lang || 'zh', parsed.dressIdx || 0);
          return {
            ...base,
            ...parsed,
            seeds: { ...base.seeds, ...(parsed.seeds || {}) },
            placeables: { ...base.placeables, ...(parsed.placeables || {}) },
            pantry: { ...(parsed.pantry || {}) },
            dishes: { ...(parsed.dishes || {}) },
            animals: Array.isArray(parsed.animals) ? parsed.animals : base.animals,
            pastureDrops: Array.isArray(parsed.pastureDrops) ? parsed.pastureDrops : [],
            player: { ...base.player, ...(parsed.player || {}) }
          };
        }
      }
    } catch (e) {}
    return createInitialState('zh', 0);
  }

  function saveState(quiet = false) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      if (!quiet) {
        const el = document.getElementById('saveStatus');
        if (el) el.textContent = T().savedAt(getSeasonName(), state.day);
      }
    } catch (e) {}
  }

  function T() { return I18N[state.lang === 'en' ? 'en' : 'zh']; }
  function L(obj) { return obj[state.lang === 'en' ? 'en' : 'zh']; }
  function getSeason() { return SEASONS[state.seasonIdx % SEASONS.length]; }
  function getSeasonName() { return L(getSeason().name); }
  function getDress() { return DRESS_THEMES[state.dressIdx % DRESS_THEMES.length]; }
  function getCanCapacity() { return state.canLevel === 1 ? 20 : state.canLevel === 2 ? 36 : 60; }
  function getTileData(x, y) { return state.farm[`${x},${y}`] || null; }
  function ensureTileData(x, y) {
    const k = `${x},${y}`;
    if (!state.farm[k]) state.farm[k] = { tilled: false, watered: false, crop: null, debris: null, placeable: null };
    return state.farm[k];
  }

  function getItemMeta(id) {
    if (CROPS[id]) return { ...CROPS[id], source: 'crop' };
    if (ITEMS[id]) return { ...ITEMS[id], source: ITEMS[id].kind };
    if (RECIPE_MAP[id]) return { ...RECIPE_MAP[id], source: 'dish' };
    return null;
  }

  function getSellValue(id, quality = 0) {
    if (CROPS[id]) {
      let val = CROPS[id].sellPrice;
      if (getSeason().bonus.includes(id)) val = Math.round(val * 1.2);
      if (quality === 1) val = Math.round(val * 1.5);
      return val;
    }
    if (ITEMS[id]) {
      let val = ITEMS[id].sellPrice;
      if (quality === 1) val = Math.round(val * 1.5);
      return val;
    }
    if (RECIPE_MAP[id]) return RECIPE_MAP[id].sellPrice;
    return 0;
  }

  // Ingredient counting & consumption for cooking (works across crops, produce, and bought pantry!)
  function getAvailableIngredientCount(ingId) {
    if (ITEMS[ingId] && ITEMS[ingId].kind === 'pantry') {
      return state.pantry[ingId] || 0;
    }
    // Crops & produce (egg, milk, duckEgg, turnip, etc.): count normal + gold quality in satchel (+ pantry fallback if bought)
    const normal = state.satchel[`${ingId}_0`] || 0;
    const gold = state.satchel[`${ingId}_1`] || 0;
    const pantryExtra = state.pantry[ingId] || 0;
    return normal + gold + pantryExtra;
  }

  function consumeIngredient(ingId, qty) {
    let rem = qty;
    // Prefer bought pantry stock first, then normal satchel, then gold satchel
    if (state.pantry[ingId]) {
      const take = Math.min(rem, state.pantry[ingId]);
      state.pantry[ingId] -= take;
      if (state.pantry[ingId] <= 0) delete state.pantry[ingId];
      rem -= take;
    }
    for (const q of [0, 1]) {
      if (rem <= 0) break;
      const k = `${ingId}_${q}`;
      if (state.satchel[k]) {
        const take = Math.min(rem, state.satchel[k]);
        state.satchel[k] -= take;
        if (state.satchel[k] <= 0) delete state.satchel[k];
        rem -= take;
      }
    }
  }

  function canCookRecipe(recipe) {
    for (const [ing, qty] of Object.entries(recipe.ingredients)) {
      if (getAvailableIngredientCount(ing) < qty) return false;
    }
    return true;
  }

  // =========================================================================
  // HOTBAR SLOTS (5 tools/placeables + 10 seeds = 15 clean slots!)
  // =========================================================================
  function getAllHotbarSlots() {
    const tr = T().tools;
    const hoeName = tr.hoe[state.hoeLevel - 1];
    const canName = tr.can[state.canLevel - 1];
    const sprCount = state.placeables.sprinkler || 0;
    const lanCount = state.placeables.lantern || 0;

    const toolSlots = [
      { id: 'hoe', kind: 'tool', label: hoeName, icon: '⛏️', count: null, desc: `${hoeName} (Lv.${state.hoeLevel}) — ${tr.hoeDesc[state.hoeLevel - 1]}` },
      { id: 'can', kind: 'tool', label: canName, icon: '🚿', count: `${state.water}`, desc: `${canName} (${state.water}/${getCanCapacity()}) — ${tr.canDesc[state.canLevel - 1]}` },
      { id: 'scythe', kind: 'tool', label: tr.scythe, icon: '🌿', count: null, desc: `${tr.scythe} — ${tr.scytheDesc}` },
      { id: 'sprinkler', kind: 'placeable', label: tr.sprinkler, icon: '💦', count: sprCount, desc: tr.sprinklerDesc(sprCount) },
      { id: 'lantern', kind: 'placeable', label: tr.lantern, icon: '🏮', count: lanCount, desc: tr.lanternDesc(lanCount) }
    ];

    const seedSlots = CROP_ORDER.map(cid => {
      const c = CROPS[cid], cname = L(c.name), cnt = state.seeds[cid] || 0;
      return {
        id: cid, kind: 'seed', label: cname, icon: c.emoji, count: cnt,
        desc: tr.seedDesc(cname, cnt, c.days, getSellValue(cid, 0), c.regrow)
      };
    });

    return { toolSlots, seedSlots, all: [...toolSlots, ...seedSlots] };
  }

  // =========================================================================
  // PARTICLES, FLOATING TEXT & AMBIENT
  // =========================================================================
  const particles = [];
  const floatingTexts = [];
  const ambientDrops = [];
  const smokePuffs = [];

  function spawnParticles(wx, wy, color, count = 8, speed = 1.6, size = 3.5) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 0.9) * speed;
      particles.push({ x: wx, y: wy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2, g: 0.11, life: 1, decay: 0.028 + Math.random() * 0.024, color, size: size + Math.random() * 1.4 });
    }
  }
  function addFloatText(wx, wy, text, color = '#fffdf2') {
    floatingTexts.push({ x: wx, y: wy, text, color, life: 1, vy: -0.5 });
  }

  // =========================================================================
  // CANVAS SETUP & INPUT
  // =========================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CANVAS_W * DPR;
  canvas.height = CANVAS_H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const keys = {};
  let mouseTile = { x: -1, y: -1, inside: false };
  let walkTarget = null;
  let modalOpen = false;
  let isTransitioning = false;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOpen) { closeModal(); return; }
    if (modalOpen || isTransitioning) return;
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k) || e.key === ' ') e.preventDefault();
    keys[k] = true;
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) walkTarget = null;

    if (k >= '1' && k <= '9') selectSlot(parseInt(k, 10) - 1);
    else if (k === '0') selectSlot(9);
    else if (k === ' ') performPrimaryAction(getFacedTile().x, getFacedTile().y);
    else if (k === 'e') performSmartInteract();
    else if (k === 'b') state.area === 'pasture' ? openRanchShopModal() : openShopModal();
    else if (k === 'c') openKitchenModal();
    else if (k === 'i' || k === 'tab') { e.preventDefault(); openSatchelModal(); }
    else if (k === 'm') toggleSound();
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseTile.x = Math.floor(((e.clientX - rect.left) * (CANVAS_W / rect.width)) / TILE);
    mouseTile.y = Math.floor(((e.clientY - rect.top) * (CANVAS_H / rect.height)) / TILE);
    mouseTile.inside = true;
  });
  canvas.addEventListener('mouseleave', () => { mouseTile.inside = false; });
  canvas.addEventListener('wheel', (e) => {
    if (modalOpen) return;
    e.preventDefault();
    const len = getAllHotbarSlots().all.length;
    selectSlot((state.selectedSlot + (e.deltaY > 0 ? 1 : -1) + len) % len);
  }, { passive: false });
  canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!modalOpen && !isTransitioning) handleCanvasClick(e, true); });
  canvas.addEventListener('mousedown', (e) => { if (!modalOpen && !isTransitioning && e.button === 0) handleCanvasClick(e, false); });

  function switchArea(targetArea, spawnX = null, spawnY = null) {
    if (state.area === targetArea || isTransitioning) return;
    state.area = targetArea;
    walkTarget = null;
    particles.length = 0;
    if (spawnX !== null && spawnY !== null) {
      state.player.x = spawnX; state.player.y = spawnY;
    } else if (targetArea === 'pasture') {
      state.player.x = 1.6 * TILE; state.player.y = 5.6 * TILE; state.player.dir = 'right';
    } else {
      state.player.x = 22.2 * TILE; state.player.y = 5.6 * TILE; state.player.dir = 'left';
    }
    AudioFX.ui();
    updateHUD();
  }

  function handleCanvasClick(e, isRightClick) {
    AudioFX.ensure();
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
    const sy = (e.clientY - rect.top) * (CANVAS_H / rect.height);
    const tx = Math.floor(sx / TILE), ty = Math.floor(sy / TILE);
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;

    const ptx = state.player.x / TILE, pty = state.player.y / TILE;
    const dist = Math.hypot(tx + 0.5 - ptx, ty + 0.5 - pty);

    // Check Pasture drops or Animals clicked directly!
    if (state.area === 'pasture') {
      const drop = state.pastureDrops.find(d => Math.hypot(d.x - sx, d.y - sy) < 22);
      if (drop) {
        if (Math.hypot(drop.x - state.player.x, drop.y - state.player.y) < 70) collectDrop(drop.id);
        else walkTarget = { x: drop.x, y: drop.y, stopDist: 0.4, onArrive: () => collectDrop(drop.id) };
        return;
      }
      const ani = state.animals.find(a => Math.hypot(a.x - sx, a.y - sy) < 24);
      if (ani) {
        if (Math.hypot(ani.x - state.player.x, ani.y - state.player.y) < 75) petOrFeedAnimal(ani);
        else walkTarget = { x: ani.x, y: ani.y, stopDist: 0.9, onArrive: () => petOrFeedAnimal(ani) };
        return;
      }
    }

    const lm = getLandmarkAt(tx, ty);
    if (lm) {
      if (dist <= 3.2) { faceToward(tx, ty); triggerLandmark(lm); }
      else {
        const dest = getLandmarkStandTile(lm);
        walkTarget = { x: (dest.x + 0.5) * TILE, y: (dest.y + 0.5) * TILE, onArrive: () => { faceToward(tx, ty); triggerLandmark(lm); } };
      }
      return;
    }

    if (curMap()[ty][tx] === TILE_TYPE.WATER) {
      if (dist <= 2.6) { faceToward(tx, ty); refillWater(); }
      else walkTarget = { x: (state.area === 'farm' ? 17.5 : 17.2) * TILE, y: 11.5 * TILE, onArrive: () => { faceToward(18, 11); refillWater(); } };
      return;
    }

    if (state.area === 'farm' && dist <= 2.15) {
      faceToward(tx, ty);
      if (isRightClick) tryHarvestOrInteractTile(tx, ty);
      else performPrimaryAction(tx, ty);
    } else {
      const stopDist = (state.area === 'farm' && curMap()[ty][tx] === TILE_TYPE.FARMABLE) ? 1.05 : 0.2;
      walkTarget = {
        x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, stopDist,
        onArrive: () => {
          if (state.area === 'farm' && curMap()[ty][tx] === TILE_TYPE.FARMABLE) {
            faceToward(tx, ty);
            if (isRightClick) tryHarvestOrInteractTile(tx, ty);
            else performPrimaryAction(tx, ty);
          }
        }
      };
    }
  }

  function faceToward(tx, ty) {
    const dx = (tx + 0.5) * TILE - state.player.x, dy = (ty + 0.5) * TILE - state.player.y;
    if (Math.abs(dx) > Math.abs(dy)) state.player.dir = dx >= 0 ? 'right' : 'left';
    else state.player.dir = dy >= 0 ? 'down' : 'up';
  }
  function getFacedTile() {
    const cx = Math.floor(state.player.x / TILE), cy = Math.floor(state.player.y / TILE);
    if (state.player.dir === 'up') return { x: cx, y: cy - 1 };
    if (state.player.dir === 'down') return { x: cx, y: cy + 1 };
    if (state.player.dir === 'left') return { x: cx - 1, y: cy };
    return { x: cx + 1, y: cy };
  }

  // =========================================================================
  // LANDMARKS & INTERACTION (Both Areas)
  // =========================================================================
  function getLandmarkAt(tx, ty) {
    if (state.area === 'farm') {
      if (tx >= 2 && tx <= 5 && ty >= 2 && ty <= 4) return 'cottage';
      if (tx === 6 && ty === 4) return 'mailbox';
      if (tx === 7 && ty === 4) return 'shipping';
      if (tx >= 16 && tx <= 20 && ty >= 2 && ty <= 4) return 'shop';
      if ((tx === 22 && ty === 4) || (tx === 23 && ty >= 5 && ty <= 7)) return 'gateToPasture';
    } else {
      if (tx >= 3 && tx <= 7 && ty >= 2 && ty <= 4) return 'barn';
      if ((tx === 9 || tx === 10) && ty === 4) return 'trough';
      if (tx >= 15 && tx <= 20 && ty >= 2 && ty <= 4) return 'ranchShop';
      if ((tx === 1 && ty === 4) || (tx === 0 && ty >= 5 && ty <= 7)) return 'gateToFarm';
    }
    return null;
  }

  function getLandmarkStandTile(lm) {
    const map = {
      cottage: { x: 3.5, y: 5 }, mailbox: { x: 6, y: 5 }, shipping: { x: 7, y: 5 },
      shop: { x: 18, y: 5 }, gateToPasture: { x: 22.2, y: 5.5 },
      barn: { x: 5, y: 5 }, trough: { x: 9.5, y: 5 }, ranchShop: { x: 17.5, y: 5 },
      gateToFarm: { x: 1.5, y: 5.5 }
    };
    return map[lm] || { x: 4, y: 6 };
  }

  function triggerLandmark(lm) {
    if (lm === 'cottage') openCottageModal();
    else if (lm === 'shop') openShopModal();
    else if (lm === 'shipping') shipAllFromSatchel();
    else if (lm === 'mailbox') openMailboxModal();
    else if (lm === 'gateToPasture') switchArea('pasture');
    else if (lm === 'gateToFarm') switchArea('farm');
    else if (lm === 'barn') openBarnModal();
    else if (lm === 'trough') feedAllHungryAnimals();
    else if (lm === 'ranchShop') openRanchShopModal();
  }

  function getNearbyContext() {
    const ptx = state.player.x / TILE, pty = state.player.y / TILE;
    const faced = getFacedTile();
    const c = T().ctx;

    if (state.area === 'pasture') {
      // Nearest collectible drop
      const drop = state.pastureDrops.find(d => Math.hypot(d.x - state.player.x, d.y - state.player.y) < 42);
      if (drop) return { icon: ITEMS[drop.itemId].emoji, text: c.collectDrop(L(ITEMS[drop.itemId].name)), action: () => collectDrop(drop.id) };
      // Nearest animal
      const ani = state.animals.find(a => Math.hypot(a.x - state.player.x, a.y - state.player.y) < 44);
      if (ani) return { icon: ANIMALS[ani.type].emoji, text: c.petAnimal(L(ANIMALS[ani.type].name), ani.fed), action: () => petOrFeedAnimal(ani) };
    }

    const lm = getLandmarkAt(faced.x, faced.y);
    if (lm === 'cottage') return { icon: '🏡', text: c.cottage(state.kitchenUnlocked), action: () => openCottageModal() };
    if (lm === 'shop') return { icon: '🌸', text: c.shop, action: () => openShopModal() };
    if (lm === 'ranchShop') return { icon: '🥛', text: c.ranchShop, action: () => openRanchShopModal() };
    if (lm === 'barn') return { icon: '🏠', text: c.barn, action: () => openBarnModal() };
    if (lm === 'trough') {
      const hungry = state.animals.filter(a => !a.fed).length;
      return { icon: '🌾', text: c.trough(hungry), action: () => feedAllHungryAnimals() };
    }
    if (lm === 'gateToPasture') return { icon: '🐮', text: c.gateToPasture, action: () => switchArea('pasture') };
    if (lm === 'gateToFarm') return { icon: '🏡', text: c.gateToFarm, action: () => switchArea('farm') };
    if (lm === 'shipping') {
      const n = getShippableBasketCount();
      return { icon: '📦', text: n > 0 ? c.shippingSome(n) : c.shippingEmpty, action: () => shipAllFromSatchel() };
    }
    if (lm === 'mailbox') return { icon: '📬', text: state.unreadMail ? c.mailUnread : c.mailRead, action: () => openMailboxModal() };

    if (isNearWater(ptx, pty) && state.water < getCanCapacity()) {
      return { icon: '💧', text: c.refill, action: () => refillWater() };
    }
    if (state.area === 'farm') {
      const td = getTileData(faced.x, faced.y);
      if (td && td.crop && isCropRipe(td.crop)) {
        return { icon: CROPS[td.crop.id].emoji, text: c.harvest(L(CROPS[td.crop.id].name)), action: () => harvestTile(faced.x, faced.y) };
      }
    }
    return null;
  }

  function isNearWater(ptx, pty) {
    const cx = Math.floor(ptx), cy = Math.floor(pty), m = curMap();
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && m[ny][nx] === TILE_TYPE.WATER) return true;
    }
    return false;
  }

  function performSmartInteract() {
    const hint = getNearbyContext();
    if (hint && hint.action) { hint.action(); return; }
    const f = getFacedTile();
    tryHarvestOrInteractTile(f.x, f.y);
  }

  function tryHarvestOrInteractTile(tx, ty) {
    const lm = getLandmarkAt(tx, ty);
    if (lm) { triggerLandmark(lm); return; }
    if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && curMap()[ty][tx] === TILE_TYPE.WATER) { refillWater(); return; }
    if (state.area === 'farm') {
      const td = getTileData(tx, ty);
      if (td && td.crop && isCropRipe(td.crop)) { harvestTile(tx, ty); return; }
      if (td && td.placeable) {
        const p = td.placeable; td.placeable = null;
        state.placeables[p] = (state.placeables[p] || 0) + 1;
        AudioFX.place();
        addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.pickedUp(p === 'sprinkler' ? T().tools.sprinkler : T().tools.lantern), '#fff3c4');
        renderHotbar(); return;
      }
      performPrimaryAction(tx, ty);
    }
  }

  // =========================================================================
  // PASTURE ANIMAL CARE (Feed, Pet, Collect Drops)
  // =========================================================================
  function feedAllHungryAnimals() {
    if (state.animals.length === 0) {
      AudioFX.error(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.noAnimals, '#fde68a'); return;
    }
    const hungry = state.animals.filter(a => !a.fed);
    if (hungry.length === 0) {
      AudioFX.ui(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.allFed, '#bbf7d0'); return;
    }
    if (state.feed <= 0) {
      AudioFX.error(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.noFeed, '#fecaca'); return;
    }
    let fedCount = 0;
    for (const a of hungry) {
      if (state.feed <= 0) break;
      state.feed -= 1;
      a.fed = true;
      fedCount++;
      spawnParticles(a.x, a.y - 10, '#fde047', 6, 1.4, 3);
    }
    AudioFX.harvest();
    addFloatText(9.5 * TILE, 3.8 * TILE, T().floats.fedAnimals(fedCount), '#fef08a');
    updateHUD();
  }

  function petOrFeedAnimal(ani) {
    if (!ani.fed && state.feed > 0) {
      state.feed -= 1;
      ani.fed = true;
      AudioFX.harvest();
      spawnParticles(ani.x, ani.y - 10, '#fde047', 7, 1.5, 3);
      addFloatText(ani.x, ani.y - 22, '🌾 😋', '#fef08a');
      updateHUD();
    } else {
      if (!ani.petted) {
        ani.petted = true;
        ani.hearts = Math.min(5, (ani.hearts || 0) + 1);
      }
      AudioFX.pet();
      spawnParticles(ani.x, ani.y - 12, '#ff8fab', 8, 1.6, 3.2);
      addFloatText(ani.x, ani.y - 24, T().floats.petHeart, '#ffd6e0');
    }
  }

  function collectDrop(dropId) {
    const idx = state.pastureDrops.findIndex(d => d.id === dropId);
    if (idx === -1) return;
    const drop = state.pastureDrops[idx];
    state.pastureDrops.splice(idx, 1);
    const key = `${drop.itemId}_${drop.quality}`;
    state.satchel[key] = (state.satchel[key] || 0) + 1;
    state.totalHarvested += 1;
    AudioFX.harvest();
    const item = ITEMS[drop.itemId];
    spawnParticles(drop.x, drop.y, drop.quality ? '#fde047' : '#ffffff', 10, 1.8, 3.2);
    addFloatText(drop.x, drop.y - 12, T().floats.collectedDrop(item.emoji, L(item.name), drop.quality === 1), drop.quality ? '#fef08a' : '#ffffff');
    updateHUD();
  }

  function collectAllPastureDrops() {
    while (state.pastureDrops.length > 0) collectDrop(state.pastureDrops[0].id);
  }

  // =========================================================================
  // FARMING ACTIONS
  // =========================================================================
  function isCropRipe(cropObj) { return cropObj.daysGrown >= CROPS[cropObj.id].days; }

  function getAreaTiles(tx, ty, level) {
    if (level <= 1) return [[tx, ty]];
    if (level === 2) {
      const d = state.player.dir;
      const dx = d === 'right' ? 1 : d === 'left' ? -1 : 0;
      const dy = d === 'down' ? 1 : d === 'up' ? -1 : 0;
      return [[tx, ty], [tx + dx, ty + dy], [tx + dx * 2, ty + dy * 2]];
    }
    const list = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) list.push([tx + dx, ty + dy]);
    return list;
  }

  function performPrimaryAction(tx, ty) {
    if (state.area !== 'farm') { performSmartInteract(); return; }
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
    const slots = getAllHotbarSlots().all;
    const slot = slots[state.selectedSlot] || slots[0];
    const existing = getTileData(tx, ty);
    if (existing && existing.crop && isCropRipe(existing.crop)) { harvestTile(tx, ty); return; }
    if (slot.id === 'can' && curMap()[ty][tx] === TILE_TYPE.WATER) { refillWater(); return; }

    state.player.swingTimer = 0.22;
    state.player.swingTool = slot.id;

    if (slot.kind === 'tool') {
      if (slot.id === 'hoe') doHoe(tx, ty);
      else if (slot.id === 'can') doWater(tx, ty);
      else if (slot.id === 'scythe') doClearDebris(tx, ty);
    } else if (slot.kind === 'seed') doPlant(tx, ty, slot.id);
    else if (slot.kind === 'placeable') doPlace(tx, ty, slot.id);
  }

  function spendEnergy(amount) {
    if (state.energy < amount) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.tooTired, '#ffd1d1'); return false;
    }
    state.energy = Math.max(0, state.energy - amount);
    updateHUD();
    return true;
  }

  function doHoe(tx, ty) {
    const targets = getAreaTiles(tx, ty, state.hoeLevel);
    let tilledAny = false;
    for (const [x, y] of targets) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS || MAPS.farm[y][x] !== TILE_TYPE.FARMABLE) continue;
      const td = ensureTileData(x, y);
      if (td.debris || td.placeable || td.tilled) continue;
      if (!tilledAny && !spendEnergy(2)) return;
      td.tilled = true;
      if (state.weather === 'rainy') td.watered = true;
      tilledAny = true;
      spawnParticles((x + 0.5) * TILE, (y + 0.5) * TILE, '#a6744f', 7, 1.4, 3.2);
    }
    if (tilledAny) AudioFX.hoe();
    else {
      const td = getTileData(tx, ty);
      if (td && td.debris) { addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.useScythe, '#fff2b2'); AudioFX.error(); }
    }
  }

  function doWater(tx, ty) {
    if (state.water <= 0) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.canEmpty, '#bae6fd'); return;
    }
    const targets = getAreaTiles(tx, ty, state.canLevel);
    let wateredAny = false;
    for (const [x, y] of targets) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
      const td = getTileData(x, y);
      if (!td || !td.tilled) continue;
      if (!wateredAny && !spendEnergy(1)) return;
      td.watered = true; wateredAny = true;
      spawnParticles((x + 0.5) * TILE, (y + 0.5) * TILE, '#67d4f6', 8, 1.3, 2.8);
    }
    if (wateredAny) {
      state.water = Math.max(0, state.water - 1);
      AudioFX.water(); updateHUD(); renderHotbar();
    } else if (isNearWater(state.player.x / TILE, state.player.y / TILE)) refillWater();
  }

  function refillWater() {
    const cap = getCanCapacity();
    if (state.water >= cap) { addFloatText(state.player.x, state.player.y - 24, T().floats.canFull, '#bae6fd'); return; }
    state.water = cap;
    AudioFX.water();
    spawnParticles(state.player.x, state.player.y, '#67d4f6', 14, 2.0, 3.2);
    addFloatText(state.player.x, state.player.y - 24, T().floats.refilled(cap), '#bae6fd');
    updateHUD(); renderHotbar();
  }

  function doClearDebris(tx, ty) {
    const td = getTileData(tx, ty);
    if (!td) return;
    if (td.crop && isCropRipe(td.crop)) { harvestTile(tx, ty); return; }
    if (!td.debris || !spendEnergy(2)) return;
    const type = td.debris; td.debris = null;
    AudioFX.chop();
    const wx = (tx + 0.5) * TILE, wy = (ty + 0.5) * TILE;
    if (type === 'twig') { state.wood += 2; spawnParticles(wx, wy, '#a87548', 9, 1.7, 3); addFloatText(wx, wy - 6, T().floats.woodGain, '#fde6c4'); }
    else if (type === 'stone') { state.stone += 2; spawnParticles(wx, wy, '#b4b8bf', 9, 1.7, 3); addFloatText(wx, wy - 6, T().floats.stoneGain, '#f1f5f9'); }
    else {
      spawnParticles(wx, wy, '#72bf65', 9, 1.6, 3);
      if (Math.random() < 0.45) { state.seeds.turnip += 1; addFloatText(wx, wy - 6, T().floats.wildSeed, '#dcfce7'); renderHotbar(); }
      else addFloatText(wx, wy - 6, T().floats.cleared, '#ecfccb');
    }
    updateHUD();
  }

  function doPlant(tx, ty, cropId) {
    if ((state.seeds[cropId] || 0) <= 0) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.noSeeds(L(CROPS[cropId].name)), '#fde68a'); return;
    }
    if (MAPS.farm[ty][tx] !== TILE_TYPE.FARMABLE) return;
    const td = getTileData(tx, ty);
    if (!td || !td.tilled) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.tillFirst, '#fde68a'); return; }
    if (td.crop || td.placeable || td.debris) return;
    state.seeds[cropId] -= 1;
    td.crop = { id: cropId, daysGrown: 0 };
    AudioFX.plant();
    spawnParticles((tx + 0.5) * TILE, (ty + 0.5) * TILE, '#b8f078', 6, 1.2, 2.8);
    addFloatText((tx + 0.5) * TILE, ty * TILE - 2, T().floats.planted(CROPS[cropId].emoji), '#f0fdf4');
    renderHotbar();
  }

  function doPlace(tx, ty, itemId) {
    if ((state.placeables[itemId] || 0) <= 0) { AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.buyPlaceable, '#bae6fd'); return; }
    if (MAPS.farm[ty][tx] !== TILE_TYPE.FARMABLE) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.placeOnFarm, '#fde68a'); return; }
    const td = ensureTileData(tx, ty);
    if (td.crop || td.debris || td.placeable) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.tileOccupied, '#fecaca'); return; }
    state.placeables[itemId] -= 1;
    td.placeable = itemId; td.tilled = false; td.watered = false;
    AudioFX.place();
    spawnParticles((tx + 0.5) * TILE, (ty + 0.5) * TILE, '#93c5fd', 10, 1.6, 3);
    addFloatText((tx + 0.5) * TILE, ty * TILE - 4, itemId === 'sprinkler' ? T().floats.placedSprinkler : T().floats.placedLantern, '#e0f2fe');
    renderHotbar();
  }

  function harvestTile(tx, ty) {
    const td = getTileData(tx, ty);
    if (!td || !td.crop || !isCropRipe(td.crop)) return;
    const crop = CROPS[td.crop.id];
    const qty = crop.yieldMin + Math.floor(Math.random() * (crop.yieldMax - crop.yieldMin + 1));
    const goldChance = state.luckyCharm ? 0.40 : 0.16;
    let goldCount = 0;
    for (let i = 0; i < qty; i++) {
      const q = Math.random() < goldChance ? 1 : 0;
      if (q === 1) goldCount++;
      const key = `${crop.id}_${q}`;
      state.satchel[key] = (state.satchel[key] || 0) + 1;
    }
    state.totalHarvested += qty;
    if (crop.regrow > 0) td.crop.daysGrown = crop.days - crop.regrow;
    else td.crop = null;
    AudioFX.harvest();
    const wx = (tx + 0.5) * TILE, wy = (ty + 0.5) * TILE;
    spawnParticles(wx, wy, crop.color, 12, 1.9, 3.6);
    if (goldCount > 0) spawnParticles(wx, wy, '#ffe066', 8, 2.2, 3.2);
    addFloatText(wx, wy - 8, `+${qty} ${crop.emoji} ${L(crop.name)}${goldCount > 0 ? ' ⭐' : ''}`, goldCount > 0 ? '#fef08a' : '#ffffff');
    updateHUD();
  }

  // =========================================================================
  // SHIPPING BIN & SLEEP / NIGHT PROCESSING
  // =========================================================================
  function getShippableBasketCount() {
    const c1 = Object.values(state.satchel).reduce((a, b) => a + b, 0);
    const c2 = Object.values(state.dishes).reduce((a, b) => a + b, 0);
    return c1 + c2;
  }
  function getBasketBadgeTotal() {
    return getShippableBasketCount() + Object.values(state.pantry).reduce((a, b) => a + b, 0);
  }
  function getShippingPendingGold() {
    let total = 0;
    for (const [key, count] of Object.entries(state.shippingBin)) {
      if (!count) continue;
      if (key.startsWith('dish:')) total += getSellValue(key.slice(5), 0) * count;
      else { const [id, q] = key.split('_'); total += getSellValue(id, Number(q || 0)) * count; }
    }
    return total;
  }

  function shipAllFromSatchel() {
    const count = getShippableBasketCount();
    if (count === 0) { AudioFX.ui(); addFloatText(7.5 * TILE, 4 * TILE, T().floats.shipEmpty, '#fde68a'); return; }
    let addedGold = 0;
    for (const [key, qty] of Object.entries(state.satchel)) {
      if (!qty) continue;
      const [id, q] = key.split('_');
      addedGold += getSellValue(id, Number(q)) * qty;
      state.shippingBin[key] = (state.shippingBin[key] || 0) + qty;
    }
    state.satchel = {};
    for (const [rid, qty] of Object.entries(state.dishes)) {
      if (!qty) continue;
      addedGold += getSellValue(rid, 0) * qty;
      state.shippingBin[`dish:${rid}`] = (state.shippingBin[`dish:${rid}`] || 0) + qty;
    }
    state.dishes = {};
    AudioFX.coin();
    spawnParticles(7.5 * TILE, 4.3 * TILE, '#fcd34d', 14, 1.9, 3.2);
    addFloatText(7.5 * TILE, 3.8 * TILE, T().floats.shipped(count, addedGold), '#bbf7d0');
    updateHUD();
  }

  function startSleepSequence(passedOut = false) {
    if (isTransitioning) return;
    isTransitioning = true;
    closeModal();
    const overlay = document.getElementById('fadeOverlay');
    document.getElementById('fadeMessage').textContent = passedOut ? T().modals.fadePassedOut : T().modals.fadeSleeping;
    overlay.style.opacity = '1';

    setTimeout(() => {
      const shippedEntries = [];
      let earned = 0;
      for (const [key, qty] of Object.entries(state.shippingBin)) {
        if (!qty) continue;
        let id, q = 0;
        if (key.startsWith('dish:')) id = key.slice(5);
        else { const parts = key.split('_'); id = parts[0]; q = Number(parts[1] || 0); }
        const unit = getSellValue(id, q), sub = unit * qty;
        earned += sub;
        shippedEntries.push({ id, quality: q, qty, unit, sub });
      }
      state.shippingBin = {};
      state.gold += earned;
      state.lifetimeGold += earned;

      const prevSeason = state.seasonIdx;
      state.day += 1;
      if (state.day > 14) { state.day = 1; state.seasonIdx = (state.seasonIdx + 1) % SEASONS.length; }
      const seasonChanged = state.seasonIdx !== prevSeason;

      state.weather = state.nextWeather;
      const r = Math.random();
      state.nextWeather = r < 0.28 ? 'rainy' : r < 0.56 ? 'breezy' : 'sunny';

      // Farm growth
      for (const key of Object.keys(state.farm)) {
        const td = state.farm[key];
        if (td.crop && td.watered && td.crop.daysGrown < CROPS[td.crop.id].days) td.crop.daysGrown += 1;
        td.watered = (state.weather === 'rainy' && td.tilled);
        if (td.tilled && !td.crop && Math.random() < 0.1) { td.tilled = false; td.watered = false; }
      }

      let sprinklerWaters = 0;
      for (const key of Object.keys(state.farm)) {
        const td = state.farm[key];
        if (td.placeable === 'sprinkler') {
          const [sx, sy] = key.split(',').map(Number);
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const ntd = getTileData(sx + dx, sy + dy);
            if (ntd && ntd.tilled) { ntd.watered = true; sprinklerWaters++; }
          }
        }
      }

      // Pasture animal overnight production!
      let newDrops = 0;
      let autoFedCount = 0;
      for (const a of state.animals) {
        if (a.fed && state.pastureDrops.length < 24) {
          const meta = ANIMALS[a.type];
          const goldChance = (state.luckyCharm ? 0.35 : 0.14) + Math.min(0.25, (a.hearts || 0) * 0.05);
          const q = Math.random() < goldChance ? 1 : 0;
          state.pastureDrops.push({
            id: `drop_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            itemId: meta.product,
            quality: q,
            x: Math.max(3.6 * TILE, Math.min(15.4 * TILE, a.x + (Math.random() - 0.5) * 26)),
            y: Math.max(7.6 * TILE, Math.min(12.6 * TILE, a.y + (Math.random() - 0.5) * 20))
          });
          newDrops++;
        }
        a.fed = false;
        a.petted = false;
        // Auto-feeder refills for today!
        if (state.autoFeeder && state.feed > 0) {
          state.feed -= 1;
          a.fed = true;
          autoFedCount++;
        }
      }

      // Wake up at Home Farm cottage
      state.area = 'farm';
      state.timeMinutes = 6 * 60;
      state.energy = passedOut ? Math.round(state.maxEnergy * 0.8) : state.maxEnergy;
      state.player.x = 4 * TILE; state.player.y = 5.5 * TILE; state.player.dir = 'down';
      walkTarget = null;
      if (state.day === 2 || state.day === 5 || seasonChanged) state.unreadMail = true;

      saveState();
      updateHUD();
      renderHotbar();

      overlay.style.opacity = '0';
      isTransitioning = false;
      AudioFX.morning();
      openDaySummaryModal(shippedEntries, earned, passedOut, seasonChanged, sprinklerWaters, newDrops, autoFedCount);
    }, 600);
  }

  // =========================================================================
  // MODALS: SHOP, RANCH SHOP, KITCHEN, BARN, BASKET, COTTAGE, WARDROBE, LEDGER
  // =========================================================================
  function openModal(icon, title, bodyHTML, footerHTML = '') {
    modalOpen = true; walkTarget = null;
    for (const k in keys) keys[k] = false;
    document.getElementById('modalIcon').textContent = icon;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHTML;
    document.getElementById('modalFooter').innerHTML = footerHTML;
    document.getElementById('modalOverlay').classList.remove('hidden');
  }
  function closeModal() { modalOpen = false; document.getElementById('modalOverlay').classList.add('hidden'); }
  document.getElementById('modalCloseBtn').addEventListener('click', () => { AudioFX.ui(); closeModal(); });
  document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') { AudioFX.ui(); closeModal(); } });

  // --- PIP'S SEED & UPGRADE SHOP ---
  let shopTab = 'seeds';
  function openShopModal(tab = shopTab) {
    shopTab = tab; AudioFX.ui();
    const m = T().modals, season = getSeason();
    let body = `
      <div class="flex gap-2 border-b border-[#dcc49e] pb-2">

          </div>`;

    const m = T().modals;

        <button data-rtab="feed" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${ranchTab==='feed'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabFeed}</button>
        <button data-rtab="pantry" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${ranchTab==='pantry'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabPantry}</button>

        body += `
          <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-col justify-between gap-2">

            <button data-buyani="${aid}" ${!full && state.gold >= a.price ? '' : 'disabled'} class="btn-peach w-full py-1.5 rounded-xl text-xs font-bold cursor-pointer">

            </button>
          </div>`;
      }
      body += `</div>`;
    } else if (ranchTab === 'feed') {
      const u = m.upg;
      body += `
        <div class="rounded-2xl p-3 bg-[#fffdf7] border border-[#d6ba91] space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="font-bold text-sm">🌾 ${m.feedTitle}</div>
            <span class="text-xs font-bold text-amber-900">${m.feedOwned(state.feed)}</span>
          </div>
          <p class="text-[11px] text-[#75583e]">${m.feedDesc}</p>
          <div class="flex flex-wrap gap-2">
            <button data-buyfeed="1" data-cost="10" ${state.gold >= 10 ? '' : 'disabled'} class="btn-peach flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+1 (10g)</button>
            <button data-buyfeed="5" data-cost="45" ${state.gold >= 45 ? '' : 'disabled'} class="btn-sage flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+5 (45g)</button>
            <button data-buyfeed="15" data-cost="120" ${state.gold >= 120 ? '' : 'disabled'} class="btn-sage flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+15 (120g)</button>
          </div>
        </div>
        <div class="rounded-2xl p-3 bg-[#fffdf7] border border-[#d6ba91] flex items-center justify-between gap-3">
          <div class="flex items-start gap-2.5"><span class="text-xl">⚙️</span>
            <div><div class="font-bold text-sm">${state.autoFeeder ? u.autoFeederOwned : u.autoFeeder}</div><div class="text-[11px] text-[#75583e]">${u.autoFeederD}</div></div>
          </div>
          ${state.autoFeeder ? `<span class="px-2.5 py-1 rounded-xl bg-emerald-600/15 text-emerald-800 font-bold text-xs shrink-0">${m.owned}</span>`
            : `<button id="btnBuyAutoFeeder" ${state.gold >= 300 ? '' : 'disabled'} class="btn-peach px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer">🪙 300g</button>`}
        </div>
      `;
    } else {
      body += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
      for (const iid of PANTRY_SHOP_ORDER) {
        const it = ITEMS[iid], owned = getAvailableIngredientCount(iid);
        body += `

            <div class="flex items-center justify-between">
              <span class="font-bold text-sm">${it.emoji} ${L(it.name)}</span>
              <span class="text-[11px] font-semibold text-amber-800">${m.bag}: ${owned}</span>
            </div>
            <div class="flex gap-1.5">
              <button data-buypantry="${iid}" data-qty="1" ${state.gold >= it.buyPrice ? '' : 'disabled'} class="btn-peach flex-1 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.buy1} (${it.buyPrice}g)</button>
              <button data-buypantry="${iid}" data-qty="5" ${state.gold >= it.buyPrice * 5 ? '' : 'disabled'} class="btn-sage px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">×5 (${it.buyPrice*5}g)</button>

       <span class="text-[11px] text-[#75583e] hidden sm:inline">${m.millieQuote}</span>`);

    document.querySelectorAll('[data-rtab]').forEach(b => b.addEventListener('click', () => openRanchShopModal(b.dataset.rtab)));

      state.animals.push({
        id: `ani_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
        type: aid,
        x: (5 + Math.random() * 10) * TILE,
        y: (8 + Math.random() * 4.5) * TILE,

        fed: false, petted: false, hearts: 0
      });
      AudioFX.coin(); updateHUD(); openRanchShopModal('animals');
    }));
    document.querySelectorAll('[data-buyfeed]').forEach(b => b.addEventListener('click', () => {

      state.gold -= cost; state.feed += qty;
      AudioFX.coin(); updateHUD(); openRanchShopModal('feed');

      state.gold -= 300; state.autoFeeder = true;
      AudioFX.coin(); updateHUD(); openRanchShopModal('feed');
    });
    document.querySelectorAll('[data-buypantry]').forEach(b => b.addEventListener('click', () => {

      AudioFX.coin(); updateHUD(); openRanchShopModal('pantry');
    }));

  // --- KITCHEN / COOKING RECIPES MODAL ---
  function openKitchenModal() {
    AudioFX.ui();
    const m = T().modals;
    if (!state.kitchenUnlocked) {
      openModal('🍳', m.kitchenTitle,
        `<div class="text-center py-5 space-y-2.5">
           <div class="text-4xl">🏡🍳</div>
           <div class="font-bold text-base text-[#4a3525]">${m.kitchenLockedTitle}</div>
           <p class="text-xs text-[#75583e] max-w-[400px] mx-auto leading-relaxed">${m.kitchenLockedDesc}</p>
         </div>`,
        `<span class="text-xs font-bold text-amber-900">${m.yourGold}: 🪙 ${state.gold}g</span>
         <button id="btnGoUpgradeKitchen" class="btn-peach px-3.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer">${m.goBuyKitchen}</button>`);
      document.getElementById('btnGoUpgradeKitchen').addEventListener('click', () => openShopModal('upgrades'));
      return;
    }

    const cards = RECIPES.map(r => {
      const cookable = canCookRecipe(r);
      const owned = state.dishes[r.id] || 0;
      const ingChips = Object.entries(r.ingredients).map(([ingId, req]) => {
        const meta = getItemMeta(ingId);
        const have = getAvailableIngredientCount(ingId);
        const ok = have >= req;
        return `<span class="px-1.5 py-0.5 rounded-lg text-[11px] font-semibold border ${ok ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-800'}">${meta.emoji} ${L(meta.name)} ${have}/${req}</span>`;
      }).join(' ');

      return `
        <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-col justify-between gap-2">
          <div>
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-sm">${r.emoji} ${L(r.name)}</span>
              <span class="text-[11px] font-semibold text-amber-800">${m.dishCount(owned)}</span>
            </div>
            <p class="text-[11px] text-[#75583e] mt-0.5">${L(r.desc)}</p>
            <div class="flex flex-wrap gap-1 mt-1.5">${ingChips}</div>
            <div class="text-[11px] font-semibold text-[#5c4028] mt-1.5 flex items-center gap-2.5">
              <span>🪙 ${m.sells} ${r.sellPrice}g</span>
              <span>🍀 +${r.energy}</span>
            </div>
          </div>
          <button data-cook="${r.id}" ${cookable ? '' : 'disabled'} class="${cookable ? 'btn-sage' : 'btn-peach'} w-full py-1.5 rounded-xl text-xs font-bold cursor-pointer">
            ${cookable ? m.cookBtn : m.missingIng}
          </button>
        </div>`;
    }).join('');

    openModal('🍳', m.kitchenTitle,
      `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${cards}</div>`,
      `<button id="btnKitchenToPantry" class="text-xs font-bold text-[#9c4a34] underline cursor-pointer">${m.openPantryLink}</button>
       <span class="text-xs font-bold text-amber-900">${m.yourGold}: 🪙 ${state.gold}g</span>`);

    document.getElementById('btnKitchenToPantry').addEventListener('click', () => openRanchShopModal('pantry'));
    document.querySelectorAll('[data-cook]').forEach(b => b.addEventListener('click', () => {
      const r = RECIPE_MAP[b.dataset.cook];
      if (!r || !canCookRecipe(r)) { AudioFX.error(); return; }
      for (const [ing, qty] of Object.entries(r.ingredients)) consumeIngredient(ing, qty);
      state.dishes[r.id] = (state.dishes[r.id] || 0) + 1;
      state.totalCooked += 1;
      AudioFX.cook();
      addFloatText(state.player.x, state.player.y - 26, T().floats.cookedDish(r.emoji, L(r.name)), '#fef08a');
      updateHUD();
      openKitchenModal();
    }));
  }

      for (const [key, qty] of Object.entries(state.satchel)) {

      for (const [rid, qty] of Object.entries(state.dishes)) {
        if (!qty) continue;
        const meta = RECIPE_MAP[rid];
        rows.push({ kind: 'dish', key: rid, id: rid, q: 0, qty, meta, shipVal: meta.sellPrice, energy: meta.energy });
      }
    } else {
      for (const [iid, qty] of Object.entries(state.pantry)) {
        if (!qty) continue;
        const meta = ITEMS[iid];
        rows.push({ kind: 'pantry', key: iid, id: iid, q: 0, qty, meta, shipVal: meta.sellPrice, energy: meta.energy || 0 });
      }
    }

    if (rows.length === 0) {
      body += `<div class="text-center py-6 space-y-1.5 text-[#75583e]"><div class="text-3xl">💐</div><div class="font-bold text-sm text-[#4a3525]">${m.satchelEmptyTitle}</div><p class="text-xs">${m.satchelEmptyDesc}</p></div>`;
    } else {
      body += `<div class="space-y-2">` + rows.map(r => {
        const quick = Math.round(r.shipVal * 0.9);
        return `
          <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-wrap items-center justify-between gap-2">
