  // Reset is triggered from Settings → Preferences via openResetConfirmModal()

  // =========================================================================
  // COLLISION, ANIMAL AI & UPDATE LOOP
  // =========================================================================
  function isSolidAtPixel(px, py) {
    const r = 8, m = curMap();
    const pts = [[px - r, py - r], [px + r, py - r], [px - r, py + r], [px + r, py + r]];
    for (const [x, y] of pts) {
      const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return true;
      const t = m[ty][tx];
      if (t === TILE_TYPE.WALL || t === TILE_TYPE.WATER) return true;
      if (state.area === 'farm') {
        const td = getTileData(tx, ty);
        if (td && (td.debris === 'stone' || td.placeable)) return true;
      }
    }
    return false;
  }

  let clockAccum = 0, lastTime = performance.now(), animTime = 0;

  function update(dt) {
    animTime += dt;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const f = floatingTexts[i]; f.y += f.vy; f.life -= 0.015;
      if (f.life <= 0) floatingTexts.splice(i, 1);
    }

    if (state.area === 'farm' && Math.random() < dt * 2.0) {
      const cot = getFarmLayout().cottage;
      smokePuffs.push({ x: (cot.x + 2.7) * TILE + (Math.random() - 0.5) * 3, y: (cot.y - 0.1) * TILE, r: 4 + Math.random() * 2, life: 1, vx: 7 + Math.random() * 6, vy: -13 - Math.random() * 5 });
    }
    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const s = smokePuffs[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 4.5; s.life -= dt * 0.42;
      if (s.life <= 0) smokePuffs.splice(i, 1);
    }

    // Gentle wandering AI for Pasture Animals (stay sheltered near Barn on Rainy/Snowy days!)
    const shelteredWeather = state.weather === 'rainy';
    for (const a of state.animals) {
      if (a.wait > 0) {
        a.wait -= dt;
        if (a.wait <= 0) {
          if (shelteredWeather) {
            a.tx = (3.6 + Math.random() * 4.6) * TILE;
            a.ty = (7.2 + Math.random() * 1.5) * TILE;
          } else {
            a.tx = (3.8 + Math.random() * 12) * TILE;
            a.ty = (7.6 + Math.random() * 5.2) * TILE;
          }
        }
      } else {
        const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
        if (dist < 4) { a.wait = shelteredWeather ? (3.0 + Math.random() * 3.5) : (1.6 + Math.random() * 3.0); }
        else {
          const spd = (a.type === 'cow' ? 18 : a.type === 'sheep' ? 21 : 28) * (shelteredWeather ? 0.6 : 1) * dt;
          a.x += (dx / dist) * spd; a.y += (dy / dist) * spd;
          a.dir = dx >= 0 ? 1 : -1;
        }
      }
    }

    updateAmbient(dt);
    updateFishing(dt);
    if (modalOpen || isTransitioning) return;

    clockAccum += dt;
    if (clockAccum >= 2.4) {
      clockAccum -= 2.4;
      state.timeMinutes += 10;
      updateHUD();
      if (state.timeMinutes >= 24 * 60) { cancelFishing(); startSleepSequence(true); return; }
    }

    let playerMoved = false;
    if (fishing.phase === 'idle') {
      let mx = 0, my = 0;
      if (keys['w'] || keys['arrowup']) my -= 1;
      if (keys['s'] || keys['arrowdown']) my += 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;

      if (mx === 0 && my === 0 && walkTarget) {
        const dx = walkTarget.x - state.player.x, dy = walkTarget.y - state.player.y, dist = Math.hypot(dx, dy);
        if (dist <= (walkTarget.stopDist || 0.25) * TILE + 3) { const cb = walkTarget.onArrive; walkTarget = null; if (cb) cb(); }
        else { mx = dx / dist; my = dy / dist; }
      }

      if (mx !== 0 || my !== 0) {
        const len = Math.hypot(mx, my); mx /= len; my /= len;
        const speed = 116 * dt;
        if (Math.abs(mx) > Math.abs(my)) state.player.dir = mx > 0 ? 'right' : 'left';
        else state.player.dir = my > 0 ? 'down' : 'up';

        const nx = state.player.x + mx * speed, ny = state.player.y + my * speed;
        let moved = false;
        if (!isSolidAtPixel(nx, state.player.y)) { state.player.x = nx; moved = true; }
        if (!isSolidAtPixel(state.player.x, ny)) { state.player.y = ny; moved = true; }
        if (moved) { state.player.walkFrame += dt * 9.5; playerMoved = true; }
        else if (walkTarget) walkTarget = null;

        // Seamless Walk-Through Area Gates!
        if (state.area === 'farm' && state.player.x > (COLS - 0.55) * TILE && state.player.y > 4.6 * TILE && state.player.y < 8 * TILE) {
          switchArea('pasture', 1.4 * TILE, state.player.y);
        } else if (state.area === 'pasture' && state.player.x < 0.55 * TILE && state.player.y > 4.6 * TILE && state.player.y < 8 * TILE) {
          switchArea('farm', (COLS - 1.4) * TILE, state.player.y);
        }
      } else state.player.walkFrame = 0;
    } else {
      state.player.walkFrame = 0;
    }

    updatePetAI(dt, playerMoved);
    if (state.player.swingTimer > 0) state.player.swingTimer = Math.max(0, state.player.swingTimer - dt);

    const hint = getNearbyContext(), hintEl = document.getElementById('contextHint');
    if (hint) {
      document.getElementById('contextHintIcon').textContent = hint.icon;
      document.getElementById('contextHintText').textContent = hint.text;
      hintEl.classList.remove('hidden');
    } else hintEl.classList.add('hidden');
  }

  const rainRipples = [];
  function updateAmbient(dt) {
    const season = getSeason();
    const isNight = state.timeMinutes >= 19 * 60;
    const snowy = isWinter();
    const isRain = state.weather === 'rainy' && !snowy;
    const isSnowfall = snowy && (state.weather === 'rainy' || state.weather === 'breezy');
    const desired = isRain ? 80 : isSnowfall ? 68 : snowy ? 34 : state.weather === 'breezy' ? 28 : (isNight && season.id === 'summer') ? 26 : isNight ? 16 : 12;

    while (ambientDrops.length < desired) {
      ambientDrops.push({ x: Math.random() * CANVAS_W, y: Math.random() * CANVAS_H, phase: Math.random() * Math.PI * 2, speed: 0.65 + Math.random() * 0.65, size: 1.6 + Math.random() * 2.2 });
    }
    if (ambientDrops.length > desired) ambientDrops.length = desired;

    for (const d of ambientDrops) {
      d.phase += dt * 2.2;
      if (isRain) {
        d.x -= 82 * dt * d.speed; d.y += 310 * dt * d.speed;
        if (d.y > CANVAS_H) { d.y = -10; d.x = Math.random() * (CANVAS_W + 90); }
        if (d.x < -10) d.x = CANVAS_W + 10;
      } else if (snowy) {
        d.x += (Math.sin(d.phase) * 18 - (state.weather === 'breezy' ? 24 : 8)) * dt;
        d.y += (isSnowfall ? 48 : 26) * dt * d.speed;
        if (d.y > CANVAS_H + 8) { d.y = -8; d.x = Math.random() * CANVAS_W; }
        if (d.x < -10) d.x = CANVAS_W + 10;
        if (d.x > CANVAS_W + 10) d.x = -10;
      } else if (isNight) {
        d.x += Math.cos(d.phase) * 15 * dt; d.y += Math.sin(d.phase * 1.3) * 11 * dt;
        if (d.x < 10) d.x = CANVAS_W - 10; if (d.x > CANVAS_W - 10) d.x = 10;
        if (d.y < 10) d.y = CANVAS_H - 10; if (d.y > CANVAS_H - 10) d.y = 10;
      } else {
        d.x += (state.weather === 'breezy' ? 42 : 16) * dt * d.speed;
        d.y += (16 + Math.sin(d.phase) * 9) * dt;
        if (d.x > CANVAS_W + 10) d.x = -10;
        if (d.y > CANVAS_H + 10) { d.y = -10; d.x = Math.random() * CANVAS_W; }
      }
    }

    // Rain ground water ripples
    if (isRain && Math.random() < dt * 14) {
      rainRipples.push({ x: Math.random() * CANVAS_W, y: 60 + Math.random() * (CANVAS_H - 70), r: 1, maxR: 7 + Math.random() * 5, life: 1 });
    }
    for (let i = rainRipples.length - 1; i >= 0; i--) {
      const rp = rainRipples[i];
      rp.r += dt * 14; rp.life -= dt * 1.6;
      if (rp.life <= 0) rainRipples.splice(i, 1);
    }
  }

  // =========================================================================
  // STORYBOOK WATERCOLOR RENDERER
  // =========================================================================
  const INK = '#543c2c';
  function roundRectPath(x, y, w, h, r, c = ctx) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawPondFishShadows() {
    const m = curMap();
    for (const s of pondFishShadows) {
      const tx = Math.floor(s.x / TILE), ty = Math.floor(s.y / TILE);
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS || m[ty][tx] !== TILE_TYPE.WATER) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.ang);
      ctx.scale(s.size, s.size);
      ctx.fillStyle = 'rgba(32, 74, 102, 0.28)';
      ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 3.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-11, -3.5 + Math.sin(animTime * 8 + s.phase) * 1.4); ctx.lineTo(-11, 3.5 + Math.sin(animTime * 8 + s.phase) * 1.4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawFishingLineAndBobber() {
    if (fishing.phase === 'idle') return;
    const p = state.player;
    // Bamboo rod extending toward bobber
    const ang = Math.atan2(fishing.bobberY - (p.y - 12), fishing.bobberX - p.x);
    const tipX = p.x + Math.cos(ang) * 26, tipY = p.y - 14 + Math.sin(ang) * 18 - 8;
    ctx.strokeStyle = '#9c7840'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x + Math.cos(ang) * 5, p.y - 10); ctx.lineTo(tipX, tipY); ctx.stroke();

    // Soft sagging fishing line
    const dip = fishing.phase === 'bite' ? 6 : Math.sin(animTime * 4) * 1.8;
    const bx = fishing.bobberX, by = fishing.bobberY + dip;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)'; ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.quadraticCurveTo((tipX + bx) / 2, Math.max(tipY, by) + 8, bx, by);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // Expanding concentric ripples around bobber
    const rr = ((animTime * 12) % 14) + 3;
    ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - rr / 18) * 0.65})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(bx, by + 2, rr, rr * 0.45, 0, 0, Math.PI * 2); ctx.stroke();

    // Red-and-white cork bobber
    ctx.fillStyle = '#e63946'; ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, 4.2, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fffdf7';
    ctx.beginPath(); ctx.arc(bx, by, 4.2, 0, Math.PI); ctx.fill(); ctx.stroke();

    // Bouncing "!" alert over player head on bite!
    if (fishing.phase === 'bite') {
      const bounce = Math.abs(Math.sin(animTime * 14)) * -5;
      ctx.fillStyle = '#fff9d6'; ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y - 44 + bounce, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d9480f'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', p.x, p.y - 39 + bounce);
    }
  }

  function drawFishingReelOverlay() {
    if (fishing.phase !== 'reeling') return;
    const panelX = CANVAS_W - 118, panelY = 92, panelW = 94, panelH = 276;

    // Warm parchment backdrop card
    roundRectPath(panelX, panelY, panelW, panelH, 14);
    ctx.fillStyle = 'rgba(255, 250, 240, 0.94)'; ctx.fill();
    ctx.strokeStyle = '#9c6e44'; ctx.lineWidth = 2.2; ctx.stroke();

    // Water column track (left)
    const trackX = panelX + 16, trackY = panelY + 20, trackW = 34, trackH = 212;
    roundRectPath(trackX, trackY, trackW, trackH, 9);
    const wg = ctx.createLinearGradient(0, trackY, 0, trackY + trackH);
    wg.addColorStop(0, '#9bd8ec'); wg.addColorStop(1, '#4c9ac0');
    ctx.fillStyle = wg; ctx.fill();
    ctx.strokeStyle = '#5c8aa3'; ctx.lineWidth = 1.5; ctx.stroke();

    // Green catch zone frame
    const zoneH = fishing.barHeight * trackH;
    const zoneCenterY = trackY + (1 - fishing.barPos) * trackH;
    const overlapping = Math.abs(fishing.fishPos - fishing.barPos) <= fishing.barHeight / 2 + 0.045;
    roundRectPath(trackX + 3, zoneCenterY - zoneH / 2, trackW - 6, zoneH, 6);
    ctx.fillStyle = overlapping ? 'rgba(116, 207, 114, 0.85)' : 'rgba(138, 198, 134, 0.52)';
    ctx.fill();
    ctx.strokeStyle = overlapping ? '#2d7a36' : '#588c56'; ctx.lineWidth = 2; ctx.stroke();

    // Swimming Fish icon inside track
    const fishY = trackY + (1 - fishing.fishPos) * trackH;
    const fObj = FISH[fishing.fishId] || FISH.riverPerch;
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(fObj.emoji, trackX + trackW / 2, fishY + 6);

    // Right vertical Progress Meter
    const progX = panelX + 62, progY = trackY, progW = 16, progH = trackH;
    roundRectPath(progX, progY, progW, progH, 7);
    ctx.fillStyle = '#e5d5b7'; ctx.fill();
    ctx.strokeStyle = '#a88358'; ctx.lineWidth = 1.4; ctx.stroke();

    const fillH = Math.max(0, Math.min(1, fishing.progress)) * (progH - 4);
    roundRectPath(progX + 2, progY + progH - 2 - fillH, progW - 4, fillH, 5);
    ctx.fillStyle = fishing.progress > 0.65 ? '#52b788' : fishing.progress > 0.3 ? '#f4a261' : '#e76f51';
    ctx.fill();

    // Bottom tiny instruction
    ctx.fillStyle = '#5c4028';
    ctx.font = 'bold 9.5px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(T().modals.reelTip, panelX + panelW / 2, panelY + panelH - 13);
  }

  function render() {
    const season = getSeason();
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    // Layer 1: Ground & Water tiles
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawGroundTile(x, y, season);

    // Layer 2: Pond fish shadows
    drawPondFishShadows();

    // Layer 3 & 4: Area props, buildings & Y-sorted characters (Farmer + Pet + Animals)
    const petActor = (state.pet && state.pet.type)
      ? [{ y: petAI.y, draw: () => drawPetSprite(ctx, state.pet.type, petAI.x, petAI.y, petAI.dir, petAI.walkFrame, petAI.idleMode, state.pet.hasGift, 1) }]
      : [];

    if (state.area === 'farm') {
      const lay = getFarmLayout();
      drawPondDuckling();
      drawFarmFences();
      for (const rect of lay.farmRects) {
        for (let y = rect.y1; y <= rect.y2; y++) for (let x = rect.x1; x <= rect.x2; x++) {
          const td = getTileData(x, y); if (td) drawFarmContents(x, y, td);
        }
      }
      drawCursorHighlight();
      drawCottage();
      drawPetBed();
      drawMailbox();
      drawShippingBin();
      drawShopStand();
      drawSignpost(lay.signpost.x, lay.signpost.y, T().gateToPasture);
      const farmActors = [{ y: state.player.y, draw: () => drawGirlFarmer() }, ...petActor];
      farmActors.sort((a, b) => a.y - b.y);
      for (const ac of farmActors) ac.draw();
    } else {
      drawPastureFences();
      drawBarn();
      drawFeedTrough();
      drawRanchShopStand();
      drawSignpost(1, 4, T().gateToFarm);
      for (const d of state.pastureDrops) drawPastureDrop(d);
      const actors = [
        ...state.animals.map(a => ({ y: a.y, draw: () => drawAnimal(a) })),
        { y: state.player.y, draw: () => drawGirlFarmer() },
        ...petActor
      ];
      actors.sort((a, b) => a.y - b.y);
      for (const ac of actors) ac.draw();
    }

    // Layer 5: Fishing rod/line, trees occlusion, smoke & particles
    drawFishingLineAndBobber();
    drawTrees(season);

    if (state.area === 'farm') {
      for (const s of smokePuffs) {
        ctx.fillStyle = `rgba(255, 250, 242, ${Math.max(0, s.life * 0.65)})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawAtmosphere(season);
    drawFishingReelOverlay();

    ctx.font = 'bold 12px "PingFang SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (const f of floatingTexts) {
      ctx.globalAlpha = Math.min(1, f.life * 1.45);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(66, 44, 28, 0.78)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawGroundTile(x, y, season) {
    const px = x * TILE, py = y * TILE, m = curMap(), t = m[y][x], h = hash2(x, y);
    if (t === TILE_TYPE.WATER) {
      ctx.fillStyle = season.id === 'winter' ? '#86c5dc' : '#6fb8d6'; ctx.fillRect(px, py, TILE, TILE);
      if (y > 0 && m[y - 1][x] !== TILE_TYPE.WATER) {
        ctx.fillStyle = season.id === 'winter' ? '#eef5f8' : '#e7d7b1'; ctx.fillRect(px, py, TILE, 3);
        ctx.fillStyle = '#a4d9ee'; ctx.fillRect(px, py + 3, TILE, 4);
      }
      const wave = Math.sin(animTime * 2.2 + x * 1.3 + y);
      ctx.strokeStyle = 'rgba(255,255,255,0.48)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px + 14 + wave * 2, py + 15, 6, 0.2, 1.8); ctx.stroke();
      const baseLotus = state.area === 'farm' ? getFarmLayout().lotusTiles : [[19, 10], [20, 12]];
      const summerLotus = state.area === 'farm' ? getFarmLayout().summerLotusTiles : [[19, 12], [20, 10]];
      const isMainLotus = baseLotus.some(([lx, ly]) => lx === x && ly === y);
      const isFirstLotus = baseLotus[0] && baseLotus[0][0] === x && baseLotus[0][1] === y;
      const isLotusTile = isMainLotus || (season.id === 'summer' && summerLotus.some(([lx, ly]) => lx === x && ly === y));
      if (isLotusTile && season.id !== 'winter') {
        const bob = Math.sin(animTime * 2 + x + y) * 1.2;
        ctx.fillStyle = '#5eb06d';
        ctx.beginPath(); ctx.arc(px + 16, py + 16 + bob, 8.5, 0.35, Math.PI * 2 - 0.35); ctx.lineTo(px + 16, py + 16 + bob); ctx.fill();
        if (season.id === 'summer' || isFirstLotus) {
          // Layered blooming pink lotus!
          ctx.fillStyle = '#ff9ebb';
          for (let p = 0; p < 5; p++) {
            const pa = p * (Math.PI * 2 / 5) + animTime * 0.1;
            ctx.beginPath(); ctx.ellipse(px + 16 + Math.cos(pa) * 3, py + 13 + bob + Math.sin(pa) * 2.2, 2.8, 1.8, pa, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = '#ffe58f'; ctx.beginPath(); ctx.arc(px + 16, py + 13 + bob, 1.8, 0, Math.PI * 2); ctx.fill();
        }
      }
      return;
    }

    const isPlot = t === TILE_TYPE.FARMABLE || t === TILE_TYPE.PASTURE;
    ctx.fillStyle = isPlot ? ((x + y) % 2 === 0 ? season.farmA : season.farmB) : ((x + y) % 2 === 0 ? season.grassA : season.grassB);
    ctx.fillRect(px, py, TILE, TILE);

    if ((t === TILE_TYPE.GRASS || t === TILE_TYPE.PASTURE) && h > 0.56) {
      if (season.id === 'winter') {
        if (h > 0.72) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.beginPath(); ctx.ellipse(px + 8 + (h * 16) % 16, py + 10 + (h * 25) % 14, 4.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
        }
      } else if (h > 0.78) {
        const fx = px + 8 + (h * 17) % 16, fy = py + 8 + (h * 29) % 16;
        ctx.fillStyle = h > 0.89 ? season.blossom : '#fffdf5';
        for (let a = 0; a < 4; a++) { ctx.beginPath(); ctx.arc(fx + Math.cos(a * Math.PI / 2) * 2.2, fy + Math.sin(a * Math.PI / 2) * 2.2, 1.7, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = '#ffd56b'; ctx.beginPath(); ctx.arc(fx, fy, 1.4, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (t === TILE_TYPE.PATH) {
      ctx.fillStyle = '#e5d4b3'; ctx.fillRect(px, py, TILE, TILE);
      for (const [sx, sy, rx, ry] of [[px+8,py+9,6.5,5],[px+22,py+10,6,4.5],[px+10,py+22,6,5],[px+23,py+23,6.5,4.5]]) {
        ctx.fillStyle = '#f3e7cf'; ctx.beginPath(); ctx.ellipse(sx, sy, rx, ry, 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#c9b38c'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    if (t === TILE_TYPE.DOCK) {
      ctx.fillStyle = '#6fb8d6'; ctx.fillRect(px, py, TILE, TILE);
      roundRectPath(px, py + 3, TILE, TILE - 6, 4);
      ctx.fillStyle = '#c89b6e'; ctx.fill(); ctx.strokeStyle = '#7c5636'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function drawPondDuckling() {
    const dc = getFarmLayout().duckCenter;
    const cx = dc.x * TILE + Math.cos(animTime * 0.7) * 18, cy = dc.y * TILE + Math.sin(animTime * 0.7) * 14;
    ctx.save(); ctx.translate(cx, cy);
    if (Math.sin(animTime * 0.7) > 0) ctx.scale(-1, 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 4, 8, 3.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fffdf7'; ctx.strokeStyle = INK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, 1, 6.5, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(4.5, -3.5, 3.8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(8.2, -3.2, 2.2, 1.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(5.4, -4.2, 0.9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawFarmFences() {
    const lay = getFarmLayout();
    for (const rect of lay.farmRects) {
      for (let x = rect.x1; x <= rect.x2; x++) {
        if (rect.gateXs.includes(x)) continue;
        const px = x * TILE, py = (rect.y1 - 1) * TILE + 20;
        ctx.fillStyle = '#f4ead7'; ctx.strokeStyle = '#9c7d5c'; ctx.lineWidth = 1.2;
        roundRectPath(px, py + 2, TILE, 4.5, 2); ctx.fill(); ctx.stroke();
        roundRectPath(px + 12, py - 6, 8, 16, 3); ctx.fill(); ctx.stroke();
      }
    }
  }

  function drawPastureFences() {
    for (let x = 3; x <= 16; x++) {
      if (x === 9 || x === 10) continue;
      const px = x * TILE, py = 6 * TILE + 20;
      ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#a38262'; ctx.lineWidth = 1.2;
      roundRectPath(px, py + 2, TILE, 4.5, 2); ctx.fill(); ctx.stroke();
      roundRectPath(px + 12, py - 6, 8, 16, 3); ctx.fill(); ctx.stroke();
    }
  }

  function drawSignpost(tx, ty, label) {
    const px = tx * TILE, py = ty * TILE;
    ctx.fillStyle = '#8b5e38'; ctx.fillRect(px + 14, py + 14, 4, 16);
    roundRectPath(px - 6, py + 4, 44, 15, 4);
    ctx.fillStyle = '#fbf0d9'; ctx.fill(); ctx.strokeStyle = '#8a5a32'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#5c3c22';
    ctx.font = 'bold 9.5px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, px + 16, py + 15);
  }

  function drawFarmContents(x, y, td) {
    const px = x * TILE, py = y * TILE;
    if (td.tilled) {
      roundRectPath(px + 2.5, py + 2.5, TILE - 5, TILE - 5, 6);
      ctx.fillStyle = td.watered ? '#6e472d' : '#ab7952'; ctx.fill();
      ctx.strokeStyle = td.watered ? '#52321e' : '#855a39'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.strokeStyle = td.watered ? 'rgba(48,28,15,0.35)' : 'rgba(110,70,40,0.32)'; ctx.lineWidth = 1.4;
      for (let fy = 9; fy <= 23; fy += 7) { ctx.beginPath(); ctx.moveTo(px + 6, py + fy); ctx.lineTo(px + TILE - 6, py + fy); ctx.stroke(); }
    }
    if (td.debris === 'weed') {
      ctx.fillStyle = '#559c4e';
      ctx.beginPath(); ctx.arc(px + 12, py + 18, 6, 0, Math.PI * 2); ctx.arc(px + 20, py + 17, 6.5, 0, Math.PI * 2); ctx.arc(px + 16, py + 13, 6, 0, Math.PI * 2); ctx.fill();
    } else if (td.debris === 'twig') {
      ctx.strokeStyle = '#7d502d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px + 7, py + 20); ctx.lineTo(px + 24, py + 15); ctx.stroke(); ctx.lineCap = 'butt';
    } else if (td.debris === 'stone') {
      ctx.fillStyle = '#a5aab3'; ctx.beginPath(); ctx.ellipse(px + 16, py + 18, 9.5, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6c727d'; ctx.lineWidth = 1.3; ctx.stroke();
    }
    if (td.placeable === 'sprinkler') {
      ctx.fillStyle = '#8fa3b8'; ctx.beginPath(); ctx.arc(px + 16, py + 17, 8, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(px + 16, py + 15, 2.8, 0, Math.PI * 2); ctx.fill();
    } else if (td.placeable === 'lantern') {
      ctx.strokeStyle = '#6e4c30'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px + 16, py + 26); ctx.lineTo(px + 16, py + 11); ctx.stroke();
      roundRectPath(px + 10, py + 7, 12, 11, 4); ctx.fillStyle = '#fef08a'; ctx.fill(); ctx.strokeStyle = '#6e4c30'; ctx.lineWidth = 1.4; ctx.stroke();
    }
    if (td.crop) drawCropSprite(px, py, td.crop, x, y);
  }

  function drawCropSprite(px, py, cropObj, gx, gy) {
    const c = CROPS[cropObj.id], progress = Math.min(1, cropObj.daysGrown / c.days), ripe = progress >= 1;
    const sway = Math.sin(animTime * 2.6 + gx * 0.9 + gy * 0.7) * (ripe ? 1.8 : 0.8);
    if (progress === 0) {
      ctx.fillStyle = '#f3dfb8';
      for (const [ox, oy] of [[11, 16], [19, 14], [15, 21]]) { ctx.beginPath(); ctx.ellipse(px + ox, py + oy, 2.2, 1.5, 0.4, 0, Math.PI * 2); ctx.fill(); }
    } else if (progress < 0.55) {
      ctx.strokeStyle = '#4e9e4c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px + 16, py + 23); ctx.quadraticCurveTo(px + 16 + sway, py + 18, px + 16 + sway, py + 14); ctx.stroke();
      ctx.fillStyle = '#7ad166';
      ctx.beginPath(); ctx.ellipse(px + 12 + sway, py + 15, 4, 2.4, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px + 20 + sway, py + 15, 4, 2.4, 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (!ripe) {
      ctx.fillStyle = c.leaf;
      ctx.beginPath(); ctx.arc(px + 12 + sway, py + 17, 5.5, 0, Math.PI * 2); ctx.arc(px + 20 + sway, py + 17, 5.5, 0, Math.PI * 2); ctx.arc(px + 16 + sway, py + 13, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(px + 16 + sway, py + 17, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      const bounce = Math.abs(Math.sin(animTime * 3.2 + gx)) * -2;
      ctx.fillStyle = 'rgba(65,45,25,0.2)'; ctx.beginPath(); ctx.ellipse(px + 16, py + 25, 8.5, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c.leaf;
      ctx.beginPath(); ctx.ellipse(px + 11 + sway, py + 13 + bounce, 6, 4, -0.4, 0, Math.PI * 2); ctx.ellipse(px + 21 + sway, py + 13 + bounce, 6, 4, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
      if (cropObj.id === 'wheat') {
        ctx.fillStyle = c.color;
        for (const ox of [-5, 0, 5]) { ctx.beginPath(); ctx.ellipse(px + 16 + ox + sway, py + 15 + bounce, 3, 7, ox * 0.05, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      } else if (cropObj.id === 'carrot') {
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.moveTo(px + 11, py + 14 + bounce); ctx.lineTo(px + 21, py + 14 + bounce); ctx.lineTo(px + 16, py + 25 + bounce); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (cropObj.id === 'corn') {
        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.ellipse(px + 16 + sway * 0.5, py + 16 + bounce, 5, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (cropObj.id === 'pumpkin') {
        ctx.fillStyle = c.color; ctx.beginPath(); ctx.ellipse(px + 16, py + 19 + bounce, 9.5, 7.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (cropObj.id === 'blueberry') {
        ctx.fillStyle = c.leaf; ctx.beginPath(); ctx.arc(px + 16 + sway, py + 17 + bounce, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = c.color;
        for (const [ox, oy] of [[12, 15], [20, 14], [16, 20]]) { ctx.beginPath(); ctx.arc(px + ox + sway, py + oy + bounce, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      } else if (cropObj.id === 'starfruit') {
        ctx.fillStyle = c.color; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? 9.5 : 4.2, a = (i * Math.PI) / 5 - Math.PI / 2; const sx = px + 16 + Math.cos(a) * r, sy = py + 17 + bounce + Math.sin(a) * r; if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(px + 16, py + 18 + bounce, 7.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(px + 13.5, py + 15.5 + bounce, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      if (Math.sin(animTime * 4.5 + gx * 2 + gy) > 0.4) { ctx.fillStyle = '#fff9c4'; ctx.beginPath(); ctx.arc(px + 23, py + 8 + bounce, 2.2, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  function drawCursorHighlight() {
    let tx, ty;
    const ptx = state.player.x / TILE, pty = state.player.y / TILE;
    if (mouseTile.inside && Math.hypot(mouseTile.x + 0.5 - ptx, mouseTile.y + 0.5 - pty) <= 2.3) { tx = mouseTile.x; ty = mouseTile.y; }
    else { const f = getFacedTile(); tx = f.x; ty = f.y; }
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
    const slot = getAllHotbarSlots().all[state.selectedSlot] || getAllHotbarSlots().all[0];
    let tiles = [[tx, ty]];
    if (slot.id === 'hoe' && MAPS.farm[ty][tx] === TILE_TYPE.FARMABLE) tiles = getAreaTiles(tx, ty, state.hoeLevel);
    if (slot.id === 'can' && MAPS.farm[ty][tx] === TILE_TYPE.FARMABLE) tiles = getAreaTiles(tx, ty, state.canLevel);
    ctx.strokeStyle = 'rgba(255, 250, 210, 0.9)'; ctx.lineWidth = 2;
    for (const [gx, gy] of tiles) {
      if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) continue;
      roundRectPath(gx * TILE + 2, gy * TILE + 2, TILE - 4, TILE - 4, 6); ctx.stroke();
    }
  }

  function drawCottageSprite(c, x, y, styleId = 'terracotta', opts = {}) {
    const hs = HOUSE_STYLE_MAP[styleId] || HOUSE_STYLES[0];
    const w = 4 * TILE, h = 3 * TILE;
    const winter = Boolean(opts.winter);
    const isEvening = Boolean(opts.evening);
    const kitchen = Boolean(opts.kitchen);

    // Shadow
    c.fillStyle = 'rgba(56,40,25,0.18)';
    c.beginPath(); c.ellipse(x + w / 2, y + h, w * 0.52, 9, 0, 0, Math.PI * 2); c.fill();

    // Chimney
    roundRectPath(x + w - 34, y - 6, 16, 26, 3, c);
    c.fillStyle = hs.chimney; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.4; c.stroke();

    // Wall body
    roundRectPath(x + 8, y + 36, w - 16, h - 36, 6, c);
    c.fillStyle = hs.wall; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();

    // Subtle wall texture details by cottage style
    if (hs.wallDetail === 'timber') {
      c.strokeStyle = 'rgba(122, 82, 48, 0.25)'; c.lineWidth = 1.1;
      for (let ly = y + 48; ly < y + h - 4; ly += 10) {
        c.beginPath(); c.moveTo(x + 10, ly); c.lineTo(x + w - 10, ly); c.stroke();
      }
    } else if (hs.wallDetail === 'stone') {
      c.fillStyle = 'rgba(146, 134, 178, 0.22)';
      for (const [bx, by] of [[14, 79], [28, 84], [96, 80], [104, 86], [16, 44], [100, 44]]) {
        roundRectPath(x + bx, y + by, 10, 5, 2, c); c.fill();
      }
    }

    // Roof silhouette per style
    c.beginPath();
    if (hs.roofStyle === 'gable') {
      c.moveTo(x - 3, y + 40); c.lineTo(x + w / 2, y + 4); c.lineTo(x + w + 3, y + 40);
    } else if (hs.roofStyle === 'thatch') {
      c.moveTo(x - 4, y + 42);
      c.bezierCurveTo(x + 12, y + 10, x + w - 12, y + 10, x + w + 4, y + 42);
    } else {
      c.moveTo(x - 2, y + 40); c.quadraticCurveTo(x + w / 2, y - 4, x + w + 2, y + 40);
    }
    c.closePath();
    c.fillStyle = winter ? '#eef6fa' : hs.roof; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();

    if (hs.roofStyle === 'thatch' && !winter) {
      c.strokeStyle = 'rgba(166, 112, 42, 0.38)'; c.lineWidth = 1.2;
      for (let tx = x + 16; tx < x + w - 14; tx += 14) {
        c.beginPath(); c.moveTo(tx, y + 25); c.lineTo(tx - 3, y + 38); c.stroke();
      }
    }

    if (winter) {
      c.fillStyle = '#ffffff';
      c.beginPath(); c.moveTo(x + 6, y + 32); c.quadraticCurveTo(x + w / 2, y + 2, x + w - 6, y + 32); c.quadraticCurveTo(x + w / 2, y + 24, x + 6, y + 32); c.fill();
    }

    // Scalloped eaves trim
    c.fillStyle = winter ? '#ffffff' : hs.roofTrim;
    for (let sx = x + 6; sx < x + w - 4; sx += 12) {
      c.beginPath(); c.arc(sx, y + 40, 4.5, 0, Math.PI); c.fill();
    }

    // Door
    if (hs.doorStyle === 'round') {
      c.beginPath(); c.arc(x + 63, y + 80, 14, Math.PI, 0); c.lineTo(x + 77, y + h); c.lineTo(x + 49, y + h); c.closePath();
    } else if (hs.doorStyle === 'double') {
      roundRectPath(x + 50, y + 61, 26, h - 61, 3, c);
    } else {
      c.beginPath(); c.moveTo(x + 50, y + h); c.lineTo(x + 50, y + 66); c.arc(x + 63, y + 66, 13, Math.PI, 0); c.lineTo(x + 76, y + h); c.closePath();
    }
    c.fillStyle = hs.door; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.5; c.stroke();
    if (hs.doorStyle === 'double') {
      c.beginPath(); c.moveTo(x + 63, y + 61); c.lineTo(x + 63, y + h); c.stroke();
    } else {
      c.strokeStyle = '#5fa35b'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(x + 63, y + 72, 4.5, 0, Math.PI * 2); c.stroke();
    }

    // Windows & flower boxes
    const winCol = isEvening ? '#fef08a' : '#bfe3f2';
    for (const wx of [x + 17, x + w - 39]) {
      roundRectPath(wx, y + 52, 22, 19, 5, c); c.fillStyle = winCol; c.fill(); c.strokeStyle = hs.windowFrame; c.lineWidth = 1.8; c.stroke();
      roundRectPath(wx - 2, y + 71, 26, 7, 2, c); c.fillStyle = hs.flowerBox; c.fill();
      const fl = hs.flowers;
      for (const [ox, col] of [[3, fl[0]], [11, fl[1]], [19, fl[2]]]) {
        c.fillStyle = col; c.beginPath(); c.arc(wx + ox, y + 71, 3, 0, Math.PI * 2); c.fill();
      }
    }

    // Cozy Kitchen badge on roof when kitchen is unlocked!
    if (kitchen) {
      c.fillStyle = '#fff9e6'; c.beginPath(); c.arc(x + w / 2, y + 24, 10, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#9c6239'; c.lineWidth = 1.4; c.stroke();
      c.font = '11px sans-serif'; c.textAlign = 'center'; c.fillText('🍳', x + w / 2, y + 28);
    }
  }

  function drawCottage() {
    const cot = getFarmLayout().cottage;
    drawCottageSprite(ctx, cot.x * TILE, cot.y * TILE, state.houseStyle, {
      winter: isWinter(),
      evening: state.timeMinutes >= 17 * 60 + 30,
      kitchen: state.kitchenUnlocked
    });
  }

  function drawMailbox() {
    const mb = getFarmLayout().mailbox;
    const px = mb.x * TILE, py = mb.y * TILE;
    ctx.fillStyle = '#a4754d'; ctx.fillRect(px + 14, py + 14, 4, 16);
    roundRectPath(px + 8, py + 7, 16, 11, 5); ctx.fillStyle = '#e89587'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.stroke();
    if (state.unreadMail) {
      const bob = Math.sin(animTime * 4.5) * 3;
      roundRectPath(px + 8, py - 9 + bob, 16, 11, 2.5); ctx.fillStyle = '#fffdf5'; ctx.fill(); ctx.strokeStyle = '#d97757'; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  function drawShippingBin() {
    const sb = getFarmLayout().shipping;
    const px = sb.x * TILE, py = sb.y * TILE;
    roundRectPath(px + 4, py + 8, 24, 19, 4); ctx.fillStyle = '#c48d59'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
    roundRectPath(px + 2.5, py + 5, 27, 7, 3); ctx.fillStyle = isWinter() ? '#f1f7fa' : '#dba672'; ctx.fill(); ctx.stroke();
    if (getShippingPendingGold() > 0) { ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(px + 25, py + 5, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }

  function drawShopStand() {
    const sh = getFarmLayout().shop;
    const x = sh.x * TILE, y = sh.y * TILE, w = 5 * TILE, h = 3 * TILE;
    roundRectPath(x + 8, y + 32, w - 16, h - 32, 6); ctx.fillStyle = '#f5e6cc'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#d9c29f'; ctx.fillRect(x + 14, y + 38, w - 28, 30);
    const bob = Math.sin(animTime * 2.4) * 1.2, nx = x + w / 2, ny = y + 48 + bob;
    ctx.fillStyle = '#73ab84'; roundRectPath(nx - 9, ny + 6, 18, 16, 5); ctx.fill();
    ctx.fillStyle = '#ffe0c8'; ctx.beginPath(); ctx.arc(nx, ny, 8.5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#4a3222'; ctx.beginPath(); ctx.arc(nx - 3, ny, 1.3, 0, Math.PI * 2); ctx.arc(nx + 3, ny, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e08670'; ctx.beginPath(); ctx.ellipse(nx, ny - 7.5, 10, 4.5, -0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // --- PASTURE ANIMALS (Cows, Sheep, Chickens, Ducks) & DROPS ---
  function drawAnimal(a) {
    const bob = Math.abs(Math.sin(animTime * 4 + a.x * 0.05)) * (a.wait > 0 ? 0.5 : 2.2);
    ctx.save();
    ctx.translate(a.x, a.y - bob);
    ctx.scale(a.dir, 1);

    ctx.fillStyle = 'rgba(56,40,25,0.2)';
    ctx.beginPath(); ctx.ellipse(0, 8 + bob, a.type === 'cow' ? 14 : 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.25;

    if (a.type === 'chicken') {
      ctx.fillStyle = '#fffdf7';
      ctx.beginPath(); ctx.ellipse(0, 1, 8.5, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(5, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e85d5d'; ctx.beginPath(); ctx.arc(5, -10, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(9.5, -5); ctx.lineTo(13, -4); ctx.lineTo(9.5, -3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(6.5, -5.8, 1.1, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === 'duck') {
      ctx.fillStyle = '#fff9e6';
      ctx.beginPath(); ctx.ellipse(-1, 1, 9.5, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(6, -6, 5.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(11.5, -5.2, 3.6, 1.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(7.2, -7, 1.1, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === 'sheep') {
      // Fluffy cloud wool body
      ctx.fillStyle = '#fffdf9';
      for (const [ox, oy, r] of [[-7, 0, 6.5], [0, -3, 7.5], [7, 0, 6.5], [-3, 3, 6], [4, 3, 6]]) {
        ctx.beginPath(); ctx.arc(ox, oy, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#d6c8b8'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(0, 0, 12.5, 8.5, 0, 0, Math.PI * 2); ctx.stroke();
      // Cute dark-cream face + floppy ears
      ctx.fillStyle = '#f2dec2'; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.ellipse(10.5, -2, 5.5, 6, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(7, -6.5, 3, 1.8, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(12, -3, 1.2, 0, Math.PI * 2); ctx.fill();
    } else if (a.type === 'cow') {
      // Legs
      ctx.fillStyle = '#fffaf0';
      ctx.fillRect(-10, 4, 4, 6); ctx.fillRect(6, 4, 4, 6);
      // Plump cow body + cute brown/dark spots
      roundRectPath(-14, -7, 26, 14, 7); ctx.fillStyle = '#fffdf9'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#5c4033';
      ctx.beginPath(); ctx.ellipse(-5, -2, 4.5, 3.2, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4, 1, 3.5, 2.5, -0.2, 0, Math.PI * 2); ctx.fill();
      // Head + pink snout + tiny horns
      roundRectPath(9, -11, 11, 11, 4.5); ctx.fillStyle = '#fffdf9'; ctx.fill(); ctx.stroke();
      roundRectPath(13, -4, 8, 5, 2.5); ctx.fillStyle = '#f7b2c4'; ctx.fill(); ctx.stroke();

    // Little hungry bubble if not fed yet today!
    if (!a.fed) {
      ctx.scale(a.dir, 1); // unflip text
      ctx.fillStyle = 'rgba(255, 252, 240, 0.9)';

      ctx.font = '9px sans-serif'; ctx.textAlign = 'center';

  // =========================================================================
  // STORYBOOK FARMER SPRITE (FEMALE & MALE + OUTFITS + LIVE PREVIEW SUPPORT)
  // =========================================================================
  function drawBraid(c, x, y, sway, side, d) {
    c.fillStyle = d.hair;
    c.strokeStyle = INK;
    c.lineWidth = 1.1;
    const pts = [
      [x + side * 0.5, y],
      [x + side * 1.4 + sway * 0.4, y + 4.3],
      [x + side * 2.0 + sway * 0.8, y + 8.5]
    ];
    for (const [bx, by] of pts) {
      c.beginPath(); c.arc(bx, by, 2.7, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    const tipX = pts[2][0], tipY = pts[2][1] + 2.5;
    c.fillStyle = d.ribbon;
    c.beginPath(); c.ellipse(tipX - 2, tipY, 2.1, 1.3, -0.3, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(tipX + 2, tipY, 2.1, 1.3, 0.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = d.hair;
    c.beginPath(); c.arc(tipX + sway * 0.2, tipY + 2.2, 1.5, 0, Math.PI * 2); c.fill();
  }

  function drawFarmerSprite(c, opts) {
    const {
      x, y, dir = 'down', gender = 'female', outfit: d = getDress(),
      scale = 1, walkFrame = 0, swingTimer = 0, swingTool = null
    } = opts;
    const walking = walkFrame > 0;
    const step = walking ? Math.sin(walkFrame) * 3 : 0;
    const bob = walking ? Math.abs(Math.cos(walkFrame)) * -2.2 : Math.sin(animTime * 2.5) * 0.6;
    const sway = walking ? Math.sin(walkFrame) * 1.6 : Math.sin(animTime * 2) * 0.4;

    c.save();
    c.translate(x, y);
    if (scale !== 1) c.scale(scale, scale);

    // Ground shadow
    c.fillStyle = 'rgba(56, 40, 25, 0.24)';
    c.beginPath(); c.ellipse(0, 6.5, 11, 4.5, 0, 0, Math.PI * 2); c.fill();

    if (gender === 'male') {
      // Boots & cuffed trousers
      c.fillStyle = d.pants || '#5f87b2'; c.strokeStyle = INK; c.lineWidth = 1.05;
      roundRectPath(-6.2, -3.5 + bob * 0.3 + step * 0.6, 5.2, 7.2, 2, c); c.fill(); c.stroke();
      roundRectPath(1.0, -3.5 + bob * 0.3 - step * 0.6, 5.2, 7.2, 2, c); c.fill(); c.stroke();
      c.fillStyle = '#73472a'; c.strokeStyle = INK; c.lineWidth = 1;
      c.beginPath(); c.ellipse(-3.7, 4.4 + step * 0.8, 3.6, 2.3, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(3.7, 4.4 - step * 0.8, 3.6, 2.3, 0, 0, Math.PI * 2); c.fill(); c.stroke();

      // Shirt sleeves
      c.fillStyle = d.shirt || '#fff8e8'; c.strokeStyle = INK; c.lineWidth = 1.1;
      c.beginPath(); c.ellipse(-8.6, -9.5 + bob, 3.3, 4.1, 0.2, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(8.6, -9.5 + bob, 3.3, 4.1, -0.2, 0, Math.PI * 2); c.fill(); c.stroke();
      // Little hands
      c.fillStyle = '#ffe4cc';
      c.beginPath(); c.arc(-9.2, -5.6 + bob, 2.1, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.arc(9.2, -5.6 + bob, 2.1, 0, Math.PI * 2); c.fill(); c.stroke();

      // Torso shirt
      roundRectPath(-7.4, -13.5 + bob, 14.8, 12.2, 4.5, c);
      c.fillStyle = d.shirt || '#fff8e8'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke();

      // Overalls / Vest / Shirt accent
      if (d.style === 'overalls') {
        // Denim bib + straps
        roundRectPath(-5.8, -9.8 + bob, 11.6, 8.6, 3, c);
        c.fillStyle = d.overalls; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.05; c.stroke();
        c.fillStyle = d.overalls;
        c.fillRect(-5.2, -13.2 + bob, 2.2, 4.5);
        c.fillRect(3.0, -13.2 + bob, 2.2, 4.5);
        if (dir !== 'up') {
          c.fillStyle = '#ffd166';
          c.beginPath(); c.arc(-4.1, -9.3 + bob, 1.1, 0, Math.PI * 2); c.arc(4.1, -9.3 + bob, 1.1, 0, Math.PI * 2); c.fill();
        }
      } else if (d.style === 'vest') {
        // Open cottage vest / cardigan
        c.fillStyle = d.overalls; c.strokeStyle = INK; c.lineWidth = 1.05;
        roundRectPath(-7.2, -13.2 + bob, 5.4, 11.4, 2.5, c); c.fill(); c.stroke();
        roundRectPath(1.8, -13.2 + bob, 5.4, 11.4, 2.5, c); c.fill(); c.stroke();
      } else {
        // Cozy chambray shirt with subtle stripe & brown belt
        c.fillStyle = 'rgba(255,255,255,0.28)';
        c.fillRect(-4.2, -13 + bob, 1.6, 10.5);
        c.fillRect(2.6, -13 + bob, 1.6, 10.5);
        c.fillStyle = '#7d502d';
        c.fillRect(-7.2, -3.5 + bob, 14.4, 2.4);
        c.fillStyle = '#f5cb5c';
        c.fillRect(-1.5, -3.7 + bob, 3, 2.8);
      }

      // Cozy farm neckerchief / scarf
      if (dir !== 'up') {
        c.fillStyle = d.ribbon; c.strokeStyle = INK; c.lineWidth = 0.9;
        c.beginPath(); c.moveTo(-4.6, -13.2 + bob); c.lineTo(4.6, -13.2 + bob); c.lineTo(0, -9.6 + bob); c.closePath(); c.fill(); c.stroke();
      }

      // Head & short tousled storybook hair
      if (dir === 'up') {
        c.fillStyle = d.hair; c.strokeStyle = INK; c.lineWidth = 1.2;
        c.beginPath(); c.arc(0, -19.5 + bob, 8.5, 0, Math.PI * 2); c.fill(); c.stroke();
      } else {
        c.fillStyle = '#ffe4cc'; c.strokeStyle = INK; c.lineWidth = 1.2;
        c.beginPath(); c.arc(0, -19.5 + bob, 8.2, 0, Math.PI * 2); c.fill(); c.stroke();
        // Side hair tufts & boyish bangs
        c.fillStyle = d.hair;
        c.beginPath();
        c.arc(0, -20.8 + bob, 8.5, Math.PI * 0.96, Math.PI * 2.04);
        c.lineTo(7.8, -17.4 + bob);
        c.lineTo(5.6, -19.2 + bob);
        c.lineTo(2.4, -18.2 + bob);
        c.lineTo(0.2, -20.0 + bob);
        c.lineTo(-2.8, -18.0 + bob);
        c.lineTo(-5.8, -19.4 + bob);
        c.lineTo(-7.8, -17.4 + bob);
        c.closePath(); c.fill();

        const eyeShift = dir === 'right' ? 2.2 : dir === 'left' ? -2.2 : 0;
        c.fillStyle = '#3d281b';
        if (dir === 'down') {
          c.beginPath(); c.arc(-3.1, -17.8 + bob, 1.5, 0, Math.PI * 2); c.arc(3.1, -17.8 + bob, 1.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(-3.5, -18.4 + bob, 0.55, 0, Math.PI * 2); c.arc(2.7, -18.4 + bob, 0.55, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(244, 146, 134, 0.45)';
          c.beginPath(); c.ellipse(-5.2, -15.7 + bob, 1.7, 1.0, 0, 0, Math.PI * 2); c.ellipse(5.2, -15.7 + bob, 1.7, 1.0, 0, 0, Math.PI * 2); c.fill();
          c.strokeStyle = '#9e5a49'; c.lineWidth = 1.05;
          c.beginPath(); c.arc(0, -15.6 + bob, 1.8, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
        } else {
          c.beginPath(); c.arc(eyeShift * 1.3, -17.8 + bob, 1.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#ffffff'; c.beginPath(); c.arc(eyeShift * 1.3 - 0.3, -18.4 + bob, 0.55, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(244, 146, 134, 0.42)'; c.beginPath(); c.ellipse(eyeShift * 1.7, -15.7 + bob, 1.6, 1.0, 0, 0, Math.PI * 2); c.fill();
        }
      }

      // Woven Farmer Straw Hat (slightly flatter crown + colorful band + cute wheat sprig!)
      c.fillStyle = '#efd084';
      c.beginPath(); c.ellipse(0, -24.6 + bob, 13.8, 4.6, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#946a30'; c.lineWidth = 1.25; c.stroke();
      roundRectPath(-7.8, -30.5 + bob, 15.6, 6.4, 3, c);
      c.fillStyle = '#f5dc98'; c.fill(); c.stroke();
      c.fillStyle = d.ribbon;
      c.fillRect(-7.6, -26.2 + bob, 15.2, 2.2);
      // Tiny golden leaf/wheat sprout tucked in hatband
      c.fillStyle = '#79b879';
      c.beginPath(); c.ellipse(6.5, -27.2 + bob, 2.6, 1.3, -0.5, 0, Math.PI * 2); c.fill();
    } else {
      // FEMALE: Boots & white socks
      c.fillStyle = '#fffdf7';
      c.fillRect(-5.5, -1 + step * 0.7, 3.6, 4);
      c.fillRect(1.9, -1 - step * 0.7, 3.6, 4);
      c.fillStyle = '#8a5536'; c.strokeStyle = INK; c.lineWidth = 1;
      c.beginPath(); c.ellipse(-3.8, 4.2 + step * 0.8, 3.3, 2.3, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(3.8, 4.2 - step * 0.8, 3.3, 2.3, 0, 0, Math.PI * 2); c.fill(); c.stroke();

      // Puff sleeves
      c.fillStyle = '#fff9ee'; c.strokeStyle = INK; c.lineWidth = 1.1;
      c.beginPath(); c.arc(-8.5, -10.5 + bob, 3.6, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.arc(8.5, -10.5 + bob, 3.6, 0, Math.PI * 2); c.fill(); c.stroke();

      // Flared floral cottagecore dress (碎花农妇小裙子)
      c.beginPath();
      c.moveTo(-6, -13 + bob); c.lineTo(6, -13 + bob);
      c.quadraticCurveTo(11 + sway * 0.5, -5 + bob, 12.5 + sway, 2 + bob);
      c.quadraticCurveTo(6 + sway, 4.5 + bob, 0 + sway * 0.5, 3 + bob);
      c.quadraticCurveTo(-6 + sway * 0.5, 4.5 + bob, -12.5 + sway, 2 + bob);
      c.quadraticCurveTo(-11 + sway * 0.5, -5 + bob, -6, -13 + bob);
      c.closePath();
      c.fillStyle = d.skirt; c.fill();

      // Tiny floral blooms scattered on skirt
      for (const [bx, by, col] of [[-6.5,-3.5,d.flowerA],[5.8,-4,d.flowerB],[-2.5,-0.2,d.flowerB],[7.8,0.2,d.flowerA],[-8.2,0.5,d.flowerA],[2.4,-7.2,d.flowerA]]) {
        c.fillStyle = d.leaf; c.beginPath(); c.arc(bx + sway * 0.6 + 1.4, by + bob + 0.8, 1.3, 0, Math.PI * 2); c.fill();
        c.fillStyle = col; c.beginPath(); c.arc(bx + sway * 0.6, by + bob, 1.8, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffd56b'; c.beginPath(); c.arc(bx + sway * 0.6, by + bob, 0.7, 0, Math.PI * 2); c.fill();
      }
      c.strokeStyle = INK; c.lineWidth = 1.2; c.stroke();

      // White pinafore apron (front) or waist bow (back)
      if (dir !== 'up') {
        c.fillStyle = '#fffdf8';
        c.beginPath();
        c.moveTo(-4.5, -10.5 + bob); c.lineTo(4.5, -10.5 + bob);
        c.lineTo(6 + sway * 0.5, -0.5 + bob);
        c.quadraticCurveTo(0 + sway * 0.5, 1.5 + bob, -6 + sway * 0.5, -0.5 + bob);
        c.closePath(); c.fill();
        c.strokeStyle = '#d4c3aa'; c.lineWidth = 0.9; c.stroke();
      } else {
        c.fillStyle = d.ribbon;
        c.beginPath(); c.ellipse(-3.5, -8 + bob, 3.2, 2, -0.3, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(3.5, -8 + bob, 3.2, 2, 0.3, 0, Math.PI * 2); c.fill();
        c.fillRect(-1.5, -7 + bob, 3, 5);
      }

      // Back head hair when facing up
      if (dir === 'up') {
        c.fillStyle = d.hair; c.strokeStyle = INK; c.lineWidth = 1.2;
        c.beginPath(); c.arc(0, -19.5 + bob, 8.6, 0, Math.PI * 2); c.fill(); c.stroke();
      }

      // Face
      if (dir !== 'up') {
        c.fillStyle = '#ffe4cc'; c.strokeStyle = INK; c.lineWidth = 1.2;
        c.beginPath(); c.arc(0, -19.5 + bob, 8.2, 0, Math.PI * 2); c.fill(); c.stroke();
        // Cute bangs
        c.fillStyle = d.hair;
        c.beginPath();
        c.arc(0, -20.5 + bob, 8.4, Math.PI * 1.05, Math.PI * 1.95);
        c.lineTo(6, -19 + bob);
        c.quadraticCurveTo(2, -21.5 + bob, 0, -18.5 + bob);
        c.quadraticCurveTo(-2.5, -21.5 + bob, -6.5, -19 + bob);
        c.closePath(); c.fill();

        const eyeShift = dir === 'right' ? 2.2 : dir === 'left' ? -2.2 : 0;
        c.fillStyle = '#3d281b';
        if (dir === 'down') {
          c.beginPath(); c.arc(-3.1, -18 + bob, 1.5, 0, Math.PI * 2); c.arc(3.1, -18 + bob, 1.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(-3.5, -18.6 + bob, 0.55, 0, Math.PI * 2); c.arc(2.7, -18.6 + bob, 0.55, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(244, 134, 152, 0.58)';
          c.beginPath(); c.ellipse(-5.3, -15.8 + bob, 1.9, 1.1, 0, 0, Math.PI * 2); c.ellipse(5.3, -15.8 + bob, 1.9, 1.1, 0, 0, Math.PI * 2); c.fill();
          c.strokeStyle = '#9e5a49'; c.lineWidth = 1;
          c.beginPath(); c.arc(0, -15.6 + bob, 1.6, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
        } else {
          c.beginPath(); c.arc(eyeShift * 1.3, -18 + bob, 1.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#ffffff'; c.beginPath(); c.arc(eyeShift * 1.3 - 0.3, -18.6 + bob, 0.55, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(244, 134, 152, 0.55)'; c.beginPath(); c.ellipse(eyeShift * 1.7, -15.8 + bob, 1.8, 1.1, 0, 0, Math.PI * 2); c.fill();
        }
      }

      // ADORABLE TWIN BRAIDED PIGTAILS
      if (dir === 'down' || dir === 'up') {
        drawBraid(c, -8.2, -16.8 + bob, -sway, -1, d);
        drawBraid(c, 8.2, -16.8 + bob, sway, 1, d);
      } else if (dir === 'right') {
        drawBraid(c, -6.5, -16.8 + bob, -sway, -1, d);
        drawBraid(c, 3.2, -16.2 + bob, sway, 0.6, d);
      } else {
        drawBraid(c, 6.5, -16.8 + bob, sway, 1, d);
        drawBraid(c, -3.2, -16.2 + bob, -sway, -0.6, d);
      }

      // Little Woven Straw Sunhat + Ribbon Bow
      c.fillStyle = '#f3d284';
      c.beginPath(); c.ellipse(0, -24.5 + bob, 14.5, 5.2, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#9c7134'; c.lineWidth = 1.25; c.stroke();
      c.fillStyle = '#f7dd99';
      c.beginPath(); c.arc(0, -25.2 + bob, 8.2, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = d.ribbon; c.lineWidth = 2.6;
      c.beginPath(); c.ellipse(0, -25 + bob, 8.2, 2.2, 0, 0.08 * Math.PI, 0.92 * Math.PI); c.stroke();
      const bowX = dir === 'left' ? -6.5 : 6.8;
      c.fillStyle = d.ribbon;
      c.beginPath(); c.ellipse(bowX - 2, -25.5 + bob, 2.8, 1.6, -0.3, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(bowX + 2, -25.5 + bob, 2.8, 1.6, 0.3, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fffdf5'; c.beginPath(); c.arc(bowX, -25.5 + bob, 1.4, 0, Math.PI * 2); c.fill();
    }

    if (swingTimer > 0) {
      const ang = dir === 'right' ? 0 : dir === 'down' ? Math.PI / 2 : dir === 'left' ? Math.PI : -Math.PI / 2;
      c.fillStyle = swingTool === 'can' ? '#67d4f6' : '#fef08a';
      c.beginPath(); c.arc(Math.cos(ang) * 16, -8 + Math.sin(ang) * 16, 4.5, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  function drawGirlFarmer() {
    const p = state.player;
    drawFarmerSprite(ctx, {
      x: p.x, y: p.y, dir: p.dir, gender: state.gender, outfit: getDress(),
      scale: 1, walkFrame: p.walkFrame, swingTimer: p.swingTimer, swingTool: p.swingTool
    });
  }

  function drawTrees(season) {
    const m = curMap();
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (m[y][x] !== TILE_TYPE.WALL || getLandmarkAt(x, y)) continue;
        const px = x * TILE + 16, py = y * TILE + 16;
        const sway = Math.sin(animTime * 1.4 + x * 0.7 + y * 0.5) * 1.2;
        ctx.fillStyle = '#8b6240'; roundRectPath(px - 4, py + 2, 8, 12, 3); ctx.fill();
        ctx.fillStyle = season.treeA;
        ctx.beginPath(); ctx.arc(px - 7 + sway, py + 1, 9.5, 0, Math.PI * 2); ctx.arc(px + 7 + sway, py + 1, 9.5, 0, Math.PI * 2); ctx.arc(px + sway, py - 5, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = season.treeB;
        ctx.beginPath(); ctx.arc(px - 4 + sway, py - 3, 8, 0, Math.PI * 2); ctx.arc(px + 5 + sway, py - 2, 7.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = season.treeHi;
        ctx.beginPath(); ctx.arc(px - 2 + sway, py - 8, 5, 0, Math.PI * 2); ctx.fill();
        if (hash2(x, y) > 0.58) {
          ctx.fillStyle = season.blossom;
          ctx.beginPath(); ctx.arc(px + 5 + sway, py - 5, 2.2, 0, Math.PI * 2); ctx.arc(px - 6 + sway, py + 2, 1.9, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  function drawAtmosphere(season) {
    const mins = state.timeMinutes;
    const snowy = isWinter();
    const isRain = state.weather === 'rainy' && !snowy;
    const isNight = mins >= 19 * 60;

    // 1. Cloudy drifting cloud shadows (soft cool-warm veil)
    if (state.weather === 'cloudy') {
      ctx.fillStyle = 'rgba(78, 96, 122, 0.10)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = 'rgba(60, 76, 98, 0.08)';
      for (let i = 0; i < 3; i++) {
        const cx = ((animTime * 14 + i * 310) % (CANVAS_W + 260)) - 130;
        const cy = 110 + i * 145;
        ctx.beginPath(); ctx.ellipse(cx, cy, 120, 46, -0.1, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 2. Rain ground water ripples (drawn under atmospheric filter)
    if (isRain) {
      ctx.strokeStyle = 'rgba(220, 245, 255, 0.45)';
      ctx.lineWidth = 1.1;
      for (const rp of rainRipples) {
        ctx.globalAlpha = Math.max(0, rp.life * 0.65);
        ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 3. Weather particles (Rain streaks / Winter snowflakes / Autumn maple leaves / Spring petals / Night fireflies)
    for (const d of ambientDrops) {
      if (isRain) {
        ctx.strokeStyle = 'rgba(205, 238, 255, 0.58)'; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3.5, d.y + 11); ctx.stroke();
      } else if (snowy) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath(); ctx.arc(d.x, d.y, d.size || 2.2, 0, Math.PI * 2); ctx.fill();
      } else if (isNight) {
        const pulse = 0.35 + 0.65 * Math.abs(Math.sin(d.phase));
        const rad = season.id === 'summer' ? 2.6 : 2.1;
        ctx.fillStyle = `rgba(254, 245, 158, ${pulse.toFixed(2)})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, rad, 0, Math.PI * 2); ctx.fill();
        if (season.id === 'summer') {
          ctx.fillStyle = `rgba(254, 245, 158, ${(pulse * 0.25).toFixed(2)})`;
          ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI * 2); ctx.fill();
        }
      } else if (season.id === 'autumn') {
        ctx.save();
        ctx.translate(d.x, d.y); ctx.rotate(d.phase * 0.7);
        ctx.fillStyle = d.speed > 1 ? '#e86f3a' : '#f2a93b';
        ctx.globalAlpha = 0.82;
        ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(3, 0); ctx.lineTo(0, 3.5); ctx.lineTo(-3, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = season.blossom; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.ellipse(d.x, d.y, 3.2, 1.9, d.phase, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    // 4. Smooth Dawn Mist -> Sunlit Day -> Amber Sunset -> Deep Cozy Night filter
    if (mins < 8 * 60) {
      const t = 1 - (mins - 360) / 120;
      ctx.fillStyle = `rgba(255, 232, 200, ${(t * 0.20).toFixed(3)})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    } else if (mins >= 16.5 * 60 && mins < 19.5 * 60) {
      const t = (mins - 990) / 180;
      ctx.fillStyle = `rgba(232, 132, 82, ${(t * 0.27).toFixed(3)})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    } else if (mins >= 19.5 * 60) {
      const t = Math.min(1, (mins - 1170) / 180);
      ctx.fillStyle = `rgba(24, 34, 78, ${(0.28 + t * 0.30).toFixed(3)})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
    if (isRain) { ctx.fillStyle = 'rgba(46, 76, 112, 0.14)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H); }

    // 5. Warm glowing cottage windows & garden lanterns at dusk/night
    if (mins >= 18 * 60) {
      const glowAlpha = Math.min(0.45, ((mins - 1080) / 180) * 0.45);
      const lay = getFarmLayout();
      const lights = state.area === 'farm'
        ? [
            [(lay.cottage.x + 1.3) * TILE, (lay.cottage.y + 2.3) * TILE, 64],
            [(lay.cottage.x + 2.8) * TILE, (lay.cottage.y + 2.3) * TILE, 64],
            [(lay.shop.x + 2.5) * TILE, (lay.shop.y + 2.2) * TILE, 74]
          ]
        : [[5.5 * TILE, 4 * TILE, 68], [18 * TILE, 4.2 * TILE, 74]];
      if (state.area === 'farm') {
        for (const [k, td] of Object.entries(state.farm)) {
          if (td.placeable === 'lantern') { const [lx, ly] = k.split(',').map(Number); lights.push([(lx + 0.5) * TILE, (ly + 0.5) * TILE, 82]); }
        }
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const [lx, ly, rad] of lights) {
        const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, rad);
        g.addColorStop(0, `rgba(255, 232, 145, ${glowAlpha})`); g.addColorStop(1, 'rgba(255, 210, 100, 0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, rad, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  window.addEventListener('themechange', () => render());
  window.addEventListener('beforeunload', () => { if (gameBooted && state.setupDone) saveState(true, true); });
  window.addEventListener('pagehide', () => { if (gameBooted && state.setupDone) saveState(true, true); });
  document.addEventListener('visibilitychange', () => {
    if (gameBooted && state.setupDone && document.visibilityState === 'hidden') saveState(true, false);
  });
  setInterval(() => { if (gameBooted && state.setupDone) saveState(true, true); }, 15000);

  applyStaticLabels();
  updateHUD();
  renderHotbar();
  gameBooted = true;
  if (!hadLocalSave) {
    if (!state.setupDone) openStartSetupModal(true);
    IDBBackup.load().then(parsed => {
      if (parsed && !hadLocalSave) {
        hadLocalSave = true;
        applyRestoredState(parsed);
      }
    }).catch(() => {});
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
