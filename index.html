  function getNearbyContext() {
    const ptx = state.player.x / TILE, pty = state.player.y / TILE;
    const faced = getFacedTile();
    const c = T().ctx;

    if (fishing.phase === 'waiting') return { icon: '🎣', text: c.waitingFish, action: () => cancelFishing() };
    if (fishing.phase === 'bite') return { icon: '❗', text: c.biteFish, action: () => hookBitingFish() };
    if (fishing.phase === 'reeling') return { icon: '🐟', text: c.reelingFish, action: null };

    // Companion pet nearby!
    if (state.pet && state.pet.type && Math.hypot(petAI.x - state.player.x, petAI.y - state.player.y) < 46) {
      const pname = L(PETS[state.pet.type].name);
      if (state.pet.hasGift) return { icon: '🎁', text: c.petGift(pname), action: () => interactWithPet() };
      if (!state.pet.pettedToday) return { icon: PETS[state.pet.type].emoji, text: c.petCompanion(pname), action: () => interactWithPet() };
    }

    if (state.area === 'pasture') {
      const drop = state.pastureDrops.find(d => Math.hypot(d.x - state.player.x, d.y - state.player.y) < 42);
      if (drop) return { icon: ITEMS[drop.itemId].emoji, text: c.collectDrop(L(ITEMS[drop.itemId].name)), action: () => collectDrop(drop.id) };
      const ani = state.animals.find(a => Math.hypot(a.x - state.player.x, a.y - state.player.y) < 44);
      if (ani) return { icon: ANIMALS[ani.type].emoji, text: c.petAnimal(L(ANIMALS[ani.type].name), ani.fed), action: () => petOrFeedAnimal(ani) };
    }

    const lm = getLandmarkAt(faced.x, faced.y);
    if (lm === 'cottage') return { icon: '🏡', text: c.cottage(state.kitchenUnlocked), action: () => openCottageModal() };
    if (lm === 'petBed') return { icon: '🐾', text: (state.pet && state.pet.type) ? c.petBedOwned : c.petBedEmpty, action: () => openPetModal() };
    if (lm === 'shop') return { icon: '🌸', text: c.shop, action: () => openShopModal() };
    if (lm === 'ranchShop') return { icon: '🥛', text: c.ranchShop, action: () => openRanchShopModal() };
    if (lm === 'barn') return { icon: '🏠', text: c.barn, action: () => openBarnModal() };
    if (lm === 'trough') {
      const hungry = state.animals.filter(a => !a.fed).length;
      return { icon: '🌾', text: c.trough(hungry), action: () => feedAllHungryAnimals() };
    }
    if (lm === 'gateToPasture') return { icon: '🐮', text: c.gateToPasture, action: () => switchArea('pasture') };
    if (lm === 'gateToFarm') return { icon: '🏡', text: c.gateToFarm, action: () => switchArea('farm') };
    if (lm === 'shipping') {
      const n = getShippableBasketCount();
      return { icon: '📦', text: n > 0 ? c.shippingSome(n) : c.shippingEmpty, action: () => shipAllFromSatchel() };
    }
    if (lm === 'mailbox') return { icon: '📬', text: state.unreadMail ? c.mailUnread : c.mailRead, action: () => openMailboxModal() };

    if (isNearWater(ptx, pty)) {
      if (getSelectedSlot().id === 'rod') {
        return { icon: '🎣', text: c.castRod, action: () => startFishingCast() };
      }
      if (state.water < getCanCapacity()) {
        return { icon: '💧', text: c.refill, action: () => refillWater() };
      }
    }
    if (state.area === 'farm') {
      const td = getTileData(faced.x, faced.y);
      if (td && td.crop && isCropRipe(td.crop)) {
        return { icon: CROPS[td.crop.id].emoji, text: c.harvest(L(CROPS[td.crop.id].name)), action: () => harvestTile(faced.x, faced.y) };
      }
    }
    return null;
  }

  function findNearbyWaterTile(ptx, pty) {
    const cx = Math.floor(ptx), cy = Math.floor(pty), m = curMap();
    let best = null, bestD = 99;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && m[ny][nx] === TILE_TYPE.WATER) {
        const d = Math.hypot(nx + 0.5 - ptx, ny + 0.5 - pty);
        if (d < bestD && d <= 2.4) { bestD = d; best = { x: nx, y: ny }; }
      }
    }
    return best;
  }

  function isNearWater(ptx, pty) {
    return !!findNearbyWaterTile(ptx, pty);
  }

  function performSmartInteract() {
    const hint = getNearbyContext();
    if (hint && hint.action) { hint.action(); return; }
    const f = getFacedTile();
    tryHarvestOrInteractTile(f.x, f.y);
  }

  function tryHarvestOrInteractTile(tx, ty) {
    const lm = getLandmarkAt(tx, ty);
    if (lm) { triggerLandmark(lm); return; }
    if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && curMap()[ty][tx] === TILE_TYPE.WATER) {
      if (getSelectedSlot().id === 'rod') startFishingCast(tx, ty);
      else refillWater();
      return;
    }
    if (state.area === 'farm') {
      const td = getTileData(tx, ty);
      if (td && td.crop && isCropRipe(td.crop)) { harvestTile(tx, ty); return; }
      if (td && td.placeable) {
        const p = td.placeable; td.placeable = null;
        state.placeables[p] = (state.placeables[p] || 0) + 1;
        AudioFX.place();
        addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.pickedUp(p === 'sprinkler' ? T().tools.sprinkler : T().tools.lantern), '#fff3c4');
        renderHotbar(); return;
      }
      performPrimaryAction(tx, ty);
    }
  }

  function pickPondFish() {
    const season = getSeason().id;
    const mins = state.timeMinutes;
    const isMorning = mins < 10 * 60;
    const isAfternoon = mins >= 11 * 60 && mins < 17 * 60;
    const isEvening = mins >= 16 * 60;
    const isLateEvening = mins >= 18 * 60;
    const isNight = mins >= 19 * 60;
    const isDay = !isNight;
    const isRain = state.weather === 'rainy';
    const isCloudy = state.weather === 'cloudy';
    const isSunny = state.weather === 'sunny';
    const isBreezy = state.weather === 'breezy';

    const pool = [];
    for (const fid of FISH_ORDER) {
      const f = FISH[fid];
      if (fid === 'pondLoach' && !(isEvening || isCloudy || isRain)) continue;
      if (fid === 'goldfish' && !(isDay && (isSunny || isCloudy))) continue;
      if (fid === 'sakuraShrimp' && !(season === 'spring' || isSunny)) continue;
      if (fid === 'koi' && !(isSunny || isBreezy)) continue;
      if (fid === 'rainbowTrout' && !(season === 'spring' || season === 'autumn' || isRain)) continue;
      if (fid === 'catfish' && !(isRain || isLateEvening)) continue;
      if (fid === 'lotusTurtle' && !(season === 'summer' || (isSunny && isAfternoon))) continue;
      if (fid === 'icefish' && !(season === 'winter' || (isCloudy && isMorning))) continue;
      if (fid === 'autumnCrab' && !(season === 'autumn' || isBreezy)) continue;
      if (fid === 'moonJelly' && !isNight) continue;
      if (fid === 'starryEel' && !(isNight || isRain)) continue;
      pool.push({ id: fid, w: f.rarity });
    }
    const totalW = pool.reduce((s, p) => s + p.w, 0);
    let r = Math.random() * totalW;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.id; }
    return 'riverPerch';
  }

  function startFishingCast(tx = null, ty = null) {
    if (fishing.phase !== 'idle') return;
    const wt = (tx !== null && ty !== null && curMap()[ty]?.[tx] === TILE_TYPE.WATER)
      ? { x: tx, y: ty }
      : findNearbyWaterTile(state.player.x / TILE, state.player.y / TILE);
    if (!wt) {
      AudioFX.error();
      addFloatText(state.player.x, state.player.y - 24, T().floats.needPond, '#bae6fd');
      return;
    }
    if (!spendEnergy(2)) return;
    faceToward(wt.x, wt.y);
    fishing.phase = 'waiting';
    fishing.bobberX = (wt.x + 0.35 + Math.random() * 0.35) * TILE;
    fishing.bobberY = (wt.y + 0.35 + Math.random() * 0.35) * TILE;
    fishing.timer = 2.0 + Math.random() * 3.0; // 2-5 seconds cozy wait
    fishing.fishId = null;
    fishing.hold = false;
    AudioFX.splash();
    spawnParticles(fishing.bobberX, fishing.bobberY, '#e0f7ff', 10, 1.5, 2.8);
    addFloatText(fishing.bobberX, fishing.bobberY - 14, T().floats.castLine, '#e0f2fe');
  }

  function hookBitingFish() {
    if (fishing.phase !== 'bite') return;
    fishing.phase = 'reeling';
    fishing.fishId = pickPondFish();
    fishing.barPos = 0.42;
    fishing.barVel = 0;
    fishing.barHeight = (fishing.fishId === 'goldenCarp' || fishing.fishId === 'starryEel') ? 0.24 : 0.28;
    fishing.fishPos = 0.48;
    fishing.fishTarget = 0.2 + Math.random() * 0.6;
    fishing.fishWait = 0.4;
    fishing.progress = 0.30;
    fishing.hold = true;
    AudioFX.water();
    spawnParticles(fishing.bobberX, fishing.bobberY, '#fff9c4', 12, 1.9, 3);
  }

  function finishFishCatch() {
    const fid = fishing.fishId || 'riverPerch';
    const fish = FISH[fid];
    cancelFishing();

    const weight = Number((fish.minKg + Math.random() * (fish.maxKg - fish.minKg)).toFixed(2));
    const goldChance = state.luckyCharm ? 0.38 : 0.18;
    const quality = (weight > fish.minKg + (fish.maxKg - fish.minKg) * 0.8 || Math.random() < goldChance) ? 1 : 0;

    const key = `${fid}_${quality}`;
    state.satchel[key] = (state.satchel[key] || 0) + 1;
    state.totalFishCaught = (state.totalFishCaught || 0) + 1;

    const prev = state.fishDex[fid] || { count: 0, maxWeight: 0 };
    const isNewRecord = weight > (prev.maxWeight || 0);
    state.fishDex[fid] = {
      count: (prev.count || 0) + 1,
      maxWeight: Math.max(prev.maxWeight || 0, weight)
    };

    AudioFX.fishCatch();
    saveState(true);
    updateHUD();
    openFishCatchModal(fid, weight, quality, isNewRecord);
  }

  function updateFishing(dt) {
    // Animate peaceful pond fish shadows
    const pb = state.area === 'pasture'
      ? { minX: 18.6, maxX: 21.4, minY: 8.8, maxY: 12.6 }
      : getFarmLayout().pondBounds;
    for (const s of pondFishShadows) {
      s.phase += dt * 1.4;
      s.ang += Math.sin(s.phase * 0.6) * dt * 0.8;
      s.x += Math.cos(s.ang) * s.speed * dt;
      s.y += Math.sin(s.ang) * s.speed * dt;
      if (s.x < pb.minX * TILE) { s.x = pb.minX * TILE; s.ang = 0.2; }
      if (s.x > pb.maxX * TILE) { s.x = pb.maxX * TILE; s.ang = Math.PI - 0.2; }
      if (s.y < pb.minY * TILE) { s.y = pb.minY * TILE; s.ang = Math.PI / 2; }
      if (s.y > pb.maxY * TILE) { s.y = pb.maxY * TILE; s.ang = -Math.PI / 2; }
    }

    if (fishing.phase === 'waiting') {
      fishing.timer -= dt;
      if (fishing.timer <= 0) {
        fishing.phase = 'bite';
        fishing.timer = 2.6; // cozy 2.6s hook window
        AudioFX.bite();
        spawnParticles(fishing.bobberX, fishing.bobberY, '#ffffff', 14, 2.0, 3.0);
      }
    } else if (fishing.phase === 'bite') {
      fishing.timer -= dt;
      if (fishing.timer <= 0) {
        cancelFishing();
        AudioFX.error();
        addFloatText(state.player.x, state.player.y - 26, T().floats.biteMissed, '#fde68a');
      }
    } else if (fishing.phase === 'reeling') {
      const fish = FISH[fishing.fishId] || FISH.riverPerch;
      // Green bar physics (cozy & responsive!)
      const accel = fishing.hold ? 2.45 : -2.15;
      fishing.barVel = Math.max(-1.3, Math.min(1.3, fishing.barVel + accel * dt));
      fishing.barPos += fishing.barVel * dt;
      const half = fishing.barHeight / 2;
      if (fishing.barPos < half) { fishing.barPos = half; fishing.barVel = Math.max(0, -fishing.barVel * 0.25); }
      if (fishing.barPos > 1 - half) { fishing.barPos = 1 - half; fishing.barVel = Math.min(0, -fishing.barVel * 0.25); }

      // Fish target swimming AI
      fishing.fishWait -= dt;
      if (fishing.fishWait <= 0) {
        fishing.fishTarget = 0.08 + Math.random() * 0.84;
        fishing.fishWait = (0.65 + Math.random() * 1.1) / Math.max(0.6, fish.speed);
      }
      const diff = fishing.fishTarget - fishing.fishPos;
      const step = Math.sign(diff) * Math.min(Math.abs(diff), fish.speed * 0.58 * dt);
      fishing.fishPos = Math.max(0.06, Math.min(0.94, fishing.fishPos + step));

      // Overlap check
      const overlapping = Math.abs(fishing.fishPos - fishing.barPos) <= half + 0.045;
      fishing.progress += (overlapping ? 0.34 : -0.17) * dt;
      if (fishing.progress >= 1) {
        finishFishCatch();
      } else if (fishing.progress <= 0) {
        cancelFishing();
        AudioFX.error();
        addFloatText(state.player.x, state.player.y - 26, T().floats.fishEscaped, '#fecaca');
      }
    }
    syncMobileReelButton();
  }

  let _lastReelBtnKey = '';
  function syncMobileReelButton() {
    const btn = document.getElementById('mobileReelBtn');
    const lbl = document.getElementById('mobileReelBtnLabel');
    if (!btn || !lbl) return;
    const key = `${fishing.phase}_${state.lang}`;
    if (key === _lastReelBtnKey) return;
    _lastReelBtnKey = key;
    if (fishing.phase === 'bite') {
      lbl.textContent = T().mobileReelBite;
      btn.classList.remove('hidden');
    } else if (fishing.phase === 'reeling') {
      lbl.textContent = T().mobileReelHold;
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
    }
  }

  // Hand-drawn watercolor fish artist (14 unique species silhouettes, scalable for cards & detail views!)
  function drawFishArtwork(c, fish, w, h, silhouette = false) {
    c.clearRect(0, 0, w, h);
    c.save();
    c.translate(w / 2, h / 2);
    const sc = Math.min(w / 72, h / 48);
    c.scale(sc, sc);
    const inkCol = silhouette ? '#7a6958' : '#4a3525';
    const bodyCol = silhouette ? '#9c8b78' : fish.body;
    const finCol = silhouette ? '#877664' : fish.fin;
    const bellyCol = silhouette ? '#9c8b78' : fish.belly;
    const stripeCol = silhouette ? '#877664' : fish.stripe;
    const shape = fish.shape || fish.id;

    if (shape === 'jelly' || fish.id === 'moonJelly') {
      if (!silhouette) {
        const g = c.createRadialGradient(0, -4, 3, 0, 0, 28);
        g.addColorStop(0, 'rgba(184, 224, 255, 0.55)'); g.addColorStop(1, 'rgba(226, 207, 234, 0)');
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, 28, 0, Math.PI * 2); c.fill();
      }
      c.strokeStyle = finCol; c.lineWidth = 2.2;
      for (const ox of [-10, -3, 4, 11]) {
        c.beginPath(); c.moveTo(ox, 2); c.quadraticCurveTo(ox - 4, 11, ox + 2, 19); c.stroke();
      }
      c.fillStyle = bodyCol; c.strokeStyle = inkCol; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, 2, 16, Math.PI, 0); c.quadraticCurveTo(0, 8, -16, 2); c.fill(); c.stroke();
      if (!silhouette) {
        c.fillStyle = 'rgba(255,255,255,0.65)';
        c.beginPath(); c.ellipse(-5, -5, 5, 3, -0.3, 0, Math.PI * 2); c.fill();
      }
    } else if (shape === 'crayfish') {
      c.fillStyle = bodyCol; c.strokeStyle = inkCol; c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(-18, 2, 8, 5, -0.2, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(-4, 0, 14, 8, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(10, -1, 9, 7, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = finCol;
      c.beginPath(); c.ellipse(22, -9, 6.5, 3.8, -0.4, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(22, 8, 6.5, 3.8, 0.4, 0, Math.PI * 2); c.fill(); c.stroke();
      if (!silhouette) { c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(14, -4, 1.8, 0, Math.PI * 2); c.fill(); }
    } else if (shape === 'shrimp') {
      // Cute curved translucent sakura sweet shrimp
      c.strokeStyle = finCol; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(14, -4); c.quadraticCurveTo(24, -14, 28, -10); c.moveTo(14, -1); c.quadraticCurveTo(26, -6, 29, 0); c.stroke();
      c.fillStyle = finCol; c.strokeStyle = inkCol; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(-16, 8); c.lineTo(-26, 4); c.lineTo(-24, 14); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = bodyCol;
      for (const [sx, sy, rx, ry, rot] of [[-12, 6, 6.5, 5, 0.5], [-4, 1, 7.5, 6, 0.2], [5, -3, 8, 6.5, -0.15], [14, -2, 7.5, 6, 0.1]]) {
        c.beginPath(); c.ellipse(sx, sy, rx, ry, rot, 0, Math.PI * 2); c.fill(); c.stroke();
      }
      if (!silhouette) {
        c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(17, -4, 1.8, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(17.6, -4.6, 0.7, 0, Math.PI * 2); c.fill();
      }
    } else if (shape === 'crab') {
      // Plump maple mitten crab with raised claws & little legs
      c.strokeStyle = finCol; c.lineWidth = 2.2;
      for (const ly of [-3, 3, 9]) {
        c.beginPath(); c.moveTo(-11, ly); c.lineTo(-22, ly + 4); c.moveTo(11, ly); c.lineTo(22, ly + 4); c.stroke();
      }
      c.fillStyle = finCol; c.strokeStyle = inkCol; c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(-18, -11, 6.5, 5, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(18, -11, 6.5, 5, 0.5, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = bodyCol;
      c.beginPath(); c.ellipse(0, 2, 16, 11.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      if (!silhouette) {
        c.fillStyle = stripeCol; c.beginPath(); c.ellipse(0, 0, 7, 4.5, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#2d1c10';

      }
    } else if (shape === 'turtle') {
      // Cute emerald lotus pond turtle
      c.fillStyle = bellyCol; c.strokeStyle = inkCol; c.lineWidth = 1.4;
      c.beginPath(); c.ellipse(-12, 8, 5, 3.2, -0.3, 0, Math.PI * 2); c.ellipse(10, 8, 5, 3.2, 0.3, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(18, 0, 7.5, 5.8, -0.1, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = bodyCol;
      c.beginPath(); c.arc(-2, 4, 16, Math.PI, 0); c.quadraticCurveTo(-2, 9, -18, 4); c.closePath(); c.fill(); c.stroke();
      if (!silhouette) {

    } else if (shape === 'goldfish') {

      c.fillStyle = finCol; c.strokeStyle = inkCol; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(-24, -18, -30, -8); c.quadraticCurveTo(-21, 0, -30, 10); c.quadraticCurveTo(-22, 18, -10, 2); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(0, -13, 9, 5.5, -0.2, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = bodyCol;
      c.beginPath(); c.ellipse(4, 1, 16.5, 13.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(13, -3, 2.5, 0, Math.PI * 2); c.fill();

      c.fillStyle = bodyCol;
      c.beginPath(); c.ellipse(2, 1, 21, 11.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      // Long signature catfish barbels!
      c.strokeStyle = inkCol; c.lineWidth = 1.4;
      c.beginPath();

      c.moveTo(20, 4); c.quadraticCurveTo(27, 8, 30, 12);
      c.stroke();
      if (!silhouette) {
        c.fillStyle = bellyCol; c.beginPath(); c.ellipse(3, 5, 15, 5, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(14, -2.5, 2.2, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(14.7, -3.1, 0.8, 0, Math.PI * 2); c.fill();
      }
    } else if (shape === 'eel' || shape === 'starEel') {
      // Graceful undulating creek loach / starry eel

      c.beginPath(); c.ellipse(-2, -11, 10, 5, -0.15, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = bodyCol;
      c.beginPath(); c.ellipse(2, 0, 21, 12.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      if (!silhouette) {
        c.fillStyle = bellyCol;
        c.beginPath(); c.ellipse(3, 4.5, 14, 5.5, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = stripeCol;

          c.globalAlpha = 1;

    c.restore();
  }

       <button id="btnCloseCatch" class="btn-peach px-4 py-1.5 rounded-xl text-xs font-bold cursor-pointer">${m.fishKeepBtn}</button>`);

  }

  // --- ILLUSTRATED ALMANAC / ENCYCLOPEDIA (Fish, Recipes, Crops, Ranch & Pets with Click-in Detail Pages!) ---
  let almanacTab = 'fish';

  function getAlmanacCounts() {
    const fishU = FISH_ORDER.filter(id => (state.fishDex?.[id]?.count || 0) > 0).length;
    const recU = RECIPES.filter(r => (state.recipeDex?.[r.id] || state.dishes?.[r.id] || 0) > 0).length;
    const cropU = CROP_ORDER.filter(id => (state.cropDex?.[id] || 0) > 0).length;
    const aniU = ANIMAL_ORDER.filter(t => state.animals.some(a => a.type === t)).length;
    const petU = state.pet?.type ? 1 : 0;
    const ranchU = aniU + petU;
    const ranchT = ANIMAL_ORDER.length + PET_ORDER.length;
    return {
      fishU, fishT: FISH_ORDER.length,
      recU, recT: RECIPES.length,
      cropU, cropT: CROP_ORDER.length,
      ranchU, ranchT,
      totalU: fishU + recU + cropU + ranchU,

          <div class="font-bold text-xs text-[#5c3c22] pt-1">${m.almanacPets}</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">${pCards}</div>

    openModal('📖', m.almanacTitle, `<div class="space-y-3">${tabsHtml}${contentHtml}</div>`,

    document.querySelectorAll('[data-adetail]').forEach(b => b.addEventListener('click', () => openAlmanacModal(almanacTab, b.dataset.adetail)));
    document.querySelectorAll('[data-jumprec]').forEach(b => b.addEventListener('click', () => openAlmanacModal('recipes', b.dataset.jumprec)));

    if (!detailId && almanacTab === 'fish') {
      for (const fid of FISH_ORDER) {
        const c = document.getElementById(`dexArt_${fid}`);
        if (c) drawFishArtwork(c.getContext('2d'), FISH[fid], 72, 48, !((state.fishDex?.[fid]?.count || 0) > 0));
      }
    }
    const detailFishCv = document.getElementById('almanacDetailFishCv');
    if (detailFishCv && FISH[detailId]) {
      drawFishArtwork(detailFishCv.getContext('2d'), FISH[detailId], 150, 96, !((state.fishDex?.[detailId]?.count || 0) > 0));
    }
    const backBtn = document.getElementById('btnAlmanacBack');
    if (backBtn) backBtn.addEventListener('click', () => openAlmanacModal(almanacTab, null));
    const goKit = document.getElementById('btnAlmanacGoKitchen');
    if (goKit) goKit.addEventListener('click', () => openKitchenModal());
    const goSeeds = document.getElementById('btnAlmanacGoSeeds');
    if (goSeeds) goSeeds.addEventListener('click', () => openShopModal('seeds'));
    const cookNow = document.getElementById('btnAlmanacCookNow');
    if (cookNow && RECIPE_MAP[detailId]) {
      cookNow.addEventListener('click', () => {
        const r = RECIPE_MAP[detailId];
        if (!state.kitchenUnlocked || !canCookRecipe(r)) { AudioFX.error(); return; }
        for (const [ing, qty] of Object.entries(r.ingredients)) consumeIngredient(ing, qty);
        state.dishes[r.id] = (state.dishes[r.id] || 0) + 1;
        state.recipeDex = state.recipeDex || {};
        state.recipeDex[r.id] = (state.recipeDex[r.id] || 0) + 1;
        state.totalCooked += 1;
        AudioFX.cook();
        addFloatText(state.player.x, state.player.y - 26, T().floats.cookedDish(r.emoji, L(r.name)), '#fef08a');
        updateHUD();
        openAlmanacModal('recipes', detailId);
      });
    }
    document.getElementById('btnCloseDex').addEventListener('click', () => { AudioFX.ui(); closeModal(); });

  function openFishDexModal() { openAlmanacModal('fish'); }

  // =========================================================================
  // PASTURE ANIMAL CARE (Feed, Pet, Collect Drops)
  // =========================================================================
  function feedAllHungryAnimals() {
    if (state.animals.length === 0) {
      AudioFX.error(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.noAnimals, '#fde68a'); return;
    }
    const hungry = state.animals.filter(a => !a.fed);
    if (hungry.length === 0) {
      AudioFX.ui(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.allFed, '#bbf7d0'); return;
    }
    if (state.feed <= 0) {
      AudioFX.error(); addFloatText(9.5 * TILE, 4 * TILE, T().floats.noFeed, '#fecaca'); return;
    }
    let fedCount = 0;
    for (const a of hungry) {
      if (state.feed <= 0) break;
      state.feed -= 1;
      a.fed = true;
      fedCount++;
      spawnParticles(a.x, a.y - 10, '#fde047', 6, 1.4, 3);
    }
    AudioFX.harvest();
    addFloatText(9.5 * TILE, 3.8 * TILE, T().floats.fedAnimals(fedCount), '#fef08a');
    updateHUD();
  }

  function petOrFeedAnimal(ani) {
    if (!ani.fed && state.feed > 0) {
      state.feed -= 1;
      ani.fed = true;
      AudioFX.harvest();
      spawnParticles(ani.x, ani.y - 10, '#fde047', 7, 1.5, 3);
      addFloatText(ani.x, ani.y - 22, '🌾 😋', '#fef08a');
      updateHUD();
    } else {
      if (!ani.petted) {
        ani.petted = true;
        ani.hearts = Math.min(5, (ani.hearts || 0) + 1);
      }
      AudioFX.pet();
      spawnParticles(ani.x, ani.y - 12, '#ff8fab', 8, 1.6, 3.2);
      addFloatText(ani.x, ani.y - 24, T().floats.petHeart, '#ffd6e0');
    }
  }

  function collectDrop(dropId) {
    const idx = state.pastureDrops.findIndex(d => d.id === dropId);
    if (idx === -1) return;
    const drop = state.pastureDrops[idx];
    state.pastureDrops.splice(idx, 1);
    const key = `${drop.itemId}_${drop.quality}`;
    state.satchel[key] = (state.satchel[key] || 0) + 1;
    state.totalHarvested += 1;
    AudioFX.harvest();
    const item = ITEMS[drop.itemId];
    spawnParticles(drop.x, drop.y, drop.quality ? '#fde047' : '#ffffff', 10, 1.8, 3.2);
    addFloatText(drop.x, drop.y - 12, T().floats.collectedDrop(item.emoji, L(item.name), drop.quality === 1), drop.quality ? '#fef08a' : '#ffffff');
    updateHUD();
  }

  function collectAllPastureDrops() {
    while (state.pastureDrops.length > 0) collectDrop(state.pastureDrops[0].id);
  }

  // =========================================================================
  // FARMING ACTIONS
  // =========================================================================
  function isCropRipe(cropObj) { return cropObj.daysGrown >= CROPS[cropObj.id].days; }

  function getAreaTiles(tx, ty, level) {
    if (level <= 1) return [[tx, ty]];
    if (level === 2) {
      const d = state.player.dir;
      const dx = d === 'right' ? 1 : d === 'left' ? -1 : 0;
      const dy = d === 'down' ? 1 : d === 'up' ? -1 : 0;
      return [[tx, ty], [tx + dx, ty + dy], [tx + dx * 2, ty + dy * 2]];
    }
    const list = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) list.push([tx + dx, ty + dy]);
    return list;
  }

  function performPrimaryAction(tx, ty) {
    const slot = getSelectedSlot();
    if (slot.id === 'rod') {
      startFishingCast();
      return;
    }
    if (state.area !== 'farm') { performSmartInteract(); return; }
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
    const existing = getTileData(tx, ty);
    if (existing && existing.crop && isCropRipe(existing.crop)) { harvestTile(tx, ty); return; }
    if (slot.id === 'can' && curMap()[ty][tx] === TILE_TYPE.WATER) { refillWater(); return; }

    state.player.swingTimer = 0.22;
    state.player.swingTool = slot.id;

    if (slot.kind === 'tool') {
      if (slot.id === 'hoe') doHoe(tx, ty);
      else if (slot.id === 'can') doWater(tx, ty);
      else if (slot.id === 'scythe') doClearDebris(tx, ty);
    } else if (slot.kind === 'seed') doPlant(tx, ty, slot.id);
    else if (slot.kind === 'placeable') doPlace(tx, ty, slot.id);
  }

  function spendEnergy(amount) {
    if (state.energy < amount) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.tooTired, '#ffd1d1'); return false;
    }
    state.energy = Math.max(0, state.energy - amount);
    updateHUD();
    return true;
  }

  function doHoe(tx, ty) {
    const targets = getAreaTiles(tx, ty, state.hoeLevel);
    let tilledAny = false;
    for (const [x, y] of targets) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS || MAPS.farm[y][x] !== TILE_TYPE.FARMABLE) continue;
      const td = ensureTileData(x, y);
      if (td.debris || td.placeable || td.tilled) continue;
      if (!tilledAny && !spendEnergy(2)) return;
      td.tilled = true;
      if (state.weather === 'rainy') td.watered = true;
      tilledAny = true;
      spawnParticles((x + 0.5) * TILE, (y + 0.5) * TILE, '#a6744f', 7, 1.4, 3.2);
    }
    if (tilledAny) AudioFX.hoe();
    else {
      const td = getTileData(tx, ty);
      if (td && td.debris) { addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.useScythe, '#fff2b2'); AudioFX.error(); }
    }
  }

  function doWater(tx, ty) {
    if (state.water <= 0) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.canEmpty, '#bae6fd'); return;
    }
    const targets = getAreaTiles(tx, ty, state.canLevel);
    let wateredAny = false;
    for (const [x, y] of targets) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
      const td = getTileData(x, y);
      if (!td || !td.tilled) continue;
      if (!wateredAny && !spendEnergy(1)) return;
      td.watered = true; wateredAny = true;
      spawnParticles((x + 0.5) * TILE, (y + 0.5) * TILE, '#67d4f6', 8, 1.3, 2.8);
    }
    if (wateredAny) {
      state.water = Math.max(0, state.water - 1);
      AudioFX.water(); updateHUD(); renderHotbar();
    } else if (isNearWater(state.player.x / TILE, state.player.y / TILE)) refillWater();
  }

  function refillWater() {
    const cap = getCanCapacity();
    if (state.water >= cap) { addFloatText(state.player.x, state.player.y - 24, T().floats.canFull, '#bae6fd'); return; }
    state.water = cap;
    AudioFX.water();
    spawnParticles(state.player.x, state.player.y, '#67d4f6', 14, 2.0, 3.2);
    addFloatText(state.player.x, state.player.y - 24, T().floats.refilled(cap), '#bae6fd');
    updateHUD(); renderHotbar();
  }

  function doClearDebris(tx, ty) {
    const td = getTileData(tx, ty);
    if (!td) return;
    if (td.crop && isCropRipe(td.crop)) { harvestTile(tx, ty); return; }
    if (!td.debris || !spendEnergy(2)) return;
    const type = td.debris; td.debris = null;
    AudioFX.chop();
    const wx = (tx + 0.5) * TILE, wy = (ty + 0.5) * TILE;
    if (type === 'twig') { state.wood += 2; spawnParticles(wx, wy, '#a87548', 9, 1.7, 3); addFloatText(wx, wy - 6, T().floats.woodGain, '#fde6c4'); }
    else if (type === 'stone') { state.stone += 2; spawnParticles(wx, wy, '#b4b8bf', 9, 1.7, 3); addFloatText(wx, wy - 6, T().floats.stoneGain, '#f1f5f9'); }
    else {
      spawnParticles(wx, wy, '#72bf65', 9, 1.6, 3);
      if (Math.random() < 0.45) { state.seeds.turnip += 1; addFloatText(wx, wy - 6, T().floats.wildSeed, '#dcfce7'); renderHotbar(); }
      else addFloatText(wx, wy - 6, T().floats.cleared, '#ecfccb');
    }
    updateHUD();
  }

  function doPlant(tx, ty, cropId) {
    if ((state.seeds[cropId] || 0) <= 0) {
      AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.noSeeds(L(CROPS[cropId].name)), '#fde68a'); return;
    }
    if (MAPS.farm[ty][tx] !== TILE_TYPE.FARMABLE) return;
    const td = getTileData(tx, ty);
    if (!td || !td.tilled) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.tillFirst, '#fde68a'); return; }
    if (td.crop || td.placeable || td.debris) return;
    state.seeds[cropId] -= 1;
    td.crop = { id: cropId, daysGrown: 0 };
    AudioFX.plant();
    spawnParticles((tx + 0.5) * TILE, (ty + 0.5) * TILE, '#b8f078', 6, 1.2, 2.8);
    addFloatText((tx + 0.5) * TILE, ty * TILE - 2, T().floats.planted(CROPS[cropId].emoji), '#f0fdf4');
    renderHotbar();
  }

  function doPlace(tx, ty, itemId) {
    if ((state.placeables[itemId] || 0) <= 0) { AudioFX.error(); addFloatText(state.player.x, state.player.y - 24, T().floats.buyPlaceable, '#bae6fd'); return; }
    if (MAPS.farm[ty][tx] !== TILE_TYPE.FARMABLE) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.placeOnFarm, '#fde68a'); return; }
    const td = ensureTileData(tx, ty);
    if (td.crop || td.debris || td.placeable) { AudioFX.error(); addFloatText((tx + 0.5) * TILE, ty * TILE, T().floats.tileOccupied, '#fecaca'); return; }
    state.placeables[itemId] -= 1;
    td.placeable = itemId; td.tilled = false; td.watered = false;
    AudioFX.place();
    spawnParticles((tx + 0.5) * TILE, (ty + 0.5) * TILE, '#93c5fd', 10, 1.6, 3);
    addFloatText((tx + 0.5) * TILE, ty * TILE - 4, itemId === 'sprinkler' ? T().floats.placedSprinkler : T().floats.placedLantern, '#e0f2fe');
    renderHotbar();
  }

  function harvestTile(tx, ty) {
    const td = getTileData(tx, ty);
    if (!td || !td.crop || !isCropRipe(td.crop)) return;
    const crop = CROPS[td.crop.id];
    const qty = crop.yieldMin + Math.floor(Math.random() * (crop.yieldMax - crop.yieldMin + 1));
    const goldChance = state.luckyCharm ? 0.40 : 0.16;
    let goldCount = 0;
    for (let i = 0; i < qty; i++) {
      const q = Math.random() < goldChance ? 1 : 0;
      if (q === 1) goldCount++;
      const key = `${crop.id}_${q}`;
      state.satchel[key] = (state.satchel[key] || 0) + 1;
    }
    state.totalHarvested += qty;
    state.cropDex = state.cropDex || {};
    state.cropDex[crop.id] = (state.cropDex[crop.id] || 0) + qty;
    if (crop.regrow > 0) td.crop.daysGrown = crop.days - crop.regrow;
    else td.crop = null;
    AudioFX.harvest();
    const wx = (tx + 0.5) * TILE, wy = (ty + 0.5) * TILE;
    spawnParticles(wx, wy, crop.color, 12, 1.9, 3.6);
    if (goldCount > 0) spawnParticles(wx, wy, '#ffe066', 8, 2.2, 3.2);
    addFloatText(wx, wy - 8, `+${qty} ${crop.emoji} ${L(crop.name)}${goldCount > 0 ? ' ⭐' : ''}`, goldCount > 0 ? '#fef08a' : '#ffffff');
    updateHUD();
  }

  // =========================================================================
  // SHIPPING BIN & SLEEP / NIGHT PROCESSING
  // =========================================================================
  function getShippableBasketCount() {
    const c1 = Object.values(state.satchel).reduce((a, b) => a + b, 0);
    const c2 = Object.values(state.dishes).reduce((a, b) => a + b, 0);
    return c1 + c2;
  }
  function getBasketBadgeTotal() {
    return getShippableBasketCount() + Object.values(state.pantry).reduce((a, b) => a + b, 0);
  }
  function getShippingPendingGold() {
    let total = 0;
    for (const [key, count] of Object.entries(state.shippingBin)) {
      if (!count) continue;
      if (key.startsWith('dish:')) total += getSellValue(key.slice(5), 0) * count;
      else { const [id, q] = key.split('_'); total += getSellValue(id, Number(q || 0)) * count; }
    }
    return total;
  }

  function shipAllFromSatchel() {
    const count = getShippableBasketCount();
    if (count === 0) { AudioFX.ui(); addFloatText(7.5 * TILE, 4 * TILE, T().floats.shipEmpty, '#fde68a'); return; }
    let addedGold = 0;
    for (const [key, qty] of Object.entries(state.satchel)) {
      if (!qty) continue;
      const [id, q] = key.split('_');
      addedGold += getSellValue(id, Number(q)) * qty;
      state.shippingBin[key] = (state.shippingBin[key] || 0) + qty;
    }
    state.satchel = {};
    for (const [rid, qty] of Object.entries(state.dishes)) {
      if (!qty) continue;
      addedGold += getSellValue(rid, 0) * qty;
      state.shippingBin[`dish:${rid}`] = (state.shippingBin[`dish:${rid}`] || 0) + qty;
    }
    state.dishes = {};
    AudioFX.coin();
    spawnParticles(7.5 * TILE, 4.3 * TILE, '#fcd34d', 14, 1.9, 3.2);
    addFloatText(7.5 * TILE, 3.8 * TILE, T().floats.shipped(count, addedGold), '#bbf7d0');
    updateHUD();
  }

  function startSleepSequence(passedOut = false) {
    if (isTransitioning) return;
    isTransitioning = true;
    closeModal();
    const overlay = document.getElementById('fadeOverlay');
    document.getElementById('fadeMessage').textContent = passedOut ? T().modals.fadePassedOut : T().modals.fadeSleeping;
    overlay.style.opacity = '1';

    setTimeout(() => {
      const shippedEntries = [];
      let earned = 0;
      for (const [key, qty] of Object.entries(state.shippingBin)) {
        if (!qty) continue;
        let id, q = 0;
        if (key.startsWith('dish:')) id = key.slice(5);
        else { const parts = key.split('_'); id = parts[0]; q = Number(parts[1] || 0); }
        const unit = getSellValue(id, q), sub = unit * qty;
        earned += sub;
        shippedEntries.push({ id, quality: q, qty, unit, sub });
      }
      state.shippingBin = {};
      state.gold += earned;
      state.lifetimeGold += earned;

      const prevSeason = state.seasonIdx;
      state.day += 1;
      if (state.day > 14) { state.day = 1; state.seasonIdx = (state.seasonIdx + 1) % SEASONS.length; }
      const seasonChanged = state.seasonIdx !== prevSeason;

      state.weather = state.nextWeather;
      const r = Math.random();
      state.nextWeather = r < 0.24 ? 'rainy' : r < 0.44 ? 'cloudy' : r < 0.66 ? 'breezy' : 'sunny';

      // Farm growth
      for (const key of Object.keys(state.farm)) {
        const td = state.farm[key];
        if (td.crop && td.watered && td.crop.daysGrown < CROPS[td.crop.id].days) td.crop.daysGrown += 1;
        td.watered = (state.weather === 'rainy' && td.tilled);
        if (td.tilled && !td.crop && Math.random() < 0.1) { td.tilled = false; td.watered = false; }
      }

      let sprinklerWaters = 0;
      for (const key of Object.keys(state.farm)) {
        const td = state.farm[key];
        if (td.placeable === 'sprinkler') {
          const [sx, sy] = key.split(',').map(Number);
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const ntd = getTileData(sx + dx, sy + dy);
            if (ntd && ntd.tilled) { ntd.watered = true; sprinklerWaters++; }
          }
        }
      }

      // Pasture animal overnight production!
      let newDrops = 0;
      let autoFedCount = 0;
      for (const a of state.animals) {
        if (a.fed && state.pastureDrops.length < 24) {
          const meta = ANIMALS[a.type];
          const goldChance = (state.luckyCharm ? 0.35 : 0.14) + Math.min(0.25, (a.hearts || 0) * 0.05);
          const q = Math.random() < goldChance ? 1 : 0;
          state.pastureDrops.push({
            id: `drop_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            itemId: meta.product,
            quality: q,
            x: Math.max(3.6 * TILE, Math.min(15.4 * TILE, a.x + (Math.random() - 0.5) * 26)),
            y: Math.max(7.6 * TILE, Math.min(12.6 * TILE, a.y + (Math.random() - 0.5) * 20))
          });
          newDrops++;
        }
        a.fed = false;
        a.petted = false;
        // On rainy/snowy days, keep animals cozy near the Red Barn shelter
        if (state.weather === 'rainy') {
          a.x = (3.8 + Math.random() * 4.4) * TILE;
          a.y = (7.4 + Math.random() * 1.4) * TILE;
          a.tx = a.x; a.ty = a.y; a.wait = 2 + Math.random() * 2;
        }
        // Auto-feeder refills for today!
        if (state.autoFeeder && state.feed > 0) {
          state.feed -= 1;
          a.fed = true;
          autoFedCount++;
        }
      }

      // Wake up at Home Farm cottage
      state.area = 'farm';
      state.timeMinutes = 6 * 60;
      state.energy = passedOut ? Math.round(state.maxEnergy * 0.8) : state.maxEnergy;
      const wakeLay = getFarmLayout();
      state.player.x = wakeLay.wakeup.x * TILE; state.player.y = wakeLay.wakeup.y * TILE; state.player.dir = 'down';
      resetPondFishShadows('farm');
      walkTarget = null;
      if (state.pet) {
        state.pet.pettedToday = false;
        state.pet.giftFoundToday = false;
        state.pet.hasGift = false;
      }
      petAI.walkAccum = 0;
      syncPetNearPlayer();
      if (state.day === 2 || state.day === 5 || seasonChanged) state.unreadMail = true;

      saveState();
      updateHUD();
      renderHotbar();

      overlay.style.opacity = '0';
      isTransitioning = false;
      AudioFX.morning();
      openDaySummaryModal(shippedEntries, earned, passedOut, seasonChanged, sprinklerWaters, newDrops, autoFedCount);
    }, 600);
  }

  // =========================================================================
  // MODALS: SHOP, RANCH SHOP, KITCHEN, BARN, BASKET, COTTAGE, WARDROBE, LEDGER
  // =========================================================================
  function openModal(icon, title, bodyHTML, footerHTML = '') {
    modalOpen = true; walkTarget = null;
    for (const k in keys) keys[k] = false;
    document.getElementById('modalIcon').textContent = icon;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHTML;
    document.getElementById('modalFooter').innerHTML = footerHTML;
    document.getElementById('modalOverlay').classList.remove('hidden');
  }
  function closeModal() {
    const wasSetup = Boolean(document.getElementById('pvSetupRoot'));
    modalOpen = false;
    document.getElementById('modalOverlay').classList.add('hidden');
    if (wasSetup && !state.setupDone) {
      state.setupDone = true;
      hadLocalSave = true;
      saveState(true, true);
    }
  }
  document.getElementById('modalCloseBtn').addEventListener('click', () => { AudioFX.ui(); closeModal(); });
  document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') { AudioFX.ui(); closeModal(); } });

  // --- PIP'S SEED & UPGRADE SHOP ---

              <p class="text-[11px] text-[#75583e] mt-0.5 leading-snug">${L(c.desc)}</p>
              <div class="text-[11px] font-semibold text-[#5c4028] mt-1 flex items-center gap-2">
                <span>⏱️ ${c.days}d${c.regrow ? ` (↻${c.regrow}d)` : ''}</span>

              </div>
            </div>
            <div class="flex gap-1.5">
              <button data-buyseed="${cid}" data-qty="1" ${state.gold >= c.seedPrice ? '' : 'disabled'} class="btn-peach flex-1 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.buy1} (${c.seedPrice}g)</button>
              <button data-buyseed="${cid}" data-qty="5" ${state.gold >= c.seedPrice * 5 ? '' : 'disabled'} class="btn-sage px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">×5 (${c.seedPrice*5}g)</button>
            </div>
          </div>`;
      }
      body += `</div>`;
    } else {
      const u = m.upg;
      const list = [
        { id: 'kitchen', icon: '🍳', title: state.kitchenUnlocked ? u.kitchenOwned : u.kitchen, desc: u.kitchenD, price: state.kitchenUnlocked ? null : 250, maxed: state.kitchenUnlocked },
        { id: 'hoe', icon: '⛏️', title: state.hoeLevel===1?u.hoe2:state.hoeLevel===2?u.hoe3:u.hoeMax, desc: state.hoeLevel===1?u.hoe2d:state.hoeLevel===2?u.hoe3d:u.hoeMaxd, price: state.hoeLevel===1?200:state.hoeLevel===2?500:null, maxed: state.hoeLevel>=3 },
        { id: 'can', icon: '🚿', title: state.canLevel===1?u.can2:state.canLevel===2?u.can3:u.canMax, desc: state.canLevel===1?u.can2d:state.canLevel===2?u.can3d:u.canMaxd, price: state.canLevel===1?220:state.canLevel===2?550:null, maxed: state.canLevel>=3 },
        { id: 'sprinkler', icon: '💦', title: u.sprinkler(state.placeables.sprinkler || 0), desc: u.sprinklerD, price: 180, maxed: false },
        { id: 'luckyCharm', icon: '🍀', title: state.luckyCharm ? u.charmOwned : u.charm, desc: u.charmD, price: state.luckyCharm ? null : 350, maxed: state.luckyCharm },
        { id: 'lantern', icon: '🏮', title: u.lantern(state.placeables.lantern || 0), desc: u.lanternD, price: 90, maxed: false }
      ];
      body += `<div class="space-y-2">` + list.map(it => `
        <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex items-center justify-between gap-3">
          <div class="flex items-start gap-2.5"><span class="text-xl mt-0.5">${it.icon}</span>

          ${it.maxed ? `<span class="px-2.5 py-1 rounded-xl bg-emerald-600/15 text-emerald-800 font-bold text-xs shrink-0">${m.owned}</span>`
            : `<button data-buyupg="${it.id}" ${state.gold >= it.price ? '' : 'disabled'} class="btn-peach px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer">🪙 ${it.price}g</button>`}
        </div>`).join('') + `</div>`;
    }
    openModal('🌸', m.shopTitle, body,
      `<span class="font-bold text-amber-900">${m.yourGold}: 🪙 ${state.gold}g</span>
       <span class="text-[11px] text-[#75583e] hidden sm:inline">${m.pipQuote}</span>`);

    document.querySelectorAll('[data-shoptab]').forEach(b => b.addEventListener('click', () => openShopModal(b.dataset.shoptab)));
    document.querySelectorAll('[data-buyseed]').forEach(b => b.addEventListener('click', () => {
      const cid = b.dataset.buyseed, qty = Number(b.dataset.qty), cost = CROPS[cid].seedPrice * qty;
      if (state.gold < cost) return;
      state.gold -= cost; state.seeds[cid] = (state.seeds[cid] || 0) + qty;
      AudioFX.coin(); updateHUD(); renderHotbar(); openShopModal('seeds');
    }));
    document.querySelectorAll('[data-buyupg]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.buyupg;
      if (id === 'kitchen') { if (state.gold < 250 || state.kitchenUnlocked) return; state.gold -= 250; state.kitchenUnlocked = true; }
      else if (id === 'hoe') { const c = state.hoeLevel === 1 ? 200 : 500; if (state.gold < c || state.hoeLevel >= 3) return; state.gold -= c; state.hoeLevel += 1; }
      else if (id === 'can') { const c = state.canLevel === 1 ? 220 : 550; if (state.gold < c || state.canLevel >= 3) return; state.gold -= c; state.canLevel += 1; state.water = getCanCapacity(); }
      else if (id === 'sprinkler') { if (state.gold < 180) return; state.gold -= 180; state.placeables.sprinkler += 1; }
      else if (id === 'luckyCharm') { if (state.gold < 350 || state.luckyCharm) return; state.gold -= 350; state.luckyCharm = true; }
      else if (id === 'lantern') { if (state.gold < 90) return; state.gold -= 90; state.placeables.lantern += 1; }
      AudioFX.coin(); updateHUD(); renderHotbar(); openShopModal('upgrades');
    }));

        <button data-rtab="pantry" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${ranchTab==='pantry'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabPantry}</button>

          <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-col justify-between gap-2">

            <button data-buyani="${aid}" ${!full && state.gold >= a.price ? '' : 'disabled'} class="btn-peach w-full py-1.5 rounded-xl text-xs font-bold cursor-pointer">

          </div>`;
      }
      body += `</div>`;
    } else if (ranchTab === 'feed') {
      const u = m.upg;
      body += `
        <div class="rounded-2xl p-3 bg-[#fffdf7] border border-[#d6ba91] space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="font-bold text-sm">🌾 ${m.feedTitle}</div>
            <span class="text-xs font-bold text-amber-900">${m.feedOwned(state.feed)}</span>
          </div>
          <p class="text-[11px] text-[#75583e]">${m.feedDesc}</p>
          <div class="flex flex-wrap gap-2">
            <button data-buyfeed="1" data-cost="10" ${state.gold >= 10 ? '' : 'disabled'} class="btn-peach flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+1 (10g)</button>
            <button data-buyfeed="5" data-cost="45" ${state.gold >= 45 ? '' : 'disabled'} class="btn-sage flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+5 (45g)</button>
            <button data-buyfeed="15" data-cost="120" ${state.gold >= 120 ? '' : 'disabled'} class="btn-sage flex-1 py-1.5 rounded-xl text-xs font-bold cursor-pointer">+15 (120g)</button>
          </div>
        </div>
        <div class="rounded-2xl p-3 bg-[#fffdf7] border border-[#d6ba91] flex items-center justify-between gap-3">
          <div class="flex items-start gap-2.5"><span class="text-xl">⚙️</span>
            <div><div class="font-bold text-sm">${state.autoFeeder ? u.autoFeederOwned : u.autoFeeder}</div><div class="text-[11px] text-[#75583e]">${u.autoFeederD}</div></div>
          </div>
          ${state.autoFeeder ? `<span class="px-2.5 py-1 rounded-xl bg-emerald-600/15 text-emerald-800 font-bold text-xs shrink-0">${m.owned}</span>`
            : `<button id="btnBuyAutoFeeder" ${state.gold >= 300 ? '' : 'disabled'} class="btn-peach px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer">🪙 300g</button>`}
        </div>
      `;
    } else {
      body += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
      for (const iid of PANTRY_SHOP_ORDER) {
        const it = ITEMS[iid], owned = getAvailableIngredientCount(iid);
        body += `
          <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-col justify-between gap-2">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm">${it.emoji} ${L(it.name)}</span>
              <span class="text-[11px] font-semibold text-amber-800">${m.bag}: ${owned}</span>
            </div>
            <div class="flex gap-1.5">
              <button data-buypantry="${iid}" data-qty="1" ${state.gold >= it.buyPrice ? '' : 'disabled'} class="btn-peach flex-1 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.buy1} (${it.buyPrice}g)</button>
              <button data-buypantry="${iid}" data-qty="5" ${state.gold >= it.buyPrice * 5 ? '' : 'disabled'} class="btn-sage px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">×5 (${it.buyPrice*5}g)</button>

      state.gold -= meta.price;
      state.animals.push({

      AudioFX.coin(); updateHUD(); openRanchShopModal('feed');

      state.gold -= cost; state.pantry[iid] = (state.pantry[iid] || 0) + qty;
      AudioFX.coin(); updateHUD(); openRanchShopModal('pantry');

  // --- KITCHEN / COOKING RECIPES MODAL (22 Recipes + Category Filters) ---
  let kitchenCat = 'all';
  function openKitchenModal(cat = kitchenCat) {
    kitchenCat = cat || 'all';
    AudioFX.ui();
    const m = T().modals;
    if (!state.kitchenUnlocked) {
      openModal('🍳', m.kitchenTitle,
        `<div class="text-center py-5 space-y-2.5">
           <div class="text-4xl">🏡🍳</div>
           <div class="font-bold text-base text-[#4a3525]">${m.kitchenLockedTitle}</div>
           <p class="text-xs text-[#75583e] max-w-[400px] mx-auto leading-relaxed">${m.kitchenLockedDesc}</p>
         </div>`,
        `<button id="btnKitchenPreviewDex" class="text-xs font-bold text-[#9c4a34] underline cursor-pointer">📖 ${T().fishDexBtn}</button>
         <button id="btnGoUpgradeKitchen" class="btn-peach px-3.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer">${m.goBuyKitchen}</button>`);
      document.getElementById('btnGoUpgradeKitchen').addEventListener('click', () => openShopModal('upgrades'));
      document.getElementById('btnKitchenPreviewDex').addEventListener('click', () => openAlmanacModal('recipes'));
      return;
    }

    const prevScroll = document.getElementById('pvKitchenRoot') ? (document.getElementById('modalBody')?.scrollTop || 0) : 0;
    const filtered = kitchenCat === 'all' ? RECIPES : RECIPES.filter(r => r.cat === kitchenCat);
    const catTabs = `
      <div class="flex flex-wrap gap-1.5 pb-1.5 border-b border-[#dcc49e]">
        <button data-kcat="all" class="px-2.5 py-1 rounded-xl font-bold text-xs cursor-pointer ${kitchenCat === 'all' ? 'btn-peach' : 'bg-[#e8d5b3] border border-[#b58d60] text-[#4a3525]'}">${m.kitchenCatAll}</button>
        <button data-kcat="savory" class="px-2.5 py-1 rounded-xl font-bold text-xs cursor-pointer ${kitchenCat === 'savory' ? 'btn-peach' : 'bg-[#e8d5b3] border border-[#b58d60] text-[#4a3525]'}">${m.kitchenCatSavory}</button>
        <button data-kcat="seafood" class="px-2.5 py-1 rounded-xl font-bold text-xs cursor-pointer ${kitchenCat === 'seafood' ? 'btn-peach' : 'bg-[#e8d5b3] border border-[#b58d60] text-[#4a3525]'}">${m.kitchenCatSeafood}</button>
        <button data-kcat="sweet" class="px-2.5 py-1 rounded-xl font-bold text-xs cursor-pointer ${kitchenCat === 'sweet' ? 'btn-peach' : 'bg-[#e8d5b3] border border-[#b58d60] text-[#4a3525]'}">${m.kitchenCatSweet}</button>
      </div>`;

    const cards = filtered.map(r => {
      const cookable = canCookRecipe(r);
      const owned = state.dishes[r.id] || 0;
      const ingChips = Object.entries(r.ingredients).map(([ingId, req]) => {
        const meta = getItemMeta(ingId);
        const have = getAvailableIngredientCount(ingId);
        const ok = have >= req;
        return `<span class="px-1.5 py-0.5 rounded-lg text-[11px] font-semibold border ${ok ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-800'}">${meta.emoji} ${L(meta.name)} ${have}/${req}</span>`;
      }).join(' ');

      return `
        <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-col justify-between gap-2">
          <div>
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-sm">${r.emoji} ${L(r.name)}</span>
              <span class="text-[11px] font-semibold text-amber-800">${m.dishCount(owned)}</span>
            </div>
            <p class="text-[11px] text-[#75583e] mt-0.5">${L(r.desc)}</p>
            <div class="flex flex-wrap gap-1 mt-1.5">${ingChips}</div>
            <div class="text-[11px] font-semibold text-[#5c4028] mt-1.5 flex items-center gap-2.5">
              <span>🪙 ${m.sells} ${r.sellPrice}g</span>
              <span>🍀 +${r.energy}</span>
            </div>
          </div>
          <button data-cook="${r.id}" ${cookable ? '' : 'disabled'} class="${cookable ? 'btn-sage' : 'btn-peach'} w-full py-1.5 rounded-xl text-xs font-bold cursor-pointer">
            ${cookable ? m.cookBtn : m.missingIng}
          </button>
        </div>`;
    }).join('');

    openModal('🍳', m.kitchenTitle,
      `<div id="pvKitchenRoot" class="space-y-2.5">${catTabs}<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${cards}</div></div>`,
      `<div class="flex items-center gap-3">
         <button id="btnKitchenToPantry" class="text-xs font-bold text-[#9c4a34] underline cursor-pointer">${m.openPantryLink}</button>
         <button id="btnKitchenToDex" class="text-xs font-bold text-[#5c3c22] underline cursor-pointer">📖 ${T().fishDexBtn}</button>
       </div>
       <span class="text-xs font-bold text-amber-900">${m.yourGold}: 🪙 ${state.gold}g</span>`);
    if (prevScroll > 0) document.getElementById('modalBody').scrollTop = prevScroll;

    document.querySelectorAll('[data-kcat]').forEach(b => b.addEventListener('click', () => openKitchenModal(b.dataset.kcat)));
    document.getElementById('btnKitchenToPantry').addEventListener('click', () => openRanchShopModal('pantry'));
    document.getElementById('btnKitchenToDex').addEventListener('click', () => openAlmanacModal('recipes'));
    document.querySelectorAll('[data-cook]').forEach(b => b.addEventListener('click', () => {
      const r = RECIPE_MAP[b.dataset.cook];
      if (!r || !canCookRecipe(r)) { AudioFX.error(); return; }
      for (const [ing, qty] of Object.entries(r.ingredients)) consumeIngredient(ing, qty);
      state.dishes[r.id] = (state.dishes[r.id] || 0) + 1;
      state.recipeDex = state.recipeDex || {};
      state.recipeDex[r.id] = (state.recipeDex[r.id] || 0) + 1;
      state.totalCooked += 1;
      AudioFX.cook();
      addFloatText(state.player.x, state.player.y - 26, T().floats.cookedDish(r.emoji, L(r.name)), '#fef08a');
      updateHUD();
      openKitchenModal(kitchenCat);
    }));
  }

    const m = T().modals;
    let body = `

        <button data-btab="farm" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${basketTab==='farm'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabBasketFarm}</button>
        <button data-btab="dishes" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${basketTab==='dishes'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabBasketDishes}</button>
        <button data-btab="pantry" class="px-3 py-1.5 rounded-xl font-bold text-xs cursor-pointer ${basketTab==='pantry'?'btn-peach':'bg-[#efe0c4] text-[#5c4028]'}">${m.tabBasketPantry}</button>
      </div>
    `;

    let rows = [];
    if (basketTab === 'farm') {
      for (const [key, qty] of Object.entries(state.satchel)) {
        if (!qty) continue;
        const [id, qStr] = key.split('_'), q = Number(qStr), meta = getItemMeta(id);
        if (!meta) continue;
        rows.push({ kind: 'satchel', key, id, q, qty, meta, shipVal: getSellValue(id, q), energy: meta.energy || 0 });
      }
    } else if (basketTab === 'dishes') {
      for (const [rid, qty] of Object.entries(state.dishes)) {
        if (!qty) continue;
        const meta = RECIPE_MAP[rid];
        rows.push({ kind: 'dish', key: rid, id: rid, q: 0, qty, meta, shipVal: meta.sellPrice, energy: meta.energy });
      }
    } else {
      for (const [iid, qty] of Object.entries(state.pantry)) {
        if (!qty) continue;
        const meta = ITEMS[iid];
        rows.push({ kind: 'pantry', key: iid, id: iid, q: 0, qty, meta, shipVal: meta.sellPrice, energy: meta.energy || 0 });
      }
    }

    if (rows.length === 0) {
      body += `<div class="text-center py-6 space-y-1.5 text-[#75583e]"><div class="text-3xl">💐</div><div class="font-bold text-sm text-[#4a3525]">${m.satchelEmptyTitle}</div><p class="text-xs">${m.satchelEmptyDesc}</p></div>`;
    } else {
      body += `<div class="space-y-2">` + rows.map(r => {
        const quick = Math.round(r.shipVal * 0.9);
        return `
          <div class="rounded-2xl p-2.5 bg-[#fffdf7] border border-[#d6ba91] flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xl">${r.meta.emoji}</span>
              <div>
                <div class="font-bold text-sm">${L(r.meta.name)} ${r.q === 1 ? '⭐' : ''} <span class="text-amber-800">×${r.qty}</span></div>
                <div class="text-[11px] text-[#75583e]">${m.shipVal}: ${r.shipVal}g${r.energy > 0 ? ` · ${m.eatVal}: +${r.energy}🍀` : ''}</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              ${r.energy > 0 ? `<button data-eatkind="${r.kind}" data-eatkey="${r.key}" class="btn-sage px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.eatBtn(r.energy)}</button>` : ''}
              ${r.kind !== 'pantry' ? `<button data-sellkind="${r.kind}" data-sellkey="${r.key}" class="btn-peach px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.sellAllBtn(quick * r.qty)}</button>` : ''}
            </div>
          </div>`;
      }).join('') + `</div>`;
    }

    const pending = getShippingPendingGold(), shippable = getShippableBasketCount();
    openModal('💐', m.satchelTitle, body,
      `<span class="text-xs text-[#63452c]">${m.binTonight}: <strong>+${pending}g</strong></span>
       ${shippable > 0 ? `<button id="btnShipNow" class="btn-peach px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">${m.moveToBin}</button>` : `<span class="text-[11px] opacity-75">${m.binTip}</span>`}`);

    document.querySelectorAll('[data-btab]').forEach(b => b.addEventListener('click', () => openSatchelModal(b.dataset.btab)));
    document.querySelectorAll('[data-eatkey]').forEach(b => b.addEventListener('click', () => {
      const kind = b.dataset.eatkind, key = b.dataset.eatkey;
      let energy = 0;
      if (kind === 'satchel' && state.satchel[key]) { state.satchel[key]--; if (state.satchel[key] <= 0) delete state.satchel[key]; energy = getItemMeta(key.split('_')[0]).energy; }
      else if (kind === 'dish' && state.dishes[key]) { state.dishes[key]--; if (state.dishes[key] <= 0) delete state.dishes[key]; energy = RECIPE_MAP[key].energy; }
      else if (kind === 'pantry' && state.pantry[key]) { state.pantry[key]--; if (state.pantry[key] <= 0) delete state.pantry[key]; energy = ITEMS[key].energy; }
      state.energy = Math.min(state.maxEnergy, state.energy + energy);
      AudioFX.harvest(); updateHUD(); openSatchelModal(basketTab);
    }));
    document.querySelectorAll('[data-sellkey]').forEach(b => b.addEventListener('click', () => {
      const kind = b.dataset.sellkind, key = b.dataset.sellkey;
      let gain = 0;
      if (kind === 'satchel' && state.satchel[key]) { const [id, q] = key.split('_'); gain = Math.round(getSellValue(id, Number(q)) * 0.9) * state.satchel[key]; delete state.satchel[key]; }
      else if (kind === 'dish' && state.dishes[key]) { gain = Math.round(RECIPE_MAP[key].sellPrice * 0.9) * state.dishes[key]; delete state.dishes[key]; }
      state.gold += gain; state.lifetimeGold += gain;
      AudioFX.coin(); updateHUD(); openSatchelModal(basketTab);
    }));
    const sb = document.getElementById('btnShipNow');
    if (sb) sb.addEventListener('click', () => { shipAllFromSatchel(); openSatchelModal(basketTab); });
  }

  // --- LIVE PREVIEW HELPERS (Character, Cottage Style & Farm Layout Mini-Map) ---
  function renderCharacterPreviewCanvas(canvasEl, gender, dressIdx, dir = 'down') {
    if (!canvasEl) return;
    const pctx = canvasEl.getContext('2d');
    const w = canvasEl.width, h = canvasEl.height;
    pctx.clearRect(0, 0, w, h);
    // Soft meadow backdrop
    const grad = pctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#eef7fb');
    grad.addColorStop(0.62, '#f9f2df');
    grad.addColorStop(1, '#b8dd97');
    pctx.fillStyle = grad;
    pctx.fillRect(0, 0, w, h);
    pctx.fillStyle = '#97cc74';
    pctx.beginPath(); pctx.ellipse(w / 2, h - 16, w * 0.44, 15, 0, 0, Math.PI * 2); pctx.fill();
    drawFarmerSprite(pctx, {
      x: w / 2, y: h - 22, dir, gender, outfit: getDress(gender, dressIdx),
      scale: 2.25, walkFrame: 0, swingTimer: 0, swingTool: null
    });
  }

  function renderCottagePreviewCanvas(canvasEl, styleId) {
    if (!canvasEl) return;
    const pctx = canvasEl.getContext('2d');
    const w = canvasEl.width, h = canvasEl.height;
    pctx.clearRect(0, 0, w, h);
    const grad = pctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#e3f2fa');
    grad.addColorStop(0.55, '#f6efdc');
    grad.addColorStop(1, '#a9d684');
    pctx.fillStyle = grad;
    pctx.fillRect(0, 0, w, h);
    pctx.save();
    const s = Math.min(w / 146, h / 114);
    pctx.translate((w - 128 * s) / 2, (h - 96 * s) / 2 + 4);
    pctx.scale(s, s);
    drawCottageSprite(pctx, 0, 0, styleId, { winter: false, evening: false, kitchen: false });
    pctx.restore();
  }

  function renderLayoutMiniPreview(canvasEl, layoutId, houseStyleId = state.houseStyle) {
    if (!canvasEl) return;
    const lay = FARM_LAYOUTS[layoutId] || FARM_LAYOUTS.pondRight;
    const hs = HOUSE_STYLE_MAP[houseStyleId] || HOUSE_STYLES[0];
    const pctx = canvasEl.getContext('2d');
    const w = canvasEl.width, h = canvasEl.height;
    const tw = w / COLS, th = h / ROWS;
    const m = buildFarmMap(layoutId);
    pctx.clearRect(0, 0, w, h);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = m[y][x];
        if (t === TILE_TYPE.WALL) pctx.fillStyle = '#5e995f';
        else if (t === TILE_TYPE.WATER) pctx.fillStyle = '#62b6d9';
        else if (t === TILE_TYPE.DOCK) pctx.fillStyle = '#c89560';
        else if (t === TILE_TYPE.PATH) pctx.fillStyle = '#e7d5b0';
        else if (t === TILE_TYPE.FARMABLE) pctx.fillStyle = (x + y) % 2 === 0 ? '#a8d67e' : '#9acc72';
        else pctx.fillStyle = '#89c46c';
        pctx.fillRect(x * tw, y * th, Math.ceil(tw), Math.ceil(th));
      }
    }
    // Highlight tilled starter patch
    const st = lay.starterTilled;
    pctx.fillStyle = '#b48056';
    pctx.fillRect(st.x1 * tw + 1, st.y1 * th + 1, (st.x2 - st.x1 + 1) * tw - 2, (st.y2 - st.y1 + 1) * th - 2);
    // Cottage icon block
    pctx.fillStyle = hs.wall;
    pctx.fillRect(lay.cottage.x * tw + 1, (lay.cottage.y + 1) * th, 4 * tw - 2, 2 * th - 1);
    pctx.fillStyle = hs.roof;
    pctx.beginPath();
    pctx.moveTo(lay.cottage.x * tw, (lay.cottage.y + 1.3) * th);
    pctx.lineTo((lay.cottage.x + 2) * tw, lay.cottage.y * th);
    pctx.lineTo((lay.cottage.x + 4) * tw, (lay.cottage.y + 1.3) * th);
    pctx.closePath();
    pctx.fill();
    // Shop awning block
    pctx.fillStyle = '#7bb58d';
    pctx.fillRect(lay.shop.x * tw + 1, lay.shop.y * th + 2, 5 * tw - 2, 1.3 * th);
    pctx.fillStyle = '#f5e6cc';
    pctx.fillRect(lay.shop.x * tw + 2, (lay.shop.y + 1.3) * th, 5 * tw - 4, 1.5 * th);
    // Lotus pink dot in pond
    if (lay.lotusTiles[0]) {
      const [lx, ly] = lay.lotusTiles[0];
      pctx.fillStyle = '#ff9ebb';
      pctx.beginPath(); pctx.arc((lx + 0.5) * tw, (ly + 0.5) * th, 3, 0, Math.PI * 2); pctx.fill();
    }
    // East pasture arrow
    pctx.fillStyle = '#fff9e6';
    pctx.font = 'bold 9px sans-serif';
    pctx.textAlign = 'right';
    pctx.fillText('→', w - 2, 6.2 * th);
  }

  // =========================================================================
  // UI / HOTBAR / HUD UPDATES

  function selectSlot(idx) {
    const len = getAllHotbarSlots().all.length;
    state.selectedSlot = Math.max(0, Math.min(len - 1, idx));
    AudioFX.ui();
    renderHotbar();
  }

  function renderHotbar() {
    const { toolSlots, seedSlots, all } = getAllHotbarSlots();
    const renderBtn = (s, globalIdx, keyLabel = '') => {
      const active = globalIdx === state.selectedSlot ? 'active' : '';
      const countBadge = s.count !== null
        ? `<span class="absolute bottom-0.5 right-1 text-[9px] font-extrabold num-tabular ${Number(s.count) === 0 ? 'opacity-30' : 'text-[#5c3d22]'}">${s.count}</span>` : '';
      return `
        <button data-slot="${globalIdx}" class="slot-btn ${active} relative rounded-xl px-1 py-1 flex flex-col items-center justify-center min-h-[44px] cursor-pointer" title="${s.desc}">
          ${keyLabel ? `<span class="absolute top-0.5 left-1 text-[8px] font-bold opacity-45">${keyLabel}</span>` : ''}
          <span class="text-base leading-none">${s.icon}</span>
          <span class="text-[9px] font-bold leading-tight mt-0.5 truncate max-w-full">${s.label}</span>
          ${countBadge}
        </button>`;
    };

    document.getElementById('hotbarTools').innerHTML = toolSlots.map((s, i) => renderBtn(s, i, String(i + 1))).join('');
    document.getElementById('hotbarSeeds').innerHTML = seedSlots.map((s, i) => {
      const gIdx = 6 + i;
      const k = gIdx < 9 ? String(gIdx + 1) : gIdx === 9 ? '0' : '';
      return renderBtn(s, gIdx, k);
    }).join('');

    document.querySelectorAll('[data-slot]').forEach(btn => btn.addEventListener('click', () => selectSlot(Number(btn.dataset.slot))));
    document.getElementById('selectedToolInfo').textContent = (all[state.selectedSlot] || all[0]).desc;
  }

  function formatTime(mins) {
    const total = Math.floor(mins / 10) * 10;
    const h24 = Math.floor(total / 60) % 24, m = total % 60;
    const h12 = h24 % 12 === 0 ? 12 : h24 % 12, mm = m.toString().padStart(2, '0');
    return state.lang === 'zh' ? `${h24 >= 12 ? T().ampm.pm : T().ampm.am} ${h12}:${mm}` : `${h12}:${mm} ${h24 >= 12 ? 'PM' : 'AM'}`;
  }

  function updateHUD() {
    const season = getSeason(), t = T();
    const inPasture = state.area === 'pasture';
    document.getElementById('hudAreaPill').textContent = inPasture ? t.areaPasture : t.areaFarm;
    document.getElementById('uiAreaToggleIcon').textContent = inPasture ? '🏡' : '🐮';
    document.getElementById('uiAreaToggleLabel').textContent = inPasture ? t.toFarm : t.toPasture;

    document.getElementById('hudSeasonIcon').textContent = season.icon;
    document.getElementById('hudDate').textContent = t.dateFmt(getSeasonName(), state.day);
    document.getElementById('hudTime').textContent = formatTime(state.timeMinutes);
    document.getElementById('hudClockIcon').textContent = state.timeMinutes >= 19 * 60 ? '🌙' : state.timeMinutes >= 17 * 60 ? '🌅' : '☀️';

    const wk = getWeatherKey();
    const nextSIdx = state.day >= 14 ? (state.seasonIdx + 1) % SEASONS.length : state.seasonIdx;
    document.getElementById('hudWeatherIcon').textContent = getWeatherIcon(state.weather, state.seasonIdx);
    document.getElementById('hudWeatherText').textContent = t.weather[wk] || t.weather.sunny;
    document.getElementById('hudForecastIcon').textContent = getWeatherIcon(state.nextWeather, nextSIdx);

    document.getElementById('hudGold').textContent = state.gold;
    document.getElementById('hudFeed').textContent = state.feed;
    const pending = getShippingPendingGold(), shipWrap = document.getElementById('hudShippedWrap');
    if (pending > 0) { shipWrap.classList.remove('hidden'); shipWrap.classList.add('flex'); document.getElementById('hudPendingGold').textContent = pending; }
    else { shipWrap.classList.add('hidden'); shipWrap.classList.remove('flex'); }

    const ePct = Math.round((state.energy / state.maxEnergy) * 100), eBar = document.getElementById('hudEnergyBar');
    eBar.style.width = `${ePct}%`;
    eBar.className = `h-full transition-all duration-150 ${ePct > 40 ? 'bg-emerald-500' : ePct > 20 ? 'bg-amber-400' : 'bg-rose-400'}`;
    document.getElementById('hudEnergyText').textContent = state.energy;

    const cap = getCanCapacity();
    document.getElementById('hudWaterBar').style.width = `${Math.round((state.water / cap) * 100)}%`;
    document.getElementById('hudWaterText').textContent = `${state.water}/${cap}`;

    document.getElementById('satchelBadge').textContent = getBasketBadgeTotal();
    document.getElementById('statHarvested').textContent = state.totalHarvested;
    document.getElementById('statAnimals').textContent = state.animals.length;
    document.getElementById('statFish').textContent = state.totalFishCaught || 0;
    document.getElementById('statDishes').textContent = state.totalCooked;
    document.getElementById('statLifetimeGold').textContent = `${state.lifetimeGold}g`;

    if (inPasture) {
      const fed = state.animals.filter(a => a.fed).length;
      document.getElementById('topRightPill').textContent = t.pastureBanner(fed, state.animals.length, state.pastureDrops.length);
    } else {
      document.getElementById('topRightPill').textContent = t.seasonBonus(season.icon, getSeasonName(), L(season.label));
    }
    scheduleAutoSave();
  }

    }
  }
  const autoShowTouchPad = Boolean(
    (typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches) ||

  );

  if (touchPadToggleBtn) {
    touchPadToggleBtn.addEventListener('click', () => {

      setTouchPadVisible(mobileControlsEl.classList.contains('hidden'));

  }

  document.querySelectorAll('#mobileControls [data-dir]').forEach(btn => {
    const dirKey = btn.dataset.dir;
    const press = (e) => {

      keys[dirKey] = true;

    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  const touchBtnAction = document.getElementById('touchBtnAction');
  if (touchBtnAction) {
    touchBtnAction.addEventListener('pointerdown', (e) => {

  const touchBtnInteract = document.getElementById('touchBtnInteract');

  const mobileReelBtn = document.getElementById('mobileReelBtn');

  // PWA Install Prompt & Offline Service Worker Registration
  let deferredInstallPrompt = null;
  const installPwaBtn = document.getElementById('btnInstallPwa');
  window.addEventListener('beforeinstallprompt', (e) => {

  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof location !== 'undefined' && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {

    });
