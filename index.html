<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="口袋山谷" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>口袋山谷 · Pocket Valley</title>
  <script src="./tailwindcss.js"></script>
  <style>
    :root {
      --background: #f5efe2;
      --card: #fffaf0;
      --border: #d9c5a3;
      --foreground: #463222;
      --muted-foreground: #7e634a;
      --primary: #e07a5f;
      --primary-foreground: #ffffff;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior-y: contain; }
    body {
      margin: 0;
      padding: 0;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
    }
    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
      border-radius: 14px;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    .touch-btn {
      touch-action: none;
      -webkit-touch-callout: none;
    }
    .touch-btn:active {
      transform: scale(0.93);
      filter: brightness(0.95);
    }
    .storybook-frame {
      background: linear-gradient(180deg, #b88c62 0%, #966c47 100%);
      border: 3px solid #6e4c30;
      box-shadow: inset 0 2px 0 rgba(255, 245, 228, 0.45), 0 10px 28px rgba(42, 28, 16, 0.25);
    }
    .parchment {
      background: linear-gradient(180deg, #fffaf0 0%, #f7ecd6 100%);
      color: #4a3525;
      border: 1.5px solid #c5a176;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 3px 10px rgba(74, 53, 37, 0.14);
    }
    .slot-btn {
      background: linear-gradient(180deg, #fffdf7 0%, #f3e4c8 100%);
      border: 1.5px solid #b58d60;
      color: #4a3525;
      transition: transform 0.1s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .slot-btn:hover { transform: translateY(-1.5px); border-color: #d67a63; }
    .slot-btn.active {
      background: linear-gradient(180deg, #fffdf4 0%, #ffe6b8 100%);
      border-color: #e07a5f;
      box-shadow: 0 0 0 2px rgba(224, 122, 95, 0.45), 0 3px 8px rgba(74, 53, 37, 0.18);
      transform: translateY(-2px);
    }
    .btn-peach {
      background: linear-gradient(180deg, #e88d72 0%, #d46f53 100%);
      color: #fffdf9;
      border: 1.5px solid #9c4a34;
      text-shadow: 0 1px 1px rgba(80, 30, 15, 0.25);
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .btn-peach:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-peach:active:not(:disabled) { transform: translateY(0); }
    .btn-peach:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sage {
      background: linear-gradient(180deg, #74b078 0%, #58935c 100%);
      color: #fffdf9;
      border: 1.5px solid #3c6b3f;
      text-shadow: 0 1px 1px rgba(25, 55, 28, 0.25);
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .btn-sage:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-sage:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-honey {
      background: linear-gradient(180deg, #f1c36d 0%, #dfa244 100%);
      color: #4a2f15;
      border: 1.5px solid #a67126;
      transition: filter 0.12s ease, transform 0.08s ease;
    }
    .btn-honey:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-honey:disabled { opacity: 0.45; cursor: not-allowed; }
    .modal-backdrop {
      background: rgba(40, 30, 24, 0.56);
      backdrop-filter: blur(4px);
    }
    #importSaveFile.hidden, #modalOverlay.hidden { display: none !important; }
    #modalOverlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }
    .num-tabular { font-variant-numeric: tabular-nums; }
    .fade-overlay { transition: opacity 0.4s ease; pointer-events: none; }
    .cozy-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .cozy-scroll::-webkit-scrollbar-track { background: rgba(181, 141, 96, 0.15); border-radius: 4px; }
    .cozy-scroll::-webkit-scrollbar-thumb { background: rgba(181, 141, 96, 0.5); border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-2 sm:p-4">
  <div class="max-w-[990px] mx-auto flex flex-col gap-2 sm:gap-2.5">

    <!-- Top Compact Header -->
    <div class="flex flex-col sm:flex-row sm:flex-wrap sm:items-center sm:justify-between gap-2 bg-[var(--card)] border border-[var(--border)] rounded-2xl px-3 sm:px-3.5 py-2 shadow-sm">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="text-xl" aria-hidden="true">🌼</span>
          <div>
            <h1 id="uiGameTitle" class="text-sm font-bold leading-tight tracking-tight text-[var(--foreground)]">口袋山谷</h1>
            <p id="uiControlsLine" class="hidden sm:block text-xs text-[var(--muted-foreground)] leading-tight">WASD 移动 · 点击或空格耕种 · E 互动/采摘/喂动物</p>
            <p id="uiMobileControlsLine" class="sm:hidden text-[11px] text-[var(--muted-foreground)] leading-tight">点击地图移动/交互 · 钓鱼长按收线</p>
          </div>
        </div>
        <button id="btnInstallPwa" class="hidden px-2.5 py-1 rounded-xl border border-[#3c6b3f] bg-[#6aa86e] text-white text-[11px] font-bold cursor-pointer whitespace-nowrap">📲 安装到桌面</button>
      </div>

      <div class="flex items-center gap-1.5 text-xs overflow-x-auto sm:overflow-visible sm:flex-wrap no-scrollbar pb-0.5 sm:pb-0">
        <button id="btnAreaToggle" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 font-semibold flex items-center gap-1 cursor-pointer">
          <span id="uiAreaToggleIcon">🐮</span><span id="uiAreaToggleLabel">去牧场</span>
        </button>
        <button id="btnKitchen" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🍳</span><span id="uiKitchenBtn">厨房</span>
        </button>
        <button id="btnShopShortcut" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🧺</span><span id="uiShopBtn">花种铺</span>
        </button>
        <button id="btnRanchShopShortcut" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🥛</span><span id="uiRanchShopBtn">牧场铺</span>
        </button>
        <button id="btnFishDex" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>📖</span><span id="uiFishDexBtn">图鉴</span>
        </button>
        <button id="btnPet" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>🐾</span><span id="uiPetBtn">宠物</span>
        </button>
        <button id="btnSatchel" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium flex items-center gap-1 cursor-pointer">
          <span>💐</span><span id="uiSatchelBtn">花篮</span>
          <span id="satchelBadge" class="px-1.5 py-0.5 rounded-full text-[11px] font-bold bg-[var(--primary)] text-[var(--primary-foreground)] num-tabular">0</span>
        </button>
        <button id="btnSleepQuick" class="shrink-0 px-2 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-medium cursor-pointer" title="Sleep / 休息">🌙</button>
        <button id="btnSettings" class="shrink-0 px-2.5 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:opacity-85 font-semibold flex items-center gap-1 cursor-pointer" title="Settings / 设置">
          <span>⚙️</span><span id="uiSettingsBtn">设置</span>
        </button>
        <input id="importSaveFile" type="file" accept=".json,application/json" class="hidden" />
      </div>
    </div>

    <!-- Main Storybook Game Frame -->
    <div class="storybook-frame rounded-2xl p-2.5 relative overflow-hidden">

      <!-- In-Game HUD Overlay Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-0.5">
        <div class="parchment rounded-xl px-3 py-1.5 flex items-center gap-2 text-xs font-semibold">
          <span id="hudAreaPill" class="px-1.5 py-0.5 rounded-lg bg-[#e9d5b2] text-[#5c3c22] text-[11px] font-bold">🏡 农庄</span>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudSeasonIcon">🌸</span>
            <span id="hudDate" class="num-tabular">春季 第1天</span>
          </div>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudClockIcon">☀️</span>
            <span id="hudTime" class="num-tabular font-bold">上午 6:00</span>
          </div>
          <span class="opacity-30">|</span>
          <div class="flex items-center gap-1">
            <span id="hudWeatherIcon">☀️</span>
            <span id="hudWeatherText">晴天</span>
          </div>
          <span class="opacity-30 hidden md:inline">|</span>
          <div class="hidden md:flex items-center gap-1 text-[11px] opacity-80">
            <span id="uiForecastLabel">明日:</span>
            <span id="hudForecastIcon">☀️</span>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-1.5">
          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-2 text-xs font-bold num-tabular">
            <span class="flex items-center gap-1 text-amber-800"><span>🪙</span><span id="hudGold">150</span>g</span>
            <span id="hudShippedWrap" class="hidden items-center gap-0.5 text-emerald-700 text-[11px]"><span>📦</span>+<span id="hudPendingGold">0</span>g</span>
            <span class="opacity-25">|</span>
            <span class="flex items-center gap-0.5 text-[#7a542e]" title="Animal Feed / 牧草饲料"><span>🌾</span><span id="hudFeed">5</span></span>
          </div>

          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-1.5 text-xs font-semibold">
            <span>🍀</span>
            <div class="w-14 sm:w-16 h-2.5 bg-[#e5d5b7] rounded-full overflow-hidden border border-[#bfa078]">
              <div id="hudEnergyBar" class="h-full bg-emerald-500 transition-all duration-150" style="width:100%"></div>
            </div>
            <span id="hudEnergyText" class="num-tabular text-[11px] w-6 text-right">100</span>
          </div>

          <div class="parchment rounded-xl px-2.5 py-1.5 flex items-center gap-1.5 text-xs font-semibold">
            <span>💧</span>
            <div class="w-12 sm:w-14 h-2.5 bg-[#e5d5b7] rounded-full overflow-hidden border border-[#bfa078]">
              <div id="hudWaterBar" class="h-full bg-sky-400 transition-all duration-150" style="width:100%"></div>
            </div>
            <span id="hudWaterText" class="num-tabular text-[11px]">20/20</span>
          </div>
        </div>
      </div>

      <!-- Canvas Container -->
      <div class="relative rounded-2xl overflow-hidden bg-[#7ab464] border-2 border-[#6e4c30]">
        <canvas id="gameCanvas" width="768" height="512"></canvas>

        <!-- Contextual Action Pill -->
        <div id="contextHint" class="hidden absolute bottom-2.5 left-2.5 parchment rounded-xl px-3 py-1.5 text-xs font-semibold shadow-md pointer-events-none flex items-center gap-1.5">
          <span id="contextHintIcon">✨</span>
          <span id="contextHintText"></span>
        </div>

        <!-- Mobile / Touch Dedicated Fishing Reel Button (appears only during bite/reeling) -->
        <button id="mobileReelBtn" class="hidden touch-btn absolute bottom-3 left-1/2 -translate-x-1/2 btn-peach px-5 py-2.5 rounded-2xl font-extrabold text-sm shadow-xl z-10 cursor-pointer flex items-center gap-2">
          <span>🎣</span><span id="mobileReelBtnLabel">按住拉杆</span>
        </button>

        <!-- Top-Right Banner (Seasonal Bonus on Farm / Pasture Status on Pasture) -->
        <div id="topRightPill" class="absolute top-2 right-2 parchment rounded-xl px-2.5 py-0.5 sm:px-3 sm:py-1 text-[10px] sm:text-[11px] font-semibold opacity-95 pointer-events-none max-w-[75%] truncate"></div>

        <!-- Sleep / Area Fade Overlay -->
        <div id="fadeOverlay" class="fade-overlay absolute inset-0 bg-[#1e1d30] opacity-0 flex items-center justify-center">
          <div id="fadeMessage" class="text-amber-100 text-base sm:text-lg font-bold tracking-wide px-4 text-center"></div>
        </div>

        <!-- Modal Overlay Layer (full-viewport centered popup dialog) -->
        <div id="modalOverlay" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-3 z-50">
          <div id="modalCard" class="parchment rounded-2xl w-full max-w-[620px] max-h-[90dvh] flex flex-col overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-2.5 border-b border-[#d6ba91] bg-[#f4e4c5]">
              <div class="flex items-center gap-2">
                <span id="modalIcon" class="text-lg">🌸</span>
                <h2 id="modalTitle" class="font-bold text-sm sm:text-base text-[#4a3525]"></h2>
              </div>
              <button id="modalCloseBtn" class="w-8 h-8 sm:w-7 sm:h-7 rounded-xl bg-[#e6d0a8] hover:bg-[#dac092] border border-[#b58d60] text-[#4a3525] font-bold text-xs flex items-center justify-center cursor-pointer">✕</button>
            </div>
            <div id="modalBody" class="p-3.5 overflow-y-auto cozy-scroll text-xs sm:text-sm space-y-3"></div>
            <div id="modalFooter" class="px-4 py-2.5 border-t border-[#d6ba91] bg-[#f4e4c5] flex items-center justify-between gap-2 text-xs"></div>
          </div>
        </div>
      </div>

      <!-- Mobile Touch Gamepad (auto-shown on touch/narrow screens, toggleable via 🕹️) -->
      <div id="mobileControls" class="hidden mt-2 flex items-center justify-between gap-3 px-2.5 py-2 rounded-xl bg-[#f7ecd6]/92 border border-[#c5a176]">
        <div class="grid grid-cols-3 gap-1 w-[124px]">
          <div></div>
          <button data-dir="w" class="touch-btn slot-btn h-9 rounded-xl font-bold text-sm flex items-center justify-center cursor-pointer" aria-label="Up">▲</button>
          <div></div>
          <button data-dir="a" class="touch-btn slot-btn h-9 rounded-xl font-bold text-sm flex items-center justify-center cursor-pointer" aria-label="Left">◀</button>
          <button data-dir="s" class="touch-btn slot-btn h-9 rounded-xl font-bold text-sm flex items-center justify-center cursor-pointer" aria-label="Down">▼</button>
          <button data-dir="d" class="touch-btn slot-btn h-9 rounded-xl font-bold text-sm flex items-center justify-center cursor-pointer" aria-label="Right">▶</button>
        </div>
        <div class="flex flex-col gap-1.5 flex-1 max-w-[196px]">
          <button id="touchBtnAction" class="touch-btn btn-peach py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer">
            <span>✨</span><span id="uiTouchAction">使用工具 / 拉杆</span>
          </button>
          <button id="touchBtnInteract" class="touch-btn btn-sage py-2 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer">
            <span>🤝</span><span id="uiTouchInteract">互动 / 采摘 / 摸宠</span>
          </button>
        </div>
      </div>

      <!-- Two-Strip Compact Hotbar: Row 1 Tools & Gear (6) + Row 2 All 10 Seeds -->
      <div class="mt-2 flex flex-col gap-1.5">
        <div class="flex flex-col sm:flex-row gap-1.5">
          <div id="hotbarTools" class="grid grid-cols-6 gap-1 sm:w-[41%]"></div>
          <div id="hotbarSeeds" class="grid grid-cols-5 sm:grid-cols-10 gap-1 sm:w-[59%]"></div>
        </div>
        <div class="flex items-center justify-between px-1 text-[11px] text-amber-50/95">
          <span id="selectedToolInfo"></span>
          <span id="uiHotbarHint" class="hidden sm:inline opacity-85"></span>
        </div>
      </div>
    </div>

    <!-- Subtle Footer Status / Stats -->
    <div class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs text-[var(--muted-foreground)]">
      <div class="flex flex-wrap items-center gap-3">
        <span><span id="uiStatHarvestLabel">🌾 收获</span>: <strong id="statHarvested" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatAnimalsLabel">🐮 牧场动物</span>: <strong id="statAnimals" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatFishLabel">🐟 垂钓</span>: <strong id="statFish" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatDishesLabel">🍳 料理</span>: <strong id="statDishes" class="text-[var(--foreground)] num-tabular">0</strong></span>
        <span><span id="uiStatGoldLabel">🪙 累计金币</span>: <strong id="statLifetimeGold" class="text-[var(--foreground)] num-tabular">0g</strong></span>
      </div>
      <div id="saveStatus" class="text-xs opacity-80"></div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // =========================================================================
  // CONSTANTS, DRESS THEMES, CROPS (10), ANIMALS (4), PANTRY & RECIPES (10)
  // =========================================================================

  const CANVAS_W = COLS * TILE; // 768
  const CANVAS_H = ROWS * TILE; // 512
  const SAVE_KEY = 'pocket_valley_storybook_v3';
  const OLD_SAVE_KEY = 'pocket_valley_storybook_v2';

  const DRESS_THEMES = [
    {

  ];

  const BOY_OUTFITS = [
    {
      id: 'overalls', style: 'overalls', name: { zh: '森林牛仔背带装', en: 'Forest Denim Overalls' },

    {
      id: 'chambray', style: 'shirt', name: { zh: '晴空条纹田园衫', en: 'Sky Chambray Shirt' },

      ribbon: '#e8b44c', hair: '#4a3123', hairLight: '#6b4935', preview: '🩵', skirt: '#83b8d9',
      flowerA: '#fffef0', flowerB: '#e8b44c'
    },
    {
      id: 'vest', style: 'vest', name: { zh: '麦田森系马甲装', en: 'Harvest Sage Vest' },
      shirt: '#fffaf0', overalls: '#78a572', overallsShade: '#5d8758', pants: '#8d6b4a',
      ribbon: '#d96b52', hair: '#6e492d', hairLight: '#916441', preview: '🌾', skirt: '#78a572',
      flowerA: '#fffaf0', flowerB: '#8d6b4a'
    },
    {
      id: 'cardigan', style: 'vest', name: { zh: '莓果暖织开衫装', en: 'Berry Knit Cardigan' },

  // =========================================================================
  // COZY AUDIO ENGINE
  // =========================================================================
  const AudioFX = {
    ctx: null, muted: false,
    ensure() {
      if (this.muted) return null;
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return this.ctx;
    },
    tone(freq, dur = 0.08, type = 'sine', vol = 0.1, slideTo = null, delay = 0) {
      const ctx = this.ensure(); if (!ctx) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    },
    noise(dur = 0.08, vol = 0.07, filterFreq = 900) {
      const ctx = this.ensure(); if (!ctx) return;
      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = filterFreq;
      const gain = ctx.createGain(); const now = ctx.currentTime;
      gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start(now);
    },
    hoe() { this.noise(0.08, 0.09, 580); this.tone(160, 0.07, 'triangle', 0.1, 95); },
    water() { this.noise(0.14, 0.08, 1900); this.tone(460, 0.1, 'sine', 0.06, 720); },
    splash() { this.noise(0.16, 0.09, 1500); this.tone(520, 0.09, 'sine', 0.08, 290); },
    bite() { this.tone(740, 0.08, 'sine', 0.12, 1120); this.tone(980, 0.12, 'triangle', 0.11, 1320, 0.07); this.noise(0.1, 0.07, 2200); },
    fishCatch() { [523, 659, 784, 988, 1318].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.09, null, i * 0.07)); },
    plant() { this.tone(392, 0.06, 'sine', 0.09, 523); },
    harvest() { this.tone(587, 0.08, 'triangle', 0.11, 740); this.tone(880, 0.13, 'sine', 0.11, 987, 0.06); },
    cook() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.09, null, i * 0.07)); },
    pet() { this.tone(680, 0.07, 'sine', 0.09, 920); this.tone(880, 0.09, 'sine', 0.08, 1080, 0.06); },
    coin() { this.tone(1046, 0.07, 'sine', 0.09); this.tone(1396, 0.14, 'sine', 0.1, null, 0.06); },
    chop() { this.noise(0.06, 0.1, 780); this.tone(210, 0.06, 'triangle', 0.08, 120); },
    error() { this.tone(200, 0.09, 'triangle', 0.06, 150); },
    ui() { this.tone(660, 0.04, 'sine', 0.05, 780); },
    morning() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.24, 'sine', 0.08, null, i * 0.09)); },
    place() { this.tone(300, 0.08, 'triangle', 0.09, 390); }
  };

  // =========================================================================
  // MAPS: HOME FARM & SUNNY PASTURE
  // =========================================================================
  function hash2(x, y) {
    let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }

  function getFarmLayout(layoutId) {
    const id = layoutId || (typeof state !== 'undefined' && state ? state.mapLayout : 'pondRight');
    return FARM_LAYOUTS[id] || FARM_LAYOUTS.pondRight;
  }

  function getHouseStyle(styleId) {
    const id = styleId || (typeof state !== 'undefined' && state ? state.houseStyle : 'terracotta');
    return HOUSE_STYLE_MAP[id] || HOUSE_STYLES[0];
  }

  function buildFarmMap(layoutId = 'pondRight') {
    const lay = FARM_LAYOUTS[layoutId] || FARM_LAYOUTS.pondRight;
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE_TYPE.GRASS));
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) map[y][x] = TILE_TYPE.WALL;
      }
    }
    // Open East Gate to Sunny Pasture at x=23, y=5..7!
    map[5][23] = TILE_TYPE.PATH;
    map[6][23] = TILE_TYPE.PATH;
    map[7][23] = TILE_TYPE.GRASS;

    for (const [x, y] of lay.extraTrees) map[y][x] = TILE_TYPE.WALL;

    // Cottage (4x3), Mailbox, Shipping Bin, Pip's Shop (5x3), Signpost
    for (let y = lay.cottage.y; y <= lay.cottage.y + 2; y++) {
      for (let x = lay.cottage.x; x <= lay.cottage.x + 3; x++) map[y][x] = TILE_TYPE.WALL;
    }
    map[lay.mailbox.y][lay.mailbox.x] = TILE_TYPE.WALL;
    map[lay.shipping.y][lay.shipping.x] = TILE_TYPE.WALL;
    map[lay.signpost.y][lay.signpost.x] = TILE_TYPE.WALL;
    for (let y = lay.shop.y; y <= lay.shop.y + 2; y++) {
      for (let x = lay.shop.x; x <= lay.shop.x + 4; x++) map[y][x] = TILE_TYPE.WALL;
    }

    // Paths (extending to East Gate!)
    for (let x = 3; x <= 23; x++) map[5][x] = TILE_TYPE.PATH;
    for (const [px, py] of lay.paths) map[py][px] = TILE_TYPE.PATH;

    // Farmable meadow(s)
    for (const rect of lay.farmRects) {
      for (let y = rect.y1; y <= rect.y2; y++) {
        for (let x = rect.x1; x <= rect.x2; x++) map[y][x] = TILE_TYPE.FARMABLE;
      }
    }

    // Lotus Pond + Dock
    const pr = lay.pondRect;
    for (let y = pr.y1; y <= pr.y2; y++) {
      for (let x = pr.x1; x <= pr.x2; x++) {
        if (pr.skip.some(([sx, sy]) => sx === x && sy === y)) continue;
        map[y][x] = TILE_TYPE.WATER;
      }
    }
    for (const [dx, dy] of lay.docks) map[dy][dx] = TILE_TYPE.DOCK;
    return map;
  }

  function buildPastureMap() {
    const map = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE_TYPE.GRASS));
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) map[y][x] = TILE_TYPE.WALL;
      }
    }
    // Open West Gate back to Home Farm at x=0, y=5..7!
    map[5][0] = TILE_TYPE.PATH;
    map[6][0] = TILE_TYPE.PATH;
    map[7][0] = TILE_TYPE.GRASS;

    const trees = [
      [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],[20,1],[21,1],[22,1],
      [1,2],[1,3],[22,2],[22,3],[22,4],[22,14],[1,14],[2,14],[21,14]
    ];
    for (const [x, y] of trees) map[y][x] = TILE_TYPE.WALL;

    // Signpost back to farm (1,4)
    map[4][1] = TILE_TYPE.WALL;
    // Storybook Red Barn (3..7, 2..4)
    for (let y = 2; y <= 4; y++) for (let x = 3; x <= 7; x++) map[y][x] = TILE_TYPE.WALL;
    // Feed Trough (9..10, 4)
    map[4][9] = TILE_TYPE.WALL;
    map[4][10] = TILE_TYPE.WALL;
    // Millie's Ranch & Pantry Shop (15..20, 2..4)
    for (let y = 2; y <= 4; y++) for (let x = 15; x <= 20; x++) map[y][x] = TILE_TYPE.WALL;

    // Stone path from West Gate across Barn, Trough, Shop
    for (let x = 0; x <= 20; x++) map[5][x] = TILE_TYPE.PATH;
    map[6][1] = TILE_TYPE.PATH;
    map[6][9] = TILE_TYPE.PATH;
    map[6][10] = TILE_TYPE.PATH;
    map[6][17] = TILE_TYPE.PATH;

    // Clover Animal Pasture (3..16, 7..13)
    for (let y = 7; y <= 13; y++) for (let x = 3; x <= 16; x++) map[y][x] = TILE_TYPE.PASTURE;

    // Duck Stream Pond (18..21, 8..13)
    for (let y = 8; y <= 13; y++) {
      for (let x = 18; x <= 21; x++) {
        if ((x === 18 && y === 8) || (x === 21 && y === 13) || (x === 18 && y === 13)) continue;
        map[y][x] = TILE_TYPE.WATER;
      }
    }
    return map;
  }

  const MAPS = { farm: buildFarmMap('pondRight'), pasture: buildPastureMap() };
  function curMap() { return MAPS[state.area] || MAPS.farm; }

  function createInitialState(keepLang = 'zh', keepDress = 0, keepGender = 'female', keepHouseStyle = 'terracotta', keepMapLayout = 'pondRight', setupDone = false) {
    const lay = FARM_LAYOUTS[keepMapLayout] || FARM_LAYOUTS.pondRight;
    const st = lay.starterTilled;
    const farm = {};
    for (let y = st.y1; y <= st.y2; y++) {
      for (let x = st.x1; x <= st.x2; x++) {
        farm[`${x},${y}`] = { tilled: true, watered: false, crop: null, debris: null, placeable: null };
      }
    }
    farm[`${st.turnip[0]},${st.turnip[1]}`].crop = { id: 'turnip', daysGrown: 1 };
    farm[`${st.wheat[0]},${st.wheat[1]}`].crop = { id: 'wheat', daysGrown: 1 };

    for (const [x, y, type] of lay.debris) {
      farm[`${x},${y}`] = { tilled: false, watered: false, crop: null, debris: type, placeable: null };
    }

    const seeds = {};
    for (const cid of CROP_ORDER) seeds[cid] = 0;
    seeds.turnip = 5;
    seeds.wheat = 3;

    // Start with 1 friendly starter Chicken in the pasture so the ranch already feels alive!
    const starterAnimals = [
      { id: 'a1', type: 'chicken', x: 7.5 * TILE, y: 9.5 * TILE, tx: 8.5 * TILE, ty: 10 * TILE, wait: 1.5, dir: 1, fed: false, petted: false, hearts: 1 }
    ];

    return {
      lang: keepLang,
      gender: keepGender === 'male' ? 'male' : 'female',
      dressIdx: keepDress,
      houseStyle: HOUSE_STYLE_MAP[keepHouseStyle] ? keepHouseStyle : 'terracotta',

  function hydrateState(parsed) {
    if (!parsed || typeof parsed.day !== 'number' || !parsed.farm) return null;
    const g = parsed.gender === 'male' ? 'male' : 'female';
    const hs = HOUSE_STYLE_MAP[parsed.houseStyle] ? parsed.houseStyle : 'terracotta';
    const ml = FARM_LAYOUTS[parsed.mapLayout] ? parsed.mapLayout : 'pondRight';
    const base = createInitialState(parsed.lang || 'zh', parsed.dressIdx || 0, g, hs, ml, true);
    const cropDex = { ...(parsed.cropDex || {}) };
    const recipeDex = { ...(parsed.recipeDex || {}) };
    for (const [k, cnt] of Object.entries(parsed.satchel || {})) {
      const cid = k.split('_')[0];
      if (CROPS[cid] && cnt > 0 && !cropDex[cid]) cropDex[cid] = cnt;
    }
    for (const [rid, cnt] of Object.entries(parsed.dishes || {})) {
      if (RECIPE_MAP[rid] && cnt > 0 && !recipeDex[rid]) recipeDex[rid] = cnt;
    }
    return {
      ...base,
      ...parsed,
      gender: g,
      houseStyle: hs,
      mapLayout: ml,
      setupDone: true,
      seeds: { ...base.seeds, ...(parsed.seeds || {}) },
      placeables: { ...base.placeables, ...(parsed.placeables || {}) },
      pantry: { ...(parsed.pantry || {}) },
      dishes: { ...(parsed.dishes || {}) },
      fishDex: { ...(parsed.fishDex || {}) },
      cropDex,
      recipeDex,
      totalFishCaught: typeof parsed.totalFishCaught === 'number' ? parsed.totalFishCaught : 0,
      pet: { ...base.pet, ...(parsed.pet || {}) },
      animals: Array.isArray(parsed.animals) ? parsed.animals : base.animals,
      pastureDrops: Array.isArray(parsed.pastureDrops) ? parsed.pastureDrops : [],
      player: { ...base.player, ...(parsed.player || {}) },

    };

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_SAVE_KEY);
      if (raw) {
        const hydrated = hydrateState(JSON.parse(raw));
        if (hydrated) {
          hadLocalSave = true;
          return hydrated;
        }
      }
    } catch (e) {}
    return createInitialState('zh', 0, 'female', 'terracotta', 'pondRight', false);
  }

  const IDBBackup = {
    open() {
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') return reject(new Error('no_idb'));
        try {
          const req = indexedDB.open('pocket_valley_db', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('saves')) db.createObjectStore('saves');
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) { reject(e); }
      });
    },
    async save(jsonStr) {
      try {
        const db = await this.open();
        const tx = db.transaction('saves', 'readwrite');
        tx.objectStore('saves').put(jsonStr, 'main');
      } catch (e) {}
    },
    async load() {
      try {
        const db = await this.open();
        return await new Promise((resolve) => {
          const tx = db.transaction('saves', 'readonly');
          const req = tx.objectStore('saves').get('main');
          req.onsuccess = () => {
            try { resolve(req.result ? JSON.parse(req.result) : null); } catch (e) { resolve(null); }
          };
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    },
    async clear() {
      try {
        const db = await this.open();
        const tx = db.transaction('saves', 'readwrite');
        tx.objectStore('saves').delete('main');
      } catch (e) {}
    }
  };

  function formatSaveClock(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toTimeString().slice(0, 8);
    } catch (e) { return ''; }
  }

  function formatCloudTimestamp(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString(state.lang === 'zh' ? 'zh-CN' : 'en-US', { hour12: false });
    } catch (e) { return iso; }
  }

  function updateSaveStatusLabel() {
    const el = document.getElementById('saveStatus');
    if (!el) return;
    const hm = formatSaveClock(state.lastSavedAt);
    el.textContent = hm ? T().savedAt(getSeasonName(), state.day, hm) : T().autoSaveIdle;
  }

  function saveState(quiet = false, skipCloud = false) {
    try {
      state.lastSavedAt = new Date().toISOString();
      const serialized = JSON.stringify(state);
      localStorage.setItem(SAVE_KEY, serialized);
      IDBBackup.save(serialized);
      updateSaveStatusLabel();
      if (!skipCloud && GoogleCloudSave.isSignedIn() && GoogleCloudSave.autoSync) {
        scheduleCloudSync();
      }
      if (!quiet && document.getElementById('pvSaveCloudRoot')) {
        openSaveCloudModal();
      }
    } catch (e) {}
  }

  function scheduleAutoSave() {
    if (!gameBooted) return;
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
      autoSaveTimer = null;
      saveState(true);
    }, 900);
  }

  function scheduleCloudSync() {
    if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(() => {
      cloudSyncTimer = null;
      if (GoogleCloudSave.isSignedIn() && GoogleCloudSave.autoSync) {
        GoogleCloudSave.uploadSave(true);
      }
    }, 4000);
  }

  function applyRestoredState(parsed) {
    const next = hydrateState(parsed);
    if (!next) return false;
    state = next;
    MAPS.farm = buildFarmMap(state.mapLayout);
    if (typeof resetPondFishShadows === 'function') resetPondFishShadows();
    if (typeof cancelFishing === 'function') cancelFishing();
    if (document.getElementById('pvSetupRoot') && typeof closeModal === 'function') closeModal();
    syncPetNearPlayer();
    saveState(true, true);
    applyStaticLabels();
    updateHUD();
    renderHotbar();
    return true;
  }

  // =========================================================================
  // GOOGLE ACCOUNT CLOUD SAVE (Google Identity Services + Drive appDataFolder)
  // =========================================================================
  const GoogleCloudSave = {
    accessToken: null,
    user: null,
    fileId: null,
    cloudUpdatedAt: null,
    busy: false,
    lastStatus: null,
    lastError: null,
    cspBlocked: false,
    autoSync: (() => { try { return localStorage.getItem(CLOUD_AUTO_KEY) !== '0'; } catch (e) { return true; } })(),

    getClientId() {
      try { return (localStorage.getItem(GOOGLE_CLIENT_ID_KEY) || '').trim(); } catch (e) { return ''; }
    },
    setClientId(val) {
      try { localStorage.setItem(GOOGLE_CLIENT_ID_KEY, (val || '').trim()); } catch (e) {}
    },
    setAutoSync(enabled) {
      this.autoSync = Boolean(enabled);
      try { localStorage.setItem(CLOUD_AUTO_KEY, this.autoSync ? '1' : '0'); } catch (e) {}
    },
    isSignedIn() {
      return Boolean(this.accessToken && this.user);
    },
    refreshModalIfOpen() {
      if (document.getElementById('pvSaveCloudRoot')) openSaveCloudModal();
    },

    loadGsiScript() {
      return new Promise((resolve, reject) => {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) {
          this.cspBlocked = false;
          return resolve();
        }
        const existing = document.getElementById('pv-gsi-script');
        if (existing) existing.remove();
        let settled = false;
        const done = (err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (err) { this.cspBlocked = true; reject(err); }
          else { this.cspBlocked = false; resolve(); }
        };
        const timer = setTimeout(() => done(new Error('CSP_OR_OFFLINE')), 5500);
        const script = document.createElement('script');
        script.id = 'pv-gsi-script';
        script.src = GSI_SCRIPT_URL;
        script.async = true;
        script.defer = true;
        script.onload = () => {
          if (window.google && window.google.accounts && window.google.accounts.oauth2) done(null);
          else done(new Error('CSP_OR_OFFLINE'));
        };
        script.onerror = () => done(new Error('CSP_OR_OFFLINE'));
        document.head.appendChild(script);
      });
    },

    async signIn() {
      const clientId = this.getClientId();
      this.lastError = null;
      this.lastStatus = null;
      if (!clientId) {
        this.lastError = state.lang === 'zh'
          ? '请先在上方填写并保存你的 Google OAuth Client ID。'
          : 'Please enter and save your Google OAuth Client ID above first.';
        this.refreshModalIfOpen();
        return;
      }
      this.busy = true;
      this.refreshModalIfOpen();
      try {
        await this.loadGsiScript();
        const tokenResp = await new Promise((resolve, reject) => {
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
            callback: (resp) => {
              if (resp && resp.access_token) resolve(resp);
              else reject(new Error(resp?.error_description || resp?.error || 'Sign-in cancelled'));
            },
            error_callback: (err) => reject(new Error(err?.message || err?.type || 'Popup blocked or closed'))
          });
          client.requestAccessToken({ prompt: 'select_account' });
        });
        this.accessToken = tokenResp.access_token;
        const uResp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: `Bearer ${this.accessToken}` }
        });
        if (uResp.ok) {
          const u = await uResp.json();
          this.user = { name: u.name || u.email || 'Google User', email: u.email || '', picture: u.picture || '' };
        } else {
          this.user = { name: 'Google Account', email: '', picture: '' };
        }
        await this.findCloudSave();
        this.lastStatus = state.lang === 'zh' ? '✅ Google 账号已连接！' : '✅ Connected to Google!';
      } catch (e) {
        if (e && e.message === 'CSP_OR_OFFLINE') {
          this.cspBlocked = true;
          this.lastError = T().modals.cloudCspNotice;
        } else {
          this.lastError = (state.lang === 'zh' ? '登录失败：' : 'Sign-in failed: ') + (e?.message || e);
        }
      } finally {
        this.busy = false;
        this.refreshModalIfOpen();
      }
    },

    signOut() {
      try {
        if (this.accessToken && window.google?.accounts?.oauth2?.revoke) {
          window.google.accounts.oauth2.revoke(this.accessToken, () => {});
        }
      } catch (e) {}
      this.accessToken = null;
      this.user = null;
      this.fileId = null;
      this.cloudUpdatedAt = null;
      this.lastError = null;
      this.lastStatus = null;
      this.refreshModalIfOpen();
    },

    async findCloudSave() {
      if (!this.accessToken) return null;
      const q = encodeURIComponent(`name='${CLOUD_FILE_NAME}' and trashed=false`);
      const resp = await fetch(
        `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime%20desc`,
        { headers: { Authorization: `Bearer ${this.accessToken}` } }
      );
      if (resp.status === 401) {
        this.signOut();
        throw new Error(state.lang === 'zh' ? '登录已过期，请重新登录 Google 账号。' : 'Session expired—please sign in again.');
      }
      if (!resp.ok) throw new Error(`Drive API ${resp.status}`);
      const data = await resp.json();
      const first = (data.files && data.files[0]) || null;
      this.fileId = first ? first.id : null;
      this.cloudUpdatedAt = first ? first.modifiedTime : null;
      return first;
    },

    async uploadSave(silent = false) {
      if (!this.accessToken) return false;
      if (!silent) { this.busy = true; this.lastError = null; this.lastStatus = null; this.refreshModalIfOpen(); }
      try {
        if (!this.fileId) await this.findCloudSave();
        state.lastSavedAt = new Date().toISOString();
        const metadata = this.fileId
          ? { name: CLOUD_FILE_NAME, mimeType: 'application/json' }
          : { name: CLOUD_FILE_NAME, parents: ['appDataFolder'], mimeType: 'application/json' };
        const boundary = 'pv_cloud_boundary_7f9a2';
        const body =
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
          `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(state)}\r\n` +
          `--${boundary}--`;
        const url = this.fileId
          ? `https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=multipart&fields=id,modifiedTime`
          : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime`;
        const resp = await fetch(url, {
          method: this.fileId ? 'PATCH' : 'POST',
          headers: {
            Authorization: `Bearer ${this.accessToken}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body
        });
        if (resp.status === 401) {
          this.signOut();
          throw new Error(state.lang === 'zh' ? '登录已过期，请重新登录。' : 'Session expired—please sign in again.');
        }
        if (!resp.ok) throw new Error(`Upload error ${resp.status}`);
        const saved = await resp.json();
        this.fileId = saved.id;
        this.cloudUpdatedAt = saved.modifiedTime || state.lastSavedAt;
        if (!silent) {
          this.lastStatus = state.lang === 'zh' ? '☁️ 已上传到 Google 云端！' : '☁️ Uploaded to Google Cloud!';
          AudioFX.coin();
        }
        return true;
      } catch (e) {
        if (!silent) this.lastError = (state.lang === 'zh' ? '上传失败：' : 'Upload failed: ') + (e?.message || e);
        return false;
      } finally {
        if (!silent) { this.busy = false; this.refreshModalIfOpen(); }
      }
    },

    async restoreSave() {
      if (!this.accessToken) return false;
      this.busy = true;
      this.lastError = null;
      this.lastStatus = null;
      this.refreshModalIfOpen();
      try {
        const meta = await this.findCloudSave();
        if (!meta) {
          this.lastError = T().modals.cloudNotFound;
          return false;
        }
        const resp = await fetch(`https://www.googleapis.com/drive/v3/files/${meta.id}?alt=media`, {
          headers: { Authorization: `Bearer ${this.accessToken}` }
        });
        if (!resp.ok) throw new Error(`Download error ${resp.status}`);
        const parsed = await resp.json();
        if (!applyRestoredState(parsed)) throw new Error(T().modals.importErr);
        this.lastStatus = state.lang === 'zh' ? '✅ 已从 Google 云端恢复存档！' : '✅ Restored save from Google Cloud!';
        AudioFX.morning();
        addFloatText(state.player.x, state.player.y - 28, '☁️ OK!', '#60a5fa');
        return true;
      } catch (e) {
        this.lastError = (state.lang === 'zh' ? '恢复失败：' : 'Restore failed: ') + (e?.message || e);
        return false;
      } finally {
        this.busy = false;
        this.refreshModalIfOpen();
      }
    }
  };

        if (applyRestoredState(parsed)) {

          addFloatText(state.player.x, state.player.y - 28, T().modals.importOk, '#34d399');

        } else {
          GoogleCloudSave.lastError = T().modals.importErr;
          if (document.getElementById('pvSaveCloudRoot')) openSaveCloudModal();
        }
      } catch (e) {
        GoogleCloudSave.lastError = T().modals.importErr;
        if (document.getElementById('pvSaveCloudRoot')) openSaveCloudModal();
      }
    };
    reader.readAsText(file);

  function T() { return I18N[state.lang === 'en' ? 'en' : 'zh']; }

  function isWinter(sIdx = state.seasonIdx) { return SEASONS[sIdx % SEASONS.length].id === 'winter'; }
  function getWeatherKey(w = state.weather, sIdx = state.seasonIdx) { return (w === 'rainy' && isWinter(sIdx)) ? 'snowy' : (w || 'sunny'); }
  function getWeatherIcon(w = state.weather, sIdx = state.seasonIdx) {
    const k = getWeatherKey(w, sIdx);
    return ({ sunny: '☀️', cloudy: '☁️', breezy: '🍃', rainy: '🌧️', snowy: '❄️' })[k] || '☀️';
  }
  function getOutfitList(gender = state.gender) { return gender === 'male' ? BOY_OUTFITS : DRESS_THEMES; }
  function getDress(gender = state.gender, idx = state.dressIdx) {
    const list = getOutfitList(gender);
    return list[((idx || 0) % list.length + list.length) % list.length];
  }
  function getCanCapacity() { return state.canLevel === 1 ? 20 : state.canLevel === 2 ? 36 : 60; }
  function getTileData(x, y) { return state.farm[`${x},${y}`] || null; }
  function ensureTileData(x, y) {
    const k = `${x},${y}`;
    if (!state.farm[k]) state.farm[k] = { tilled: false, watered: false, crop: null, debris: null, placeable: null };
    return state.farm[k];
  }

  function getItemMeta(id) {
    if (CROPS[id]) return { ...CROPS[id], source: 'crop' };
    if (FISH[id]) return { ...FISH[id], source: 'fish' };
    if (ITEMS[id]) return { ...ITEMS[id], source: ITEMS[id].kind };
    if (RECIPE_MAP[id]) return { ...RECIPE_MAP[id], source: 'dish' };
    if (TAG_INGREDIENTS[id]) return { ...TAG_INGREDIENTS[id], source: 'tag' };
    return null;
  }

  function getSellValue(id, quality = 0) {
    if (CROPS[id]) {
      let val = CROPS[id].sellPrice;
      if (getSeason().bonus.includes(id)) val = Math.round(val * 1.2);
      if (quality === 1) val = Math.round(val * 1.5);
      return val;
    }
    if (FISH[id]) {
      let val = FISH[id].sellPrice;
      if (quality === 1) val = Math.round(val * 1.5);
      return val;
    }
    if (ITEMS[id]) {
      let val = ITEMS[id].sellPrice;
      if (quality === 1) val = Math.round(val * 1.5);
      return val;
    }
    if (RECIPE_MAP[id]) return RECIPE_MAP[id].sellPrice;
    return 0;
  }

  // Ingredient counting & consumption for cooking (supports crops, fish, produce, pantry, and flexible tags!)
  function getAvailableIngredientCount(ingId) {
    if (TAG_INGREDIENTS[ingId]) {
      return TAG_INGREDIENTS[ingId].ids.reduce((sum, subId) => sum + getAvailableIngredientCount(subId), 0);
    }
    if (ITEMS[ingId] && ITEMS[ingId].kind === 'pantry') {
      return state.pantry[ingId] || 0;
    }
    const normal = state.satchel[`${ingId}_0`] || 0;
    const gold = state.satchel[`${ingId}_1`] || 0;
    const pantryExtra = state.pantry[ingId] || 0;
    return normal + gold + pantryExtra;
  }

  function consumeIngredient(ingId, qty) {
    let rem = qty;
    if (TAG_INGREDIENTS[ingId]) {
      // Consume lowest-value matching item first to protect rare fish like Golden Carp!
      const sorted = [...TAG_INGREDIENTS[ingId].ids].sort((a, b) => getSellValue(a, 0) - getSellValue(b, 0));
      for (const subId of sorted) {
        if (rem <= 0) break;
        const avail = getAvailableIngredientCount(subId);
        if (avail > 0) {
          const take = Math.min(rem, avail);
          consumeIngredient(subId, take);
          rem -= take;
        }
      }
      return;
    }
    if (state.pantry[ingId]) {
      const take = Math.min(rem, state.pantry[ingId]);
      state.pantry[ingId] -= take;
      if (state.pantry[ingId] <= 0) delete state.pantry[ingId];
      rem -= take;
    }
    for (const q of [0, 1]) {
      if (rem <= 0) break;
      const k = `${ingId}_${q}`;
      if (state.satchel[k]) {
        const take = Math.min(rem, state.satchel[k]);
        state.satchel[k] -= take;
        if (state.satchel[k] <= 0) delete state.satchel[k];
        rem -= take;
      }
    }
  }

  function canCookRecipe(recipe) {
    for (const [ing, qty] of Object.entries(recipe.ingredients)) {
      if (getAvailableIngredientCount(ing) < qty) return false;
    }
    return true;
  }

  // =========================================================================
  // HOTBAR SLOTS (6 tools/placeables + 10 seeds = 16 clean slots!)
  // =========================================================================
  function getAllHotbarSlots() {
    const tr = T().tools;
    const hoeName = tr.hoe[state.hoeLevel - 1];
    const canName = tr.can[state.canLevel - 1];
    const sprCount = state.placeables.sprinkler || 0;
    const lanCount = state.placeables.lantern || 0;

    const toolSlots = [
      { id: 'hoe', kind: 'tool', label: hoeName, icon: '⛏️', count: null, desc: `${hoeName} (Lv.${state.hoeLevel}) — ${tr.hoeDesc[state.hoeLevel - 1]}` },
      { id: 'can', kind: 'tool', label: canName, icon: '🚿', count: `${state.water}`, desc: `${canName} (${state.water}/${getCanCapacity()}) — ${tr.canDesc[state.canLevel - 1]}` },
      { id: 'scythe', kind: 'tool', label: tr.scythe, icon: '🌿', count: null, desc: `${tr.scythe} — ${tr.scytheDesc}` },
      { id: 'rod', kind: 'tool', label: tr.rod, icon: '🎣', count: null, desc: tr.rodDesc },
      { id: 'sprinkler', kind: 'placeable', label: tr.sprinkler, icon: '💦', count: sprCount, desc: tr.sprinklerDesc(sprCount) },
      { id: 'lantern', kind: 'placeable', label: tr.lantern, icon: '🏮', count: lanCount, desc: tr.lanternDesc(lanCount) }
    ];

    const seedSlots = CROP_ORDER.map(cid => {
      const c = CROPS[cid], cname = L(c.name), cnt = state.seeds[cid] || 0;
      return {
        id: cid, kind: 'seed', label: cname, icon: c.emoji, count: cnt,
        desc: tr.seedDesc(cname, cnt, c.days, getSellValue(cid, 0), c.regrow)
      };
    });

    return { toolSlots, seedSlots, all: [...toolSlots, ...seedSlots] };
  }

  // =========================================================================
  // PARTICLES, FLOATING TEXT & AMBIENT
  // =========================================================================
  const particles = [];
  const floatingTexts = [];
  const ambientDrops = [];
  const smokePuffs = [];

  function spawnParticles(wx, wy, color, count = 8, speed = 1.6, size = 3.5) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 0.9) * speed;
      particles.push({ x: wx, y: wy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2, g: 0.11, life: 1, decay: 0.028 + Math.random() * 0.024, color, size: size + Math.random() * 1.4 });
    }
  }
  function addFloatText(wx, wy, text, color = '#fffdf2') {
    floatingTexts.push({ x: wx, y: wy, text, color, life: 1, vy: -0.5 });
  }

  // =========================================================================
  // CANVAS SETUP & INPUT
  // =========================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = CANVAS_W * DPR;
  canvas.height = CANVAS_H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const keys = {};
  let mouseTile = { x: -1, y: -1, inside: false };
  let walkTarget = null;
  let modalOpen = false;
  let isTransitioning = false;

  // Fishing Mini-game State & Pond Fish Shadows
  const fishing = {
    phase: 'idle', // 'idle' | 'waiting' | 'bite' | 'reeling'
    bobberX: 0, bobberY: 0,
    timer: 0,
    fishId: null,
    barPos: 0.5,      // 0 (bottom) .. 1 (top)
    barVel: 0,
    barHeight: 0.27,  // forgiving cozy green zone height
    fishPos: 0.45,
    fishTarget: 0.5,
    fishWait: 0,
    progress: 0.28,
    hold: false
  };
  const pondFishShadows = [];
  function resetPondFishShadows(area = state.area) {
    const b = area === 'pasture'
      ? { minX: 18.6, maxX: 21.4, minY: 8.8, maxY: 12.6 }
      : getFarmLayout().pondBounds;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
    pondFishShadows.length = 0;
    pondFishShadows.push(
      { x: (cx - 0.6) * TILE, y: (cy - 0.5) * TILE, ang: 0.4, speed: 12, phase: 0, size: 1.0 },
      { x: (cx + 0.5) * TILE, y: (cy + 0.4) * TILE, ang: 2.5, speed: 9, phase: 2.1, size: 0.8 },
      { x: cx * TILE, y: (cy + 0.8) * TILE, ang: 4.1, speed: 14, phase: 4.0, size: 1.15 }
    );
  }
  resetPondFishShadows('farm');

  function getSelectedSlot() {
    const all = getAllHotbarSlots().all;
    return all[state.selectedSlot] || all[0];
  }
  function cancelFishing() {
    fishing.phase = 'idle';
    fishing.hold = false;
    fishing.fishId = null;
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modalOpen) { closeModal(); return; }
      if (fishing.phase !== 'idle') { cancelFishing(); AudioFX.ui(); return; }
    }
    if (modalOpen || isTransitioning) return;
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k) || e.key === ' ') e.preventDefault();

    // Fishing active controls
    if (fishing.phase === 'reeling') {
      if (k === ' ') fishing.hold = true;
      return;
    }
    if (fishing.phase === 'bite') {
      if (k === ' ' || k === 'e') { hookBitingFish(); return; }
    }
    if (fishing.phase === 'waiting') {
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) { cancelFishing(); }
      else if (k === ' ' || k === 'e') { cancelFishing(); AudioFX.ui(); return; }
    }

    keys[k] = true;
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) walkTarget = null;

    if (k >= '1' && k <= '9') selectSlot(parseInt(k, 10) - 1);
    else if (k === '0') selectSlot(9);
    else if (k === ' ') performPrimaryAction(getFacedTile().x, getFacedTile().y);
    else if (k === 'e') performSmartInteract();
    else if (k === 'b') state.area === 'pasture' ? openRanchShopModal() : openShopModal();
    else if (k === 'c') openKitchenModal();
    else if (k === 'f') openFishDexModal();
    else if (k === 'i' || k === 'tab') { e.preventDefault(); openSatchelModal(); }
    else if (k === 'm') toggleSound();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (k === ' ') fishing.hold = false;
  });
  window.addEventListener('pointerup', () => { fishing.hold = false; });
  window.addEventListener('pointercancel', () => { fishing.hold = false; });
  window.addEventListener('mouseup', () => { fishing.hold = false; });
  window.addEventListener('touchend', () => { fishing.hold = false; }, { passive: true });
  window.addEventListener('blur', () => { fishing.hold = false; for (const k in keys) keys[k] = false; });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseTile.x = Math.floor(((e.clientX - rect.left) * (CANVAS_W / rect.width)) / TILE);
    mouseTile.y = Math.floor(((e.clientY - rect.top) * (CANVAS_H / rect.height)) / TILE);
    mouseTile.inside = true;
  });
  canvas.addEventListener('mouseleave', () => { mouseTile.inside = false; });
  canvas.addEventListener('wheel', (e) => {
    if (modalOpen || fishing.phase !== 'idle') return;
    e.preventDefault();
    const len = getAllHotbarSlots().all.length;
    selectSlot((state.selectedSlot + (e.deltaY > 0 ? 1 : -1) + len) % len);
  }, { passive: false });
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (!modalOpen && !isTransitioning && fishing.phase === 'idle') handleCanvasClick(e, true);
  });
  canvas.addEventListener('pointerdown', (e) => {
    if (modalOpen || isTransitioning) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType === 'touch') e.preventDefault();
    AudioFX.ensure();
    if (fishing.phase === 'reeling') { fishing.hold = true; return; }
    if (fishing.phase === 'bite') { hookBitingFish(); return; }
    if (fishing.phase === 'waiting') { cancelFishing(); AudioFX.ui(); return; }
    handleCanvasClick(e, false);
  });

  function switchArea(targetArea, spawnX = null, spawnY = null) {
    if (state.area === targetArea || isTransitioning) return;
    cancelFishing();
    state.area = targetArea;
    resetPondFishShadows(targetArea);
    walkTarget = null;
    particles.length = 0;
    if (spawnX !== null && spawnY !== null) {
      state.player.x = spawnX; state.player.y = spawnY;
    } else if (targetArea === 'pasture') {
      state.player.x = 1.6 * TILE; state.player.y = 5.6 * TILE; state.player.dir = 'right';
    } else {
      state.player.x = 22.2 * TILE; state.player.y = 5.6 * TILE; state.player.dir = 'left';
    }
    syncPetNearPlayer();
    AudioFX.ui();
    updateHUD();
  }

  function handleCanvasClick(e, isRightClick) {
    AudioFX.ensure();
    const isTouch = e.pointerType === 'touch';
    const hitPad = isTouch ? 12 : 0;
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
    const sy = (e.clientY - rect.top) * (CANVAS_H / rect.height);
    const tx = Math.floor(sx / TILE), ty = Math.floor(sy / TILE);
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;

    const ptx = state.player.x / TILE, pty = state.player.y / TILE;
    const dist = Math.hypot(tx + 0.5 - ptx, ty + 0.5 - pty);

    // Check Farm Pet Companion clicked directly (either Farm or Pasture!)
    if (state.pet && state.pet.type && Math.hypot(petAI.x - sx, petAI.y - sy) < 22 + hitPad) {
      if (Math.hypot(petAI.x - state.player.x, petAI.y - state.player.y) < 85) interactWithPet();
      else walkTarget = { x: petAI.x, y: petAI.y, stopDist: 0.9, onArrive: () => interactWithPet() };
      return;
    }

    // Check Pasture drops or Animals clicked directly!
    if (state.area === 'pasture') {
      const drop = state.pastureDrops.find(d => Math.hypot(d.x - sx, d.y - sy) < 22 + hitPad);
      if (drop) {
        if (Math.hypot(drop.x - state.player.x, drop.y - state.player.y) < 70) collectDrop(drop.id);
        else walkTarget = { x: drop.x, y: drop.y, stopDist: 0.4, onArrive: () => collectDrop(drop.id) };
        return;
      }
      const ani = state.animals.find(a => Math.hypot(a.x - sx, a.y - sy) < 24 + hitPad);
      if (ani) {
        if (Math.hypot(ani.x - state.player.x, ani.y - state.player.y) < 75) petOrFeedAnimal(ani);
        else walkTarget = { x: ani.x, y: ani.y, stopDist: 0.9, onArrive: () => petOrFeedAnimal(ani) };
        return;
      }
    }

    const lm = getLandmarkAt(tx, ty);
    if (lm) {
      if (dist <= 3.2) { faceToward(tx, ty); triggerLandmark(lm); }
      else {
        const dest = getLandmarkStandTile(lm);
        walkTarget = { x: (dest.x + 0.5) * TILE, y: (dest.y + 0.5) * TILE, onArrive: () => { faceToward(tx, ty); triggerLandmark(lm); } };
      }
      return;
    }

    if (curMap()[ty][tx] === TILE_TYPE.WATER) {
      const wantFish = getSelectedSlot().id === 'rod';
      if (dist <= 2.9) {
        faceToward(tx, ty);
        if (wantFish) startFishingCast(tx, ty);
        else refillWater();
      } else {
        let standX = 17.3, standY = 11.5, castX = 19, castY = 11;
        if (state.area === 'farm') {
          const lay = getFarmLayout();
          const pondCenterX = (lay.pondRect.x1 + lay.pondRect.x2) / 2;
          const pondEast = pondCenterX > lay.docks[0][0];
          standX = pondEast ? (lay.docks[1][0] - 0.2) : (lay.docks[0][0] + 0.6);
          standY = lay.docks[0][1] + 0.5;
          castX = pondEast ? (lay.docks[1][0] + 1) : (lay.docks[0][0] - 1);
          castY = lay.docks[0][1];
        }
        walkTarget = {
          x: standX * TILE, y: standY * TILE,
          onArrive: () => {
            faceToward(castX, castY);
            if (wantFish) startFishingCast(castX, castY);
            else refillWater();
          }
        };
      }
      return;
    }

    if (state.area === 'farm' && dist <= 2.15) {
      faceToward(tx, ty);
      if (isRightClick) tryHarvestOrInteractTile(tx, ty);
      else performPrimaryAction(tx, ty);
    } else {
      const stopDist = (state.area === 'farm' && curMap()[ty][tx] === TILE_TYPE.FARMABLE) ? 1.05 : 0.2;
      walkTarget = {
        x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, stopDist,
        onArrive: () => {
          if (state.area === 'farm' && curMap()[ty][tx] === TILE_TYPE.FARMABLE) {
            faceToward(tx, ty);
            if (isRightClick) tryHarvestOrInteractTile(tx, ty);
            else performPrimaryAction(tx, ty);
          }
        }
      };
    }
  }

  function faceToward(tx, ty) {
    const dx = (tx + 0.5) * TILE - state.player.x, dy = (ty + 0.5) * TILE - state.player.y;
    if (Math.abs(dx) > Math.abs(dy)) state.player.dir = dx >= 0 ? 'right' : 'left';
    else state.player.dir = dy >= 0 ? 'down' : 'up';
  }
  function getFacedTile() {
    const cx = Math.floor(state.player.x / TILE), cy = Math.floor(state.player.y / TILE);
    if (state.player.dir === 'up') return { x: cx, y: cy - 1 };
    if (state.player.dir === 'down') return { x: cx, y: cy + 1 };
    if (state.player.dir === 'left') return { x: cx - 1, y: cy };
    return { x: cx + 1, y: cy };
  }

  // =========================================================================
  // LANDMARKS & INTERACTION (Both Areas)
  // =========================================================================
  function getLandmarkAt(tx, ty) {
    if (state.area === 'farm') {
      const lay = getFarmLayout();
      if (tx >= lay.cottage.x && tx <= lay.cottage.x + 3 && ty >= lay.cottage.y && ty <= lay.cottage.y + 2) return 'cottage';
      if (tx === lay.petBed.x && ty === lay.petBed.y) return 'petBed';
      if (tx === lay.mailbox.x && ty === lay.mailbox.y) return 'mailbox';
      if (tx === lay.shipping.x && ty === lay.shipping.y) return 'shipping';
      if (tx >= lay.shop.x && tx <= lay.shop.x + 4 && ty >= lay.shop.y && ty <= lay.shop.y + 2) return 'shop';
      if ((tx === lay.signpost.x && ty === lay.signpost.y) || (tx === 23 && ty >= 5 && ty <= 7)) return 'gateToPasture';
    } else {
      if (tx >= 3 && tx <= 7 && ty >= 2 && ty <= 4) return 'barn';
      if ((tx === 9 || tx === 10) && ty === 4) return 'trough';
      if (tx >= 15 && tx <= 20 && ty >= 2 && ty <= 4) return 'ranchShop';
      if ((tx === 1 && ty === 4) || (tx === 0 && ty >= 5 && ty <= 7)) return 'gateToFarm';
    }
    return null;
  }

  function getLandmarkStandTile(lm) {
    const lay = getFarmLayout();
    const map = {
      cottage: { x: lay.cottage.x + 1.5, y: lay.cottage.y + 3 },
      petBed: { x: lay.petBed.standX, y: lay.petBed.standY },
      mailbox: { x: lay.mailbox.x, y: lay.mailbox.y + 1 },
      shipping: { x: lay.shipping.x, y: lay.shipping.y + 1 },
      shop: { x: lay.shop.x + 2, y: lay.shop.y + 3 },
      gateToPasture: { x: 22.2, y: 5.5 },
      barn: { x: 5, y: 5 }, trough: { x: 9.5, y: 5 }, ranchShop: { x: 17.5, y: 5 },
      gateToFarm: { x: 1.5, y: 5.5 }
    };
    return map[lm] || { x: lay.spawn.x, y: lay.spawn.y };
  }

  function triggerLandmark(lm) {
    if (lm === 'cottage') openCottageModal();
    else if (lm === 'petBed') openPetModal();
    else if (lm === 'shop') openShopModal();
    else if (lm === 'shipping') shipAllFromSatchel();
    else if (lm === 'mailbox') openMailboxModal();
    else if (lm === 'gateToPasture') switchArea('pasture');
    else if (lm === 'gateToFarm') switchArea('farm');
    else if (lm === 'barn') openBarnModal();
    else if (lm === 'trough') feedAllHungryAnimals();
    else if (lm === 'ranchShop') openRanchShopModal();
  }

  // =========================================================================
  // FARM PET COMPANION SYSTEM (Adoption, Follow/Idle AI, Affection & Gifts)
  // =========================================================================
  function interactWithPet() {
    if (!state.pet || !state.pet.type) { openPetModal(); return; }
    const meta = PETS[state.pet.type];
    const pname = L(meta.name);
    if (state.pet.hasGift) {
      claimPetGift();
      return;
    }
    if (!state.pet.pettedToday) {
      state.pet.pettedToday = true;
      state.pet.affection = (state.pet.affection || 0) + 1;
      AudioFX.pet();
      spawnParticles(petAI.x, petAI.y - 12, '#ff8fab', 12, 1.9, 3.4);
      addFloatText(petAI.x, petAI.y - 24, T().floats.petAffectionUp(pname, state.pet.affection), '#ffd6e0');
      saveState(true);
    } else {
      AudioFX.pet();
      spawnParticles(petAI.x, petAI.y - 10, '#ffb3c6', 8, 1.5, 3.0);
      addFloatText(petAI.x, petAI.y - 22, T().floats.petPurr(pname), '#ffe3ec');
    }
    petAI.idleMode = 'wag';
    petAI.idleTimer = 1.5;
  }

  function claimPetGift() {
    if (!state.pet || !state.pet.hasGift) return;
    state.pet.hasGift = false;
    const roll = Math.random();
    let rewardLabel = '';
    if (roll < 0.42) {
      const coins = 18 + Math.floor(Math.random() * 22);
      state.gold += coins;
      state.lifetimeGold += coins;
      rewardLabel = `🪙 +${coins}g`;
    } else if (roll < 0.78) {
      const pool = ['turnip', 'wheat', 'radish', 'carrot', 'tomato', 'strawberry'];
      const cid = pool[Math.floor(Math.random() * pool.length)];
      const qty = Math.random() < 0.4 ? 2 : 1;
      state.seeds[cid] = (state.seeds[cid] || 0) + qty;
      rewardLabel = `${CROPS[cid].emoji} ${L(CROPS[cid].name)} ×${qty}`;
      renderHotbar();
    } else {
      // Sweet wildflower honey or wildflower gift -> honey jar!
      state.pantry.honey = (state.pantry.honey || 0) + 1;
      rewardLabel = `🍯 ${L(ITEMS.honey.name)} ×1`;
    }
    AudioFX.coin();
    spawnParticles(petAI.x, petAI.y - 12, '#fde047', 14, 2.0, 3.2);
    addFloatText(petAI.x, petAI.y - 26, T().floats.petGiftClaimed(rewardLabel), '#fef08a');
    saveState(true);
    updateHUD();
  }

  function updatePetAI(dt, playerMoved) {
    if (!state.pet || !state.pet.type) return;
    const dx = state.player.x - petAI.x;
    const dy = (state.player.y + 4) - petAI.y;
    const dist = Math.hypot(dx, dy);

    if (playerMoved || dist > 44) {
      petAI.idleTimer = 0;
      petAI.idleMode = 'follow';
      if (dist > 34) {
        const speed = Math.min(132, 68 + (dist - 34) * 1.8) * dt;
        const stepX = (dx / dist) * speed, stepY = (dy / dist) * speed;
        petAI.x += stepX;
        petAI.y += stepY;
        if (Math.abs(dx) > 2) petAI.dir = dx >= 0 ? 1 : -1;
        petAI.walkFrame += dt * 11;
        petAI.walkAccum += Math.hypot(stepX, stepY);

        // Once per day while strolling around, pet sniffs out a little gift!
        if (!state.pet.giftFoundToday && petAI.walkAccum > 260) {
          state.pet.giftFoundToday = true;
          state.pet.hasGift = true;
          AudioFX.harvest();
          spawnParticles(petAI.x, petAI.y - 8, '#fef08a', 10, 1.7, 3);
          addFloatText(petAI.x, petAI.y - 24, T().floats.petFoundGift(L(PETS[state.pet.type].name)), '#fef08a');
          saveState(true);
        }
      } else {
        petAI.walkFrame = 0;
      }
    } else {
      petAI.walkFrame = 0;
      petAI.idleTimer += dt;
      // After standing still > 3 seconds, trigger cute idle behavior (nap / wag / butterfly chase)!
      if (petAI.idleTimer > 3.0) {
        if (petAI.idleMode === 'follow') {
          const modes = ['nap', 'wag', 'butterfly'];
          petAI.idleMode = modes[Math.floor(Math.random() * modes.length)];
          petAI.idleCycleTimer = 6.5 + Math.random() * 4;
        } else {
          petAI.idleCycleTimer -= dt;
          if (petAI.idleCycleTimer <= 0) {
            const modes = ['nap', 'wag', 'butterfly'];
            petAI.idleMode = modes[Math.floor(Math.random() * modes.length)];
            petAI.idleCycleTimer = 6.5 + Math.random() * 4;
          }
        }
      }
      if (petAI.idleMode === 'butterfly') {
        petAI.butterflyAngle += dt * 2.8;
        petAI.dir = Math.cos(petAI.butterflyAngle) >= 0 ? 1 : -1;
      }
    }
  }

  function drawPetBed() {
    const pb = getFarmLayout().petBed;
    const px = (pb.x + 0.5) * TILE, py = (pb.y + 0.45) * TILE;
    // Soft shadow
    ctx.fillStyle = 'rgba(56, 40, 25, 0.16)';
    ctx.beginPath(); ctx.ellipse(px, py + 5, 14, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    // Woven wicker basket rim
    ctx.fillStyle = '#c99763'; ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(px, py + 1, 13.5, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Soft rose-cream cushion inside
    ctx.fillStyle = '#fce1e4';
    ctx.beginPath(); ctx.ellipse(px, py + 0.5, 9.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
    // Inviting paw bubble before adoption!
    if (!state.pet || !state.pet.type) {
      const bob = Math.sin(animTime * 4) * 2.5;
      ctx.fillStyle = '#fffdf5'; ctx.strokeStyle = '#e07a5f'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(px, py - 15 + bob, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('🐾', px, py - 11.5 + bob);
    }
  }

  // Hand-drawn storybook pet renderer (works on main canvas AND portrait mini-canvases!)
  function drawPetSprite(c, type, x, y, dir = 1, walkFrame = 0, idleMode = 'follow', hasGift = false, scale = 1) {
    const hopping = walkFrame > 0 ? Math.abs(Math.sin(walkFrame)) * (type === 'bunny' ? -4.2 : -2.2) : (idleMode === 'butterfly' ? Math.abs(Math.sin(animTime * 6)) * -3.0 : 0);
    const isNap = idleMode === 'nap';
    const wag = Math.sin(animTime * (idleMode === 'wag' ? 14 : 6)) * (idleMode === 'wag' ? 4 : 2);

    c.save();
    c.translate(x, y);
    c.scale(scale, scale);

    // Shadow
    c.fillStyle = 'rgba(56, 40, 25, 0.2)';
    c.beginPath(); c.ellipse(0, 5.5, 9.5, 3.6, 0, 0, Math.PI * 2); c.fill();

    c.save();
    c.translate(0, hopping);
    c.scale(dir, 1);
    c.strokeStyle = INK; c.lineWidth = 1.2;

    if (type === 'calico') {
      // Tail curling happily
      c.strokeStyle = '#d98a4e'; c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-7, 1); c.quadraticCurveTo(-13, -4 + wag * 0.5, -10, -9 + wag * 0.6); c.stroke();
      c.lineCap = 'butt'; c.strokeStyle = INK; c.lineWidth = 1.2;
      // Plump creamy calico body
      c.fillStyle = '#fffdf7';
      c.beginPath(); c.ellipse(0, isNap ? 2 : 0, isNap ? 9.5 : 8, isNap ? 5.5 : 6, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      // Cute ginger & cocoa patches
      c.fillStyle = '#eb9454'; c.beginPath(); c.ellipse(-3, -1, 3.5, 2.8, 0.3, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#6b4936'; c.beginPath(); c.ellipse(2, 1, 2.5, 2, -0.2, 0, Math.PI * 2); c.fill();
      // Head
      const hx = isNap ? 5 : 4.5, hy = isNap ? 0 : -6;
      c.fillStyle = '#fffdf7'; c.beginPath(); c.arc(hx, hy, 5.6, 0, Math.PI * 2); c.fill(); c.stroke();
      // Ears
      c.fillStyle = '#eb9454';
      c.beginPath(); c.moveTo(hx - 4, hy - 3); c.lineTo(hx - 5, hy - 9); c.lineTo(hx - 0.5, hy - 5); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#6b4936';
      c.beginPath(); c.moveTo(hx + 1, hy - 5); c.lineTo(hx + 5, hy - 9); c.lineTo(hx + 4.5, hy - 3); c.closePath(); c.fill(); c.stroke();
      // Face
      if (isNap) {
        c.strokeStyle = INK; c.lineWidth = 1.1;
        c.beginPath(); c.arc(hx + 2, hy, 1.5, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
      } else {
        c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(hx + 2.2, hy - 0.5, 1.2, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#f5a3b0'; c.beginPath(); c.arc(hx + 4.2, hy + 1.2, 1.1, 0, Math.PI * 2); c.fill();
      }
    } else if (type === 'corgi') {
      // Fluffy wiggly nub tail
      c.fillStyle = '#e8a258'; c.beginPath(); c.arc(-9.5, -1 + wag * 0.4, 3, 0, Math.PI * 2); c.fill(); c.stroke();
      // Little paws
      if (!isNap) {
        c.fillStyle = '#fffdf7';
        c.fillRect(-5, 3, 3, 3.5); c.fillRect(3, 3, 3, 3.5);
      }
      // Golden corgi loaf body + white chest
      c.fillStyle = '#e8a258';
      c.beginPath(); c.ellipse(-0.5, isNap ? 2 : 0.5, isNap ? 10 : 9, isNap ? 5.5 : 5.8, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = '#fffdf7';
      c.beginPath(); c.ellipse(5, isNap ? 2.5 : 1.5, 4.2, 4.2, 0, 0, Math.PI * 2); c.fill();
      // Head + big iconic Corgi ears
      const hx = isNap ? 6 : 5.5, hy = isNap ? -0.5 : -6;
      c.fillStyle = '#e8a258'; c.beginPath(); c.arc(hx, hy, 5.8, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(hx - 3.5, hy - 6.8, 2.5, 4.6, -0.35, 0, Math.PI * 2); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(hx + 2.5, hy - 7.2, 2.5, 4.6, 0.25, 0, Math.PI * 2); c.fill(); c.stroke();
      // Cream muzzle & nose
      c.fillStyle = '#fffdf7'; c.beginPath(); c.ellipse(hx + 3.5, hy + 1.5, 3.2, 2.2, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#3a2416'; c.beginPath(); c.arc(hx + 5.8, hy + 0.8, 1.3, 0, Math.PI * 2); c.fill();
      if (isNap) {
        c.strokeStyle = INK; c.lineWidth = 1.1; c.beginPath(); c.arc(hx + 1.8, hy - 0.8, 1.5, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
      } else {
        c.fillStyle = '#2d1c10'; c.beginPath(); c.arc(hx + 1.8, hy - 1.2, 1.3, 0, Math.PI * 2); c.fill();
      }
    } else {
      // Lop Bunny (垂耳兔)
      // Cotton puff tail
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(-7.5, 1 + wag * 0.2, 3.2, 0, Math.PI * 2); c.fill(); c.stroke();
      // Round fluffy cream body
      c.fillStyle = '#f8ecd8';
      c.beginPath(); c.ellipse(0, isNap ? 2 : 0.5, isNap ? 8.8 : 7.6, isNap ? 5.5 : 6.2, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      const hx = isNap ? 4.8 : 4.2, hy = isNap ? 0 : -5.8;
      c.fillStyle = '#f8ecd8'; c.beginPath(); c.arc(hx, hy, 5.4, 0, Math.PI * 2); c.fill(); c.stroke();
      // Iconic long floppy lop ears!
      c.fillStyle = '#e8d2b5';
      c.beginPath(); c.ellipse(hx - 2.6, hy + 2.2 + wag * 0.25, 2.6, 5.8, 0.25, 0, Math.PI * 2); c.fill(); c.stroke();
      // Rosy nose & eye
      c.fillStyle = '#f5a3b0'; c.beginPath(); c.arc(hx + 4.8, hy + 0.6, 1.2, 0, Math.PI * 2); c.fill();
      if (isNap) {
        c.strokeStyle = INK; c.lineWidth = 1.1; c.beginPath(); c.arc(hx + 1.8, hy - 0.8, 1.4, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
      } else {
        c.fillStyle = '#3a2416'; c.beginPath(); c.arc(hx + 1.8, hy - 1, 1.25, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();

    // Idle visual cues: zZz when napping, fluttering butterfly when chasing!
    if (isNap) {
      const zBob = (animTime * 10) % 12;
      c.fillStyle = '#fffdf5'; c.strokeStyle = '#5c4632'; c.lineWidth = 2;
      c.font = 'bold 9px sans-serif'; c.textAlign = 'center';
      c.strokeText('zZz', 8, -12 - zBob * 0.6); c.fillText('zZz', 8, -12 - zBob * 0.6);
    } else if (idleMode === 'butterfly') {
      const bx = Math.cos(petAI.butterflyAngle) * 18, by = -18 + Math.sin(petAI.butterflyAngle * 2) * 5;
      const flap = Math.abs(Math.sin(animTime * 16));
      c.fillStyle = '#ffccd5';
      c.beginPath(); c.ellipse(bx - 2.5, by, 3.2 * flap + 1, 2.4, -0.3, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffe599';
      c.beginPath(); c.ellipse(bx + 2.5, by, 3.2 * flap + 1, 2.4, 0.3, 0, Math.PI * 2); c.fill();
    }

    // Bouncing Gift Bubble when pet found a daily gift!
    if (hasGift) {
      const gb = Math.sin(animTime * 5) * 2.5;
      c.fillStyle = '#fff9d6'; c.strokeStyle = '#d97706'; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, -24 + gb, 9, 0, Math.PI * 2); c.fill(); c.stroke();
      c.font = '11px sans-serif'; c.textAlign = 'center';
      c.fillText('🎁', 0, -20 + gb);
    }
    c.restore();
  }
